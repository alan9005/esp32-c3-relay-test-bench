esphome:
  name: water-ctrl-board
  friendly_name: water-ctrl-board

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable Home Assistant API
#api:
#  encryption:
#    key: "LFnSrHGoUvZKoCdWzAYj5MKWT9FG8zdDfPXJ0EGrBGo="

ota:
  - platform: esphome
    password: "ee398b7e3b5613075cc1fd992f3d3d55"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "water-ctrl Fallback Hotspot"
    password: "12345678"

logger:

captive_portal:

web_server:
  local: true
  
interval:
  - interval: 12s
    then:
      - lambda: |-
          ESP_LOGI("mac", "Wi-Fi MAC Address: %s", id(wifi_mac).state.c_str());
          {
            char buffer[64];
            memset(buffer, 0x00, sizeof(buffer));
            snprintf(buffer, sizeof(buffer), "MAC: %s\r\n", id(wifi_mac).state.c_str());
            uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
          }
          {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              snprintf(buffer, sizeof(buffer), "IP Address: %s\r\n", id(wifi_ip).state.c_str());
              uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
           }
          //id(open_lock).execute(1);
          //ESP_LOGE("","moto-1 auto on");
          //id(moto_ctrl_1).turn_on();
  
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
    mac_address:
      name: "WiFi MAC Address"
      id: wifi_mac

uart:
  - id: debug
    tx_pin: 43
    rx_pin: 44
    baud_rate: 115200
    rx_buffer_size: 256
  - id: uart_1
    tx_pin: 20
    rx_pin: 19
    baud_rate: 9600

sensor:
  - platform: adc
    pin: GPIO4
    name: "DC power voltage"
    update_interval: 6s
    attenuation: 11db
    filters:
      - multiply: 11
    
switch:
  - platform: gpio
    name: GATE_ALL
    pin:
      number: GPIO7
      inverted: true
    id: switch_gpio_1
  - platform: gpio
    name: GATE_A
    pin:
      number: GPIO15
      inverted: true
    id: switch_gpio_2
  - platform: gpio
    name: GATE_B
    pin:
      number: GPIO16
      inverted: true
    id: switch_gpio_3
  - platform: gpio
    name: GATE_C
    pin:
      number: GPIO17
      inverted: true
    id: switch_gpio_4
  - platform: gpio
    name: GATE_D
    pin:
      number: GPIO18
      inverted: true
    id: switch_gpio_5

binary_sensor:
  - platform: gpio
    name: WATER_1_TOP
    pin:
      number: GPIO9
      inverted: true
    id: binary_sensor_gpio_1
  - platform: gpio
    name: WATER_1_BOTTOM
    pin:
      number: GPIO10
      inverted: true
    id: binary_sensor_gpio_2
  - platform: gpio
    name: WATER_2_TOP
    pin:
      number: GPIO11
      inverted: true
    id: binary_sensor_gpio_3
  - platform: gpio
    name: WATER_2_BOTTOM
    pin: GPIO12
    id: binary_sensor_gpio_4
  - platform: gpio
    name: WATER_3_TOP
    pin: GPIO13
    id: binary_sensor_gpio_5
  - platform: gpio
    name: WATER_3_BOTTOM
    pin: GPIO14
    id: binary_sensor_gpio_6
  - platform: gpio
    name: WATER_4_TOP
    pin: GPIO21
    id: binary_sensor_gpio_7
  - platform: gpio
    name: WATER_4_BOTTOM
    pin: GPIO47
    id: binary_sensor_gpio_8













    

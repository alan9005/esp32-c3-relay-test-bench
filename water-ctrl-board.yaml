# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: water-ctrl-board
  friendly_name: water-ctrl-board

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "YenisWTpNh5usVjySe4N6PgmxfDIouMVCwbt/hfA6TE="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: water-ctrl-boar Fallback Hotspot
    password: "x9PEBPzWfJmx"
  on_connect:
    - lambda: |-
        char buffer[64];
        memset(buffer, 0x00, sizeof(buffer));
        snprintf(buffer, sizeof(buffer), "wifi connected, IP Address: %s\r\n", id(wifi_ip).state.c_str());
        uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));

captive_portal:

web_server:
  local: true
  
interval:
  - interval: 12s
    then:
      - lambda: |-
          ESP_LOGI("mac", "Wi-Fi MAC Address: %s", id(wifi_mac).state.c_str());
          {
            char buffer[64];
            memset(buffer, 0x00, sizeof(buffer));
            snprintf(buffer, sizeof(buffer), "MAC: %s\r\n", id(wifi_mac).state.c_str());
            uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
          }
          {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              snprintf(buffer, sizeof(buffer), "IP Address: %s\r\n", id(wifi_ip).state.c_str());
              uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
           }
          //id(open_lock).execute(1);
          //ESP_LOGE("","moto-1 auto on");
          //id(moto_ctrl_1).turn_on();
  
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
    mac_address:
      name: "WiFi MAC Address"
      id: wifi_mac


# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

esphome:
  name: esp32-c3-test
  friendly_name: ESP32-C3-test

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "TCU9i9Iu+KdYcBj2jzAHFOV5aPY12G8yufS9MmAx4yo="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32-C3-test Fallback Hotspot
    password: "iYtKDpdejy5r"

captive_portal:

sensor:
  - platform: adc
    pin: GPIO0
    id: sensor_adc_1
  - platform: dht
    pin: GPIO1
    humidity:
      id: sensor_dht_1_humidity
      name: Humidity
    temperature:
      id: sensor_dht_1_temperature
      name: Temperature
    id: sensor_dht_1

switch:
  - platform: gpio
    name: door
    pin: GPIO3
    id: switch_gpio_1

display:
  - platform: tm1637
    clk_pin: GPIO4
    dio_pin: GPIO5
    id: display_tm1637_1

output:
  - platform: gpio
    pin: GPIO6
    id: output_buzzer

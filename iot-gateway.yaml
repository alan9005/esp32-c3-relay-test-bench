#    rmt_channel: 0
    chipset: ws2812
    name: "My Light"

globals:
   - id: my_global_power_on_ticks
     type: unsigned long
     restore_value: no
     initial_value: '0'
   - id: my_uart_recv_delay
     type: int
     restore_value: no
   - id: my_current_slave_id
     type: int
     restore_value: no
     initial_value: '0'

   - id: my_mac_list
     type: int[${MAX_SLAVE_NUM}]
     restore_value: no
#   - id: my_uart_send_buf
#     type: unsigned char[${MAX_UART_SEND_BUF_LEN}]
#     restore_value: no
   - id: my_uart_recv_buf
     type: unsigned char[${MAX_UART_RECV_BUF_LEN}]
     restore_value: no
   - id: my_uart_recv_read
     type: int
     restore_value: no
   - id: my_uart_recv_write
     type: int
     restore_value: no

text_sensor:
  - platform: template
    name: "01-升降柱温湿度"
    id: global_column_temperature
    update_interval: 1s
  - platform: template
    name: "02-压力重量"
    id: global_column_weight
    update_interval: 1s
  - platform: template
    name: "03-检测到漏水"
    id: global_column_water_leak
    update_interval: 1s

  - platform: template
    name: "04-升降柱列表"
    id: global_device_ids
    update_interval: 120s  # 定期更新
    lambda: |-
      std::string device_ids_str;
      char acTempBuf[30];
      for ( int iLoop=0; iLoop<${MAX_SLAVE_NUM};iLoop++ )
      {
        if ( id(my_mac_list)[iLoop] == 0 )
        {
          break;
        }
        memset(acTempBuf, 0x00, sizeof(acTempBuf));
        snprintf(acTempBuf, 30, "%06X", id(my_mac_list)[iLoop]);
        device_ids_str += acTempBuf;
        device_ids_str += "\r\n";
      }
      return device_ids_str;

  - platform: template
    name: "x0-接收内容"
    id: global_column_recv
    update_interval: 1s

text:
  - platform: template
    id: my_text_send
    name: "x1-自定义数据发送"
    optimistic: true
    min_length: 0
    max_length: 254
    mode: text
    on_value:
      then:
        - lambda: |-
            int iLoop;
            char acTempStr[3];
            char acValue[100];
            int iLength;
            int iCnt;
            iLength = strlen(x.c_str());
            iCnt = 0;
            for ( iLoop=0; iLoop < iLength; iLoop+=3 )
            {
              acTempStr[0] = x.c_str()[iLoop];
              acTempStr[1] = x.c_str()[iLoop + 1];
              acTempStr[2] = 0;
              acValue[iCnt] = static_cast<uint8_t>(strtoul(acTempStr, nullptr, 16));
              ESP_LOGD("main", "acValue[%d] 0x%02x", iCnt, acValue[iCnt]); 
              iCnt++;
              if ( iCnt >= sizeof(acValue) )
              {
                break;
              }
            }
            if ( iCnt > 0 )
            {
              ESP_LOGD("main", "iCnt[%d],0x%02x,0x%02x", iCnt, acValue[0], acValue[1]); 
              uart_write_bytes(1, acValue, iCnt);
            }

  - platform: template
    id: my_text_set_device_id
    internal: false
    name: "F0-选择升降柱ID"
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
    on_value:
      then:
        - logger.log:
            format: "%s"
            args: ["x.c_str()"]
        - script.execute:
            id: uart_send_cmd_1_param
            slave_mac: !lambda |-
                        id(my_current_slave_id) = strtol(x.c_str(), NULL, 16);
                        return id(my_current_slave_id);
            cmd: 0x05
            param1: 0


interval:
  - interval: 1s
    then:
      - lambda: |-
         id(my_uart_recv_delay)++;

  - interval: 10ms
    then:
      - lambda: |-
           if ( id(my_global_power_on_ticks) < 0xf0000000 )
           {
            id(my_global_power_on_ticks)++;
           }
           else
           {
            id(my_global_power_on_ticks) = 0;
           }
           if ( (id(my_global_power_on_ticks) % 3000) == 0 )
           {
              if ( id(my_mac_list)[0] == 0 )
              {
                ESP_LOGD("main", "auto get slave ID.");
                id(uart_send_cmd_1_param).execute(0, 0xa1, 0);
              }
           }

status_led:
  pin: 35

output:
  - platform: gpio
    pin: 19
    id: gpio_ES1642_RST


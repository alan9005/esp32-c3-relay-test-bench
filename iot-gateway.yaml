esphome:
  name: iot-gateway
  friendly_name: IOT网关
  on_boot:
   priority: 200
    # ...
   then:
      - uart.write: 
          id: debug
          data: "Iot gateway v1.0.0.1b1 \r\n"
      - lambda: |-
          for ( int iLoop=0; iLoop<${MAX_SLAVE_NUM}; iLoop++ )
          {
            id(my_mac_list)[iLoop] = 0x00;
          }
      - output.turn_on: gpio_ES1642_RST

  on_loop:
    then:
      - script.execute: uart_proc_hex

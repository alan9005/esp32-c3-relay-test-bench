substitutions:
  MAX_UART_RECV_BUF_LEN: "254"
  MAX_UART_SEND_BUF_LEN: "254"
  MAX_SLAVE_NUM: "100"

button:
  - platform: template
    name: "F6-获取状态"
    id: my_button_get_status
    # Optional variables:
    icon: "mdi:emoticon-outline"
    on_press:
        - script.execute:
            id: uart_send_cmd_1_param
            slave_mac: !lambda |-
                        return id(my_current_slave_id);
            cmd: 0x05
            param1: 0

  - platform: template
    name: "F7-获取全部ID"
    id: my_button_get_id
    # Optional variables:
    icon: "mdi:emoticon-outline"
    on_press:
        - script.execute:
            id: uart_send_cmd_1_param
            slave_mac: 0
            cmd: 0xa1
            param1: 0

script:
  - id: uart_send_cmd_move_action
    mode: single
    parameters:
      slave_mac: int
      direction: int
      duration_on: int
      duration_off: int
      timeout: int
    then:
      - lambda: |-
          unsigned char aucTempBuf[20];
          unsigned char crc;
          unsigned char poly;
          int iLoop;
          aucTempBuf[0] = 0x7e;
          aucTempBuf[1] = 0x0d;
          aucTempBuf[2] = (slave_mac >> 16) & 0xff;
          aucTempBuf[3] = (slave_mac >> 8) & 0xff;
          aucTempBuf[4] = slave_mac & 0xff;
          if ( direction == 0 )
          {
            aucTempBuf[5] = 0x02;
          }
          else
          {
            aucTempBuf[5] = 0x01;
          }
          aucTempBuf[6] = (duration_on >> 8) & 0xff;
          aucTempBuf[7] = duration_on  & 0xff;
          aucTempBuf[8] = (duration_off >> 8) & 0xff;
          aucTempBuf[9] = duration_off  & 0xff;
          aucTempBuf[10] = (timeout >> 8) & 0xff;
          aucTempBuf[11] = timeout  & 0xff;
          crc = 0;
          poly = 0x07;
          for ( iLoop=0; iLoop<12; iLoop++ )
          {
            crc ^= aucTempBuf[iLoop];
            for (uint8_t j = 0; j < 8; j++) 
            {
                if (crc & 0x80)
                {
                    crc = (crc << 1) ^ poly;
                } 
                else 
                {
                    crc <<= 1;
                }
            }
          }
          aucTempBuf[iLoop] = crc;
          uart_write_bytes(1, aucTempBuf, 12+1);
          ESP_LOGI("main", "send cmd[%d] to [%02x %02x %02x]", aucTempBuf[5], aucTempBuf[2], aucTempBuf[3], aucTempBuf[4]);

  - id: uart_send_cmd_1_param
    mode: single
    parameters:
      slave_mac: int
      cmd: int
      param1: int
    then:
      - lambda: |-
          unsigned char aucTempBuf[10];
          unsigned char crc;
          unsigned char poly;
          int iLoop;
          aucTempBuf[0] = 0x7e;
          aucTempBuf[1] = 0x08;
          aucTempBuf[2] = (slave_mac >> 16) & 0xff;
          aucTempBuf[3] = (slave_mac >> 8) & 0xff;
          aucTempBuf[4] = slave_mac & 0xff;
          aucTempBuf[5] = cmd & 0xff;
          aucTempBuf[6] = param1 & 0xff;
          crc = 0;
          poly = 0x07;
          for ( iLoop=0; iLoop<7; iLoop++ )
          {
            crc ^= aucTempBuf[iLoop];
            for (uint8_t j = 0; j < 8; j++) 
            {
                if (crc & 0x80)
                {
                    crc = (crc << 1) ^ poly;
                } 
                else 
                {
                    crc <<= 1;
                }
            }
          }
          aucTempBuf[iLoop] = crc;
          uart_write_bytes(1, aucTempBuf, 7+1);
          ESP_LOGI("main", "send cmd[%d] to [%02x %02x %02x]", aucTempBuf[5], aucTempBuf[2], aucTempBuf[3], aucTempBuf[4]);

  - id: uart_proc_hex
    mode: single
    then:
      - lambda: |-
          unsigned char aucData[2];
          int iRecvCnt;
          unsigned char aucTempBuf[${MAX_UART_RECV_BUF_LEN}];
          int iLength = uart_read_bytes(1, aucData, 1, 0);
          if ( iLength > 0 )
          {
            id(my_uart_recv_delay) = 0;
            if ( ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN}) != id(my_uart_recv_read) )
            {
              id(my_uart_recv_buf)[id(my_uart_recv_write)] = aucData[0];
              id(my_uart_recv_write) = ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN});
            }

            if ( id(my_uart_recv_write) >= id(my_uart_recv_read) )
            {
              iRecvCnt = id(my_uart_recv_write) - id(my_uart_recv_read);
            }
            else
            {
              iRecvCnt = id(my_uart_recv_write) + ${MAX_UART_RECV_BUF_LEN} - id(my_uart_recv_read);
            }
            
            int iPos = id(my_uart_recv_read);
            for ( int iLoop=0; iLoop<iRecvCnt; iLoop++ )
            {
              aucTempBuf[iLoop] = id(my_uart_recv_buf)[iPos];
              iPos = ((iPos + 1) % ${MAX_UART_RECV_BUF_LEN});
            }
            if ( iRecvCnt >= 7 )
            {
              if ( (aucTempBuf[0] != 0x7e) || (aucTempBuf[1] >= 255) || (aucTempBuf[1] < 7) )
              {
                //ESP_LOGE("main", "wrong frame [0x%02x][0x%02x][0x%02x][0x%02x][0x%02x][0x%02x][0x%02x]", 
                //              aucTempBuf[0], aucTempBuf[1], aucTempBuf[2], aucTempBuf[3], aucTempBuf[4], aucTempBuf[5], aucTempBuf[6], aucTempBuf[7]);
                //id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
              }
              else
              {
                unsigned char ucLength = aucTempBuf[1];
                unsigned char ucCmd = aucTempBuf[5];
                unsigned char ucCrcSum = aucTempBuf[ucLength - 1];
                unsigned char crc = 0;
                unsigned char poly = 0x07;
                for ( int iLoop=0; iLoop<(ucLength - 1); iLoop++ )
                {
                  crc ^= aucTempBuf[iLoop];
                  for (uint8_t j = 0; j < 8; j++) 
                  {
                      if (crc & 0x80)
                      {
                          crc = (crc << 1) ^ poly;
                      } 
                      else 
                      {
                          crc <<= 1;
                      }
                  }
                }
                if ( iRecvCnt >= ucLength )
                {
                  if ( crc != ucCrcSum )
                  {
                    ESP_LOGI("main", "crc not match [0x%02x] [0x%02x] len[%d]", crc, ucCrcSum, ucLength);
                    id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
                  }
                  else
                  {
                    int param1,param2,param3;
                    int iLoop, iIndex;
                    std::string tmp_str;
                    int iCnt = 0;
                    for (const auto& byte : aucTempBuf) {
                        char buffer[3];
                        snprintf(buffer, sizeof(buffer), "%02x", byte);
                        tmp_str += buffer;
                        tmp_str += " ";
                        iCnt++;
                        if ( iCnt >= ucLength )
                        {
                          break;
                        }
                    }
                    id(global_column_recv).publish_state(tmp_str.c_str());
                    ESP_LOGI("main", "receive data from mac[0x%02x][0x%02x][0x%02x]", aucTempBuf[2],aucTempBuf[3],aucTempBuf[4]);
                    switch ( ucCmd )
                    {
                      case 0xa2:
                        param1 = aucTempBuf[2];
                        param1 <<= 8;
                        param1 += aucTempBuf[3];
                        param1 <<= 8;
                        param1 += aucTempBuf[4];
                        param2 = (${MAX_SLAVE_NUM});
                        for ( iLoop=0; iLoop<(${MAX_SLAVE_NUM}); iLoop++ )
                        {
                          if ( id(my_mac_list)[iLoop] == param1 )
                          {
                            id(uart_send_cmd_1_param).execute(param1, 0x03, 0);
                            break;
                          }
                          if ( (param2 == (${MAX_SLAVE_NUM}) ) && (id(my_mac_list)[iLoop] == 0) )
                          {
                            param2 = iLoop;
                          }
                        }
                        if ( iLoop == (${MAX_SLAVE_NUM}) )
                        {
                          if ( param2 == (${MAX_SLAVE_NUM}) )
                          {
                            ESP_LOGI("main", "the mac list record buffer is full [%d]", param2);
                          }
                          else
                          {
                            id(uart_send_cmd_1_param).execute(param1, 0x03, 0);
                            id(my_mac_list)[param2] = param1;
                            ESP_LOGI("main", "record slave MAC to [%d]", param2);
                          }
                        }
                        {
                          std::string device_ids_str;
                          char acTempBuf[30];
                          for ( int iLoop=0; iLoop<${MAX_SLAVE_NUM};iLoop++ )
                          {
                            if ( id(my_mac_list)[iLoop] == 0 )
                            {
                              break;
                            }
                            memset(acTempBuf, 0x00, sizeof(acTempBuf));
                            snprintf(acTempBuf, 30, "%06X", id(my_mac_list)[iLoop]);
                            device_ids_str += acTempBuf;
                            device_ids_str += "\r\n";
                          }
                          id(global_device_ids).publish_state(device_ids_str.c_str());
                        }
                        break;
                      case 0x06:
                        param1 = aucTempBuf[2];
                        param1 <<= 8;
                        param1 += aucTempBuf[3];
                        param1 <<= 8;
                        param1 += aucTempBuf[4];
                        //iIndex = id(my_slave_index).active_index().value();
                        if ( param1 != id(my_current_slave_id) )
                        {
                            ESP_LOGI("main", "get unknown state report form [0x%06x]", param1);
                        }
                        else
                        {
                            short sValue1, sValue2, sValue3, sValue4;
                            char acTempBuf[30];
                            sValue1 = aucTempBuf[6];
                            sValue1 <<= 8;
                            sValue1 |= aucTempBuf[7];
                            sValue2 = aucTempBuf[8];
                            sValue2 <<= 8;
                            sValue2 |= aucTempBuf[9];
                            sValue3 = aucTempBuf[10];
                            sValue3 <<= 8;
                            sValue3 |= aucTempBuf[11];
                            sValue4 = aucTempBuf[12];
                            sValue4 <<= 8;
                            sValue4 |= aucTempBuf[13];
                            ESP_LOGI("main", "get state report [%d %d %d %d] ", sValue1, sValue2, sValue3, sValue4);

                            memset(acTempBuf, 0x00, sizeof(acTempBuf));
                            snprintf(acTempBuf, 30, "%.1f°c  %.1f%%", (float)sValue1/10, (float)sValue2/10);
                            id(global_column_temperature).publish_state(acTempBuf);
                            memset(acTempBuf, 0x00, sizeof(acTempBuf));
                            snprintf(acTempBuf, 30, "%.1fKg", (float)sValue3/10);
                            id(global_column_weight).publish_state(acTempBuf);
                            if ( sValue4 == 0 )
                            {
                              id(global_column_water_leak).publish_state("否");
                            }
                            else
                            {
                              id(global_column_water_leak).publish_state("是");
                            }
                        }
                        break;

                      default:
                        break;
                    }
                    id(my_uart_recv_read) = iPos;
                  }
                }
              }
            }
          }
          else if ( id(my_uart_recv_delay) > 1 )
          {
            if ( id(my_uart_recv_write) != id(my_uart_recv_read) )
            {
              ESP_LOGD("main", "recv wrong date, recv_write[%d], recv_read[%d], now reset them", id(my_uart_recv_write), id(my_uart_recv_read)); 
              id(my_uart_recv_write) = id(my_uart_recv_read);

              if ( id(my_uart_recv_write) >= id(my_uart_recv_read) )
              {
                iRecvCnt = id(my_uart_recv_write) - id(my_uart_recv_read);
              }
              else
              {
                iRecvCnt = id(my_uart_recv_write) + ${MAX_UART_RECV_BUF_LEN} - id(my_uart_recv_read);
              }
              
              int iPos = id(my_uart_recv_read);
              for ( int iLoop=0; iLoop<iRecvCnt; iLoop++ )
              {
                aucTempBuf[iLoop] = id(my_uart_recv_buf)[iPos];
                iPos = ((iPos + 1) % ${MAX_UART_RECV_BUF_LEN});
              }

              ESP_LOGE("main", "wrong frame [0x%02x][0x%02x][0x%02x][0x%02x][0x%02x],[0x%02x][0x%02x][0x%02x][0x%02x][0x%02x]", 
                            aucTempBuf[0], aucTempBuf[1], aucTempBuf[2], aucTempBuf[3], aucTempBuf[4], aucTempBuf[5], aucTempBuf[6], aucTempBuf[7], aucTempBuf[8], aucTempBuf[9]);

            }
          }

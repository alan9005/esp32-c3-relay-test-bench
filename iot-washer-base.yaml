                //   也擋 UART0 電氣噪音造成的 phantom byte
                //   例外：密碼鍵盤 0x1D~0x28（用戶可能快速按同數字）+ 功能按鈕 0x29~0x31 不去重
                //   啟用範圍：0x01~0x1C（繼電器/SSR/M3~M10）、0x2D/0x2E（M1/M2）
                {
                  uint8_t _btn = aucTempBuf[3];
                  bool _dedup_enabled =
                      (_btn >= 0x01 && _btn <= 0x1C) ||
                      _btn == 0x2D || _btn == 0x2E;
                  if (_dedup_enabled) {
                    uint32_t _now = millis();
                    if (_btn == id(hmi_last_btn) && (_now - id(hmi_last_btn_at)) < 1000) {
                      ESP_LOGW("HMI", "dedup: btn=0x%02X ignored (%ums since last)",
                               _btn, _now - id(hmi_last_btn_at));
                      id(hmi_last_btn_at) = _now;
                      id(my_uart_recv_read) = ((id(my_uart_recv_read) + 8) % ${MAX_UART_RECV_BUF_LEN});

    offline_skip_updates: 5
  - id: modbus_device_presssion_2
    address: 12
    modbus_id: modbus_1
    setup_priority: -5
    update_interval: 120s
    command_throttle: 500ms
    offline_skip_updates: 5

globals:
  - id: my_global_id
    type: std::string
    restore_value: no
    max_restore_data_length: 10
  - id: my_uart_recv_buf
    type: unsigned char[${MAX_UART_RECV_BUF_LEN}]
    restore_value: no
  - id: my_uart_recv_read
    type: int
    restore_value: no
  - id: my_uart_recv_write
    type: int
    restore_value: no
  - id: my_uart_recv_delay
    type: int
    restore_value: no
  - id: my_relay_state
    type: unsigned char[16]
    restore_value: no
  - id: total_high_value
    type: int32_t
    restore_value: no
  - id: total_low_value
    type: int32_t
    restore_value: no
  - id: total_decimal_value
    type: int32_t
    restore_value: no
  - id: eeprom_write_data
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: reboot_count_val
    type: int32_t
    restore_value: no
    initial_value: '0'

  - id: last_uptime_val
    type: int32_t
    restore_value: no
    initial_value: '0'

  - id: loop_time_us
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: loop_time_max_us
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: loop_last_micros
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # v3.16.68: Breadcrumb — 記錄最後重要事件（CMD/按鈕/script），crash 後開機讀出
  #   固定 32 bytes，持續被覆寫，無鎖無佇列，主 loop context 寫入零阻塞
  #   範例值："HMI_BTN:0x30"、"CMD:ssr_1"、"WASH_RESET"、"SCRIPT:washer_send_cmd:5"
  - id: breadcrumb_last_event
    type: char[32]
    restore_value: no

  # Breadcrumb snapshot 讀回來的字串（開機時從 EEPROM 0x0200 讀出）
  #   直接 publish 到 last_crash_context text_sensor 讓 Dashboard 顯示
  - id: crash_context_str
    type: std::string
    restore_value: no
    initial_value: '""'

  # v3.16.69: Loop spike peak tracker — on_loop 寫入最大 spike，3s EEPROM 寫完後清零
  #   用途：抓 crash 前的 worst-case loop 尖峰大小
  - id: spike_peak_us
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: cpu_idle_cnt
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: cpu_idle_last
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: cpu_usage_pct
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: led_blink_toggle
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: eeprom_writing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_press_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: boot_held
    type: bool
    restore_value: no
    initial_value: 'false'

  # v4.0.66: HMI 最新事件/CMD 參數顯示欄（Page 0 Y=288 右側）
  #   Latest-wins 單格：HMI 按鈕 / Dashboard / WS CMD 任一路徑觸發都會更新
  #   範例：`led_volume=3` / `led_bright=100` / `HMI:0x30` / `cmd=led_switch`
  - id: hmi_last_event_line
    type: std::string
    restore_value: no
    initial_value: '""'



  # ── v3.16.0: HMI 密碼輸入緩衝區 ──
  # v4.0.32: 長度改為 USER_CODE_LENGTH（4），shift-register 模式
  - id: hmi_pwd_buf
    type: char[${USER_CODE_LENGTH}]
    restore_value: no
  - id: hmi_pwd_len
    type: int
    restore_value: no
    initial_value: '0'
  # ── v3.16.27: HMI 按鈕去重（1 秒內相同 byte 忽略）──
  # 用於擋掉 DWIN HMI 在 Page 切換重繪過程中回送的殘留觸摸事件
  # 也防護 UART0 電氣噪音造成的 phantom byte（機率低但保險）
  - id: hmi_last_btn
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: hmi_last_btn_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # v4.0.80: HMI Page 0（工程頁）idle countdown — 15s 無 HMI 操作 → 自動回 Page 1（密碼頁）
  #   每秒遞增；>=15 觸發 hmi_show_page(1)；HMI 任一 byte → 歸零重新倒數
  #   倒數值（剩餘秒數 = 15 - counter）顯示在 X=720 Y=0（header 右側空白區）
  - id: hmi_idle_counter_s
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # ── v3.16.62: 溫控風扇 — 比例控制（gentle ramp，避免噪音） ──
  # 設計理念：風扇只在需要時用「剛好夠」的轉速，不是粗暴的 ON/OFF 全速
  #
  # 轉速對照表（以 DHT22 當前溫度 t 計算）：
  #   t < 30°C          → 0%   關閉（回落遲滯，避免臨界震盪）
  #   t < 32°C          → 維持先前狀態（30-32°C 死區，若已開保持 30%，若關則繼續關）
  #   32 ≤ t < 35°C     → 30% → 50%（線性緩升，安靜模式）
  #   35 ≤ t < 40°C     → 50% → 75%（中度散熱）
  #   40 ≤ t < 45°C     → 75% → 100%（高溫加速）
  #   t ≥ 45°C          → 100%（緊急全速，極少觸發）
  #
  # 開啟閾值 33°C、關閉閾值 30°C → 3°C hysteresis 避免臨界抖動
  # 不做 10min/3min duty 保護（轉速本身已低，馬達無過熱風險）
  # 所有計算在 10s interval lambda 內完成，零阻塞零 IO。
  - id: fan_running               # 目前風扇是否開啟（hysteresis 狀態）
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  # ═══ v4.0.285 [WEB-MAINT-24H]: web_server 24h 自動 toggle 防 SSE fd 累積 ═══
  # 背景：用戶實測 dashboard 開 1+ 天後出現 ERR_CONNECTION_RESET（瀏覽器看似「卡死」）
  #   根因：ESPHome web_server v2 (ESP-IDF httpd_server) max_open_sockets 預設 7，
  #         SSE 持久連線 + 瀏覽器休眠/網路抖造成 dangling fd 累積，最終 web_server 拒絕新連線。
  #   修法：每 24h 自動 toggle off→2s→on，強制 ESP-IDF httpd close all sockets 釋放 fd。
  #         Dashboard 短暫 disconnect 後 SSE 會 auto-reconnect，使用者幾乎無感。
  #   不動 main loop / wash flow / EMG / WS1 / WS2 / BLE — 只動 web_server entity。
  - interval: 24h  # 第一次 trigger 在開機 24h 後（ESPHome interval 預設行為）
    then:
      - lambda: |-
          if (id(web_server_switch).state) {
            ESP_LOGI("WEB-MAINT", "auto-toggle web_server off (24h fd cleanup)");
            id(ws_log).publish_state("[WEB-MAINT] auto-toggle off (24h)");
          }
      - switch.turn_off: web_server_switch
      - delay: 2s
      - lambda: |-
          ESP_LOGI("WEB-MAINT", "auto-toggle web_server on (24h fd cleanup done)");
          id(ws_log).publish_state("[WEB-MAINT] auto-toggle on (24h)");
      - switch.turn_on: web_server_switch

  # ═══ v3.16.62: 溫控風扇 — 比例控制（gentle ramp，每 10 秒重算） ═══
  # 轉速 = f(溫度)，無狀態機、無 duty 保護，只算當前應該跑幾 %
  #   t < 30°C  → OFF（回落遲滯）
  #   t < 32°C  → 維持狀態（若已開 30%、若已關則繼續關）
  #   32-35°C   → 30~50% 線性
  #   35-40°C   → 50~75% 線性
  #   40-45°C   → 75~100% 線性
  #   t ≥ 45°C  → 100%
  # 所有動作都是 turn_on(speed).perform() / turn_off().perform()，零阻塞零 IO。
  - interval: 10s
    then:
      - lambda: |-
          const float HYST_OFF = 30.0f;    // 完全關閉閾值
          const float HYST_ON  = 32.0f;    // 啟動閾值（2°C 死區）
          const int MIN_SPEED  = 30;       // 啟動時的最低轉速（32°C）

          float t = id(temp).state;
          if (std::isnan(t)) {
            // 感測器異常 → 保守低速散熱（50%）避免主板過熱
            auto call = id(cooling_fan).turn_on();
            call.set_speed(50);
            call.perform();
            id(climate_status_sensor).publish_state("FAULT|sensor-nan|50");
            return;
          }

          // ── Hysteresis: 低於 30°C 完全關閉 ──
          if (t < HYST_OFF) {
            id(fan_running) = false;
            auto call = id(cooling_fan).turn_off();
            call.perform();
            id(climate_status_sensor).publish_state("IDLE|0");
            return;
          }

          // ── 30-32°C 死區：維持先前狀態 ──
          if (t < HYST_ON && !id(fan_running)) {
            auto call = id(cooling_fan).turn_off();
            call.perform();
            id(climate_status_sensor).publish_state("IDLE|0");
            return;
          }

          // ── 32°C 以上（或已在運轉中）：比例計算轉速 ──
          id(fan_running) = true;
          int speed;
          if (t >= 45.0f) {
            speed = 100;                                          // 緊急全速
          } else if (t >= 40.0f) {
            speed = 75 + (int)((t - 40.0f) * 25.0f / 5.0f);       // 75 → 100
          } else if (t >= 35.0f) {
            speed = 50 + (int)((t - 35.0f) * 25.0f / 5.0f);       // 50 → 75
          } else {
            // 32-35°C（含死區上半段 30-32°C 維持運轉時 → clamp 到 MIN_SPEED）
            float base_t = (t < 32.0f) ? 32.0f : t;
            speed = MIN_SPEED + (int)((base_t - 32.0f) * 20.0f / 3.0f);  // 30 → 50
          }
          if (speed < MIN_SPEED) speed = MIN_SPEED;
          if (speed > 100) speed = 100;

          auto call = id(cooling_fan).turn_on();
          call.set_speed(speed);
          call.perform();
          char buf[32];
          snprintf(buf, sizeof(buf), "RUN|%.1f|%d", t, speed);
          id(climate_status_sensor).publish_state(buf);

  # === ID LED Status Indicator (GPIO40, 1x WS2812) ===
  # ID LED: Green=OK, Red=invalid, Blue blink=EEPROM writing
  # OTA LED: White blink=checking, Magenta blink=downloading, Purple fast=flashing, Green fast=rebooting
  # Network LED (GPIO48): network/connection status (6 states)
  - interval: 200ms
    then:
      - lambda: |-
          id(led_blink_toggle) = !id(led_blink_toggle);
          bool blink = id(led_blink_toggle);  // 200ms toggle for OTA fast blink
          bool slow_blink = (millis() / 500) % 2;  // 500ms toggle for non-OTA blinks
          float br = 1.0;

          // === ID LED (light_rgb1) — OTA takes highest priority ===
          int ota_phase = (int)id(cloud_ota).get_phase();
          // 0=IDLE, 1=WAITING, 2=CHECKING, 3=DOWNLOADING, 4=FLASHING, 5=REBOOTING, 6=FAILED, 7=UP_TO_DATE

          if (ota_phase >= 2 && ota_phase <= 6) {
            // ANY active OTA phase — 200ms fast blink (current status color)
            if (blink) {
              auto c = id(light_net).turn_on(); c.set_brightness(1.0);
              if (ota_phase == 2)       c.set_rgb(1.0, 1.0, 1.0);  // CHECKING — white
              else if (ota_phase == 3)  c.set_rgb(1.0, 0.0, 1.0);  // DOWNLOADING — magenta
              else if (ota_phase == 4)  c.set_rgb(0.5, 0.0, 1.0);  // FLASHING — purple
              else if (ota_phase == 5)  c.set_rgb(0.0, 1.0, 0.0);  // REBOOTING — green
              else                      c.set_rgb(1.0, 0.0, 0.0);  // FAILED — red
              c.set_transition_length(0); c.perform();
            } else {
              auto c = id(light_net).turn_off(); c.set_transition_length(0); c.perform();
            }
          // === OTA done → auto-restart web server to recover broken connections ===
          static bool ota_was_active = false;
          if (ota_phase >= 2 && ota_phase <= 5) {
            ota_was_active = true;
          } else if (ota_was_active) {
            ota_was_active = false;
            if (id(web_server_switch).state) {
              auto *base = esphome::web_server_base::global_web_server_base;
              if (base && base->get_server()) {
                base->get_server()->end();
                delay(100);
                base->get_server()->begin();
                ESP_LOGI("OTA", "Web server restarted after OTA");
              }
            }
          }

          } else if (id(eeprom_writing)) {
            if (slow_blink) {
              auto c = id(light_net).turn_on(); c.set_brightness(br);
              c.set_rgb(0.0, 0.0, 1.0); c.set_transition_length(0); c.perform();
            } else {
              auto c = id(light_net).turn_off(); c.set_transition_length(0); c.perform();
            }
          } else {
            bool serial_ok = true;
            for (int i = 0; i < $DEV_ID_LENGTH; i++) {
              char ch = id(my_global_id).c_str()[i];
              if (ch < '0' || ch > '9') { serial_ok = false; break; }
            }
            auto c = id(light_net).turn_on(); c.set_brightness(br);
            c.set_rgb(serial_ok ? 0.0 : 1.0, serial_ok ? 1.0 : 0.0, 0.0);
            c.set_transition_length(0); c.perform();
          }

          // === Network LED (light_net) ===
          // Priority: OTA > Button Hold > Connection Status
          int net_ota = (int)id(cloud_ota).get_phase();

          if (net_ota >= 2 && net_ota <= 6) {
            // OTA active — fast blink (200ms) with phase color
            if (blink) {
              auto c = id(light_net).turn_on(); c.set_brightness(1.0);
              if (net_ota == 2)       c.set_rgb(1.0, 1.0, 1.0);  // CHECKING — white
              else if (net_ota == 3)  c.set_rgb(1.0, 0.0, 1.0);  // DOWNLOADING — magenta
              else if (net_ota == 4)  c.set_rgb(0.5, 0.0, 1.0);  // FLASHING — purple
              else if (net_ota == 5)  c.set_rgb(0.0, 1.0, 0.0);  // REBOOTING — green
              else                    c.set_rgb(1.0, 0.0, 0.0);  // FAILED — red
              c.set_transition_length(0); c.perform();
            } else {
              auto c = id(light_net).turn_off(); c.set_transition_length(0); c.perform();
            }
          } else if (id(boot_held) && (millis() - id(boot_press_start) >= 3000)) {
            // Button held ≥3s — white blink hint "keep holding for OTA"
            if (blink) {
              auto c = id(light_net).turn_on(); c.set_brightness(1.0);
              c.set_rgb(1.0, 1.0, 1.0); c.set_transition_length(0); c.perform();
            } else {
              auto c = id(light_net).turn_off(); c.set_transition_length(0); c.perform();
            }
          } else {
            // Normal connection status
            float r = 0, g = 0, b = 0;

            bool serial_ok2 = true;
            for (int i = 0; i < $DEV_ID_LENGTH; i++) {
              char ch = id(my_global_id).c_str()[i];
              if (ch < '0' || ch > '9') { serial_ok2 = false; break; }
            }

            // v4.0.242: 退回 v4.0.236 寫法 — production W5500 ethernet 直接判斷
            auto *eth = ethernet::global_eth_component;
            bool link_up = (eth != nullptr) && eth->is_connected();
            bool has_ip = false;
            auto ips = network::get_ip_addresses();
            if (!ips.empty() && ips[0].is_set()) has_ip = true;
            bool ws1_ok = id(ws).is_connected();
            bool ws2_ok = id(ws).is_lan_connected();

            if (!serial_ok2) {
              r = 1; g = 0; b = 0;          // RED = EEPROM problem
            } else if (!link_up) {
              r = 1; g = 0; b = 0;          // RED = no cable
            } else if (!has_ip) {
              r = 1; g = 0.3; b = 0;        // ORANGE = no IP
            } else if (ws1_ok && ws2_ok) {
              r = 0; g = 1; b = 0;          // v3.16.14: GREEN  = WS1+WS2 both OK
            } else if (!ws1_ok && ws2_ok) {
              r = 1; g = 1; b = 0;          // v3.16.14: YELLOW = WS1 down, WS2 up
            } else if (ws1_ok && !ws2_ok) {
              r = 0; g = 0; b = 1;          // v3.16.14: BLUE   = WS1 up, WS2 down
            } else {
              r = 1; g = 0; b = 0;          // v3.16.14: RED    = both disconnected
            }

            // Web OFF → slow blink (~500ms), Web ON → solid
            bool web_on = id(web_server_switch).state;
            if (web_on) {
              auto c = id(light_net).turn_on(); c.set_brightness(br);
              c.set_rgb(r, g, b); c.set_transition_length(0); c.perform();
            } else {
              if (slow_blink) {
                auto c = id(light_net).turn_on(); c.set_brightness(br);
                c.set_rgb(r, g, b); c.set_transition_length(0); c.perform();
              } else {
                auto c = id(light_net).turn_off(); c.set_transition_length(0); c.perform();
              }
            }
          }

  - interval: 1s
    then:
      - lambda: |-
          id(my_uart_recv_delay)++;
          // v4.0.80: HMI Page 0 idle countdown — 15s 無操作 → 自動回 Page 1
          // v4.0.81: 倒數位置 X=720 → X=0（用戶要求改左上角；會覆蓋「序列号:」label）
          if (id(ws).hmi_current_page_ == 0) {
            uint8_t cnt = id(hmi_idle_counter_s);
            cnt++;
            id(hmi_idle_counter_s) = cnt;
            if (cnt >= 15) {
              // 倒數結束 → 切回密碼頁，counter 歸零
              id(hmi_idle_counter_s) = 0;
              ESP_LOGI("HMI", "idle 15s → back to Page 1 (password)");
              id(hmi_show_page).execute(1);
            } else {
              // 顯示剩餘秒數（15 - cnt）於 X=0 Y=0（左上角）
              char rbuf[16];
              snprintf(rbuf, sizeof(rbuf), "T-%2u  ", (unsigned)(15 - cnt));
              id(hmi_show_param_value).execute(0, 0, std::string(rbuf));
            }
          } else {
            // 不在工程頁 → 倒數歸零（防呆）
            id(hmi_idle_counter_s) = 0;
          }
          // web-only: skip CPU usage calculation when web_server is off
          if (!id(web_server_switch).state) return;
          // CPU usage estimation
          uint32_t cur = id(cpu_idle_cnt);
          uint32_t delta = cur - id(cpu_idle_last);
          id(cpu_idle_last) = cur;
          static uint32_t max_loops = 0;
          if (delta > max_loops) max_loops = delta;
          if (max_loops > 0) {
            float usage = 100.0f * (1.0f - (float)delta / (float)max_loops);
            if (usage < 0) usage = 0;
            if (usage > 100) usage = 100;
            id(cpu_usage_pct) = usage;
          }

  - interval: 10s
    then:
      - lambda: |-
          // v3.16.76: HMI 刷新節流開關 — 關閉時完全 skip（節省資源、不刷 UART）
          //   搭配 hmi_refresh_enable switch (RESTORE_DEFAULT_ON)
          if (!id(hmi_refresh_enable).state) return;
          // v3.16.2: Page 0 專用 — 版本/溫濕度/heap 標頭行，Page 1 時跳過節省資源
          // v3.16.35: Server 心跳超時 90s → 在標頭行末端加 " OFFLINE"
          // v3.16.42: 改為 ONLINE/OFFLINE 雙狀態顯示（伺服器在線時也顯示，方便辨識）
          if (id(ws).hmi_current_page_ == 0) {
            // v3.16.56: 步驟標籤移到 bb4 列（Y=480），頂部 header 保持簡潔避免重疊
            // v4.0.73: 移除頂部 header 的 OFFLINE/ONLINE 後綴（Y=480 bb4 line 保留）
            char buf[96];
            const char *sid = id(my_global_id).c_str();
            bool has_sid = (sid[0] != '\0');
            if (!isnan(id(temp).state) && !isnan(id(humidity).state)) {
              snprintf(buf, sizeof(buf), "%s%s${VER_PREFIX}${DEV_FIRMWARE_VER}(%.1fC %.1f%% %uKB)       ",
                has_sid ? sid : "", has_sid ? " " : "",
                id(temp).state, id(humidity).state,
                esp_get_free_heap_size() / 1024);
            } else {
              snprintf(buf, sizeof(buf), "%s%s${VER_PREFIX}${DEV_FIRMWARE_VER}(--C --%% %uKB)       ",
                has_sid ? sid : "", has_sid ? " " : "",
                esp_get_free_heap_size() / 1024);
            }
            id(hmi_show_param_value).execute(220, 0, std::string(buf));

            // v3.16.76: Y=480 bb4 列統一走 hmi_refresh_bb4_line helper（含 dedup）
            id(hmi_refresh_bb4_line).execute();
          }

          // HMI IO refresh — sync all binary sensor displays to Page 0
          // on_boot only sets 4 sensors; XL9535 sensors (leak/water/door/bubble) have no initial display
          // v3.16.1: 只在 Page 0 時執行，避免開機在 Page 1 時錯誤標記已同步
          static bool hmi_io_synced = false;
          if (!hmi_io_synced && id(system_uptime).state > 5 && id(ws).hmi_current_page_ == 0) {
            hmi_io_synced = true;
            id(hmi_show_param_value).execute(220, 32,  id(ac_power_lose).state      ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 64,  id(leak_det).state            ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 96,  id(water_level_1).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 128, id(water_level_2).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 160, id(emgr_input).state          ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 192, id(start_stop_input).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 224, id(car_height_input).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 256, id(check_door_input).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 288, id(washer_led_blue).state     ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 320, id(washer_led_green).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 352, id(washer_led_red).state      ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 384, id(check_bubble_input_1).state ? " ON" : "OFF");
            // v3.16.77: bubble_2/3/4 存量輸入已移除，Y=416/448 不再刷新
            // v3.16.76: bb4 列改走 hmi_refresh_bb4_line helper
            id(hmi_refresh_bb4_line).execute();
            ESP_LOGI("HMI", "IO states synced to HMI (one-time after boot)");
          }

          // v4.0.55: Page 1 底部兩行統一由 2s interval 以 AA 55 單一來源刷新（避免 AA 98/AA 55 疊加）
  - interval: 30s
    then:
      - lambda: |-
          // web-only: skip heap log when web_server is off
          if (!id(web_server_switch).state) return;
          ESP_LOGW("heap", "Free: %u bytes, Min: %u bytes, Uptime: %.0fs",
            esp_get_free_heap_size(), esp_get_minimum_free_heap_size(), id(system_uptime).state);
          // Save current uptime to EEPROM every 30s (survives power loss)
          uint32_t secs = (uint32_t)id(system_uptime).state;
          uint8_t up_buf[4];
          up_buf[0] = secs & 0xFF;
          up_buf[1] = (secs >> 8) & 0xFF;
          up_buf[2] = (secs >> 16) & 0xFF;
          up_buf[3] = (secs >> 24) & 0xFF;
          id(eeprom_1).set(0x0104, up_buf, 4);

  # v3.16.68: Breadcrumb snapshot — 每 3s 把 ESP32 當下狀態寫 EEPROM 0x0200 (64 bytes)
  #   下次開機 on_boot 讀出，可看到 crash 前 3 秒內的：
  #     uptime / loop_time / heap / wash phase/stage / last event text
  #   I2C page write ~5ms，3s 間隔完全夠，EEPROM 壽命 >1000 crash 才耗盡
  # v3.16.69: 加入 spike_peak_us（最近 3s 內最大 loop spike），寫完後歸零
  - interval: 3s
    then:
      - lambda: |-
          uint8_t bc[64] = {0};
          // magic 0xDEADBEEF LE
          bc[0] = 0xEF; bc[1] = 0xBE; bc[2] = 0xAD; bc[3] = 0xDE;
          uint32_t up = (uint32_t) id(system_uptime).state;
          bc[4] = up & 0xFF; bc[5] = (up >> 8) & 0xFF;
          bc[6] = (up >> 16) & 0xFF; bc[7] = (up >> 24) & 0xFF;
          uint32_t lp = id(loop_time_us);
          bc[8]  = lp & 0xFF; bc[9]  = (lp >> 8) & 0xFF;
          bc[10] = (lp >> 16) & 0xFF; bc[11] = (lp >> 24) & 0xFF;
          uint32_t hp = esp_get_free_heap_size();
          bc[12] = hp & 0xFF; bc[13] = (hp >> 8) & 0xFF;
          bc[14] = (hp >> 16) & 0xFF; bc[15] = (hp >> 24) & 0xFF;
          uint32_t mh = esp_get_minimum_free_heap_size();
          bc[16] = mh & 0xFF; bc[17] = (mh >> 8) & 0xFF;
          bc[18] = (mh >> 16) & 0xFF; bc[19] = (mh >> 24) & 0xFF;
          // wash state — 用 public const accessors（ws_client.h 提供）
          bc[20] = (uint8_t) id(ws).get_wash_phase();
          bc[21] = (uint8_t) id(ws).get_wash_stage();
          bc[22] = (uint8_t) id(ws).get_wash_total();
          bc[23] = id(ws).is_offline() ? 1 : 0;
          bc[24] = (uint8_t) id(ws).hmi_current_page_;
          // v3.16.69: spike peak (4 bytes @ offset 60-63)
          uint32_t sp = id(spike_peak_us);
          bc[60] = sp & 0xFF; bc[61] = (sp >> 8) & 0xFF;
          bc[62] = (sp >> 16) & 0xFF; bc[63] = (sp >> 24) & 0xFF;
          // event text — v4.0.16: 優先使用 g_reboot_tag（reboot 兇手標記），否則用 breadcrumb_last_event
          if (g_reboot_tag[0] != '\0') {
            memcpy(&bc[28], g_reboot_tag, 32);
          } else {
            memcpy(&bc[28], id(breadcrumb_last_event), 32);
          }
          id(eeprom_1).set(0x0200, bc, 64);
          // v3.16.69: 寫完後重置 spike tracker，下個 3s 視窗重新抓 peak
          id(spike_peak_us) = 0;
  - interval: 2s
    then:
      - lambda: |-
          // v3.16.76: HMI 刷新節流開關 — 關閉時 skip 整個 2s interval
          if (!id(hmi_refresh_enable).state) return;
          // v3.16.2: Page 0 專用 — 右上角運行時間顯示
          // v3.16.44: Page 1 底部狀態行（含系統啟動時間）也每 2s 更新，讓 uptime 明顯在「跳」
          unsigned long secs = id(system_uptime).state;
          unsigned long days = secs / 86400;
          unsigned long hours = (secs % 86400) / 3600;
          unsigned long minutes = (secs % 3600) / 60;
          unsigned long seconds = secs % 60;
          if (id(ws).hmi_current_page_ == 0) {
            std::string result;
            if (days > 0) result = to_string(days) + "d " + to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
            else if (hours > 0) result = to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
            else if (minutes > 0) result = to_string(minutes) + "m" + to_string(seconds) + "s";
            else result = to_string(seconds) + "s";
            result.insert(0, 12 - result.length(), ' ');
            id(hmi_show_param_value).execute(220 + 512, 0, result);
          } else if (id(ws).hmi_current_page_ == 1) {
            // v4.0.83: Page 1 layout
            //   左上角 X=0 Y=0:   機器編號（韌體版本 | SN | Uptime [+ coldDown 後綴]）
            //   左下角 X=0 Y=566: 洗車流程 (含 lock prefix 由 wash_step_hmi_label 加) + ONLINE/OFFLINE
            //   v4.0.88: X=10→X=0 (用戶要求對齊到 0)；EMG alert 也優先顯示在此行
            //   藍底為 DWIN .HMI 設計檔的 AA 55 預定義文字區屬性，韌體無法移除（要去掉藍底需修 .HMI 檔）
            char wash_line[160];
            char sys_line[160];
            const char *sn = id(my_global_id).c_str();
            // v4.0.88: EMG alert 優先（同 Page 0 hmi_refresh_bb4_line 邏輯）
            if (id(ws).has_hmi_emg_alert()) {
              snprintf(wash_line, sizeof(wash_line), "%s",
                       id(ws).get_hmi_emg_alert().c_str());
            } else {
              std::string step_lbl = id(ws).wash_step_hmi_label();
              const char *ws_st_fallback = id(ws).is_wash_active() ? "WASH" : "IDLE";
              std::string ws_st = step_lbl.empty() ? std::string(ws_st_fallback) : step_lbl;
              const char *net_suffix = id(ws).is_offline() ? " OFFLINE" : " ONLINE";
              snprintf(wash_line, sizeof(wash_line), "%s%s", ws_st.c_str(), net_suffix);
            }
            // v4.0.84: 移除 coldDown 後綴（用戶要求）。Cooldown 仍在但不顯示在 SN 行
            if (sn[0] != '\0') {
              snprintf(sys_line, sizeof(sys_line), "${VER_PREFIX}${DEV_FIRMWARE_VER} | SN:%s | Up:%luh%lum%lus",
                       sn, hours + days*24, minutes, seconds);
            } else {
              snprintf(sys_line, sizeof(sys_line), "${VER_PREFIX}${DEV_FIRMWARE_VER} | Up:%luh%lum%lus",
                       hours + days*24, minutes, seconds);
            }
            // 上行：機器編號 (X=0 Y=0 = 0x0000 0x0000)
            unsigned char sh_sys[6]  = {0xaa, 0x55, 0x00, 0x00, 0x00, 0x00};
            // 下行：洗車流程 (X=0 Y=566 = 0x0000 0x0236) — v4.0.88 X=10→X=0
            unsigned char sh_wash[6] = {0xaa, 0x55, 0x00, 0x00, 0x02, 0x36};
            unsigned char st[4] = {0xcc, 0x33, 0xc3, 0x3c};
            uart_write_bytes((uart_port_t)0, sh_sys, 6);
            uart_write_bytes((uart_port_t)0, sys_line, strlen(sys_line));
            uart_write_bytes((uart_port_t)0, st, 4);
            uart_write_bytes((uart_port_t)0, sh_wash, 6);
            uart_write_bytes((uart_port_t)0, wash_line, strlen(wash_line));
            uart_write_bytes((uart_port_t)0, st, 4);
          }

sensor:
  - platform: uptime
    id: system_uptime
    name: "System Uptime"
    type: seconds
    update_interval: 3s

  - platform: template
    name: "Reboot Count"
    id: reboot_count_sensor
    accuracy_decimals: 0
    icon: "mdi:restart"
    update_interval: 60s
    # v4.0.69: 移除 web_server_switch gate — 此 sensor 同時餵給 STATUS（雲端+LAN WS），
    #          屬於 CLAUDE.md 階段 23 定義的「核心功能」不可 gate。web 關閉時若 gate，
    #          template sensor 永不 publish，state 為 NaN，(int)NaN 在 Xtensa/GCC 會被
    #          cast 成 INT32_MAX=2147483647，STATUS 會噴出離譜大數。
    lambda: |-
      return (float)id(reboot_count_val);

  - platform: template
    name: "Last Boot Uptime"
    id: last_uptime_sensor
    accuracy_decimals: 0
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    update_interval: 60s
    # v4.0.69: 同上，core STATUS 欄位不可 gate
    lambda: |-
      return (float)id(last_uptime_val);

  - platform: template
    name: "Free Heap"
    id: free_heap_sensor
    accuracy_decimals: 0
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    lambda: |-
      if (!id(web_server_switch).state) return {};
      return (float)esp_get_free_heap_size();

  - platform: template
    name: "Min Free Heap"
    id: min_free_heap_sensor
    accuracy_decimals: 0
    unit_of_measurement: "B"
    icon: "mdi:memory"
    update_interval: 10s
    # v4.0.69: 同 reboot_count — STATUS 欄位，移除 web_server_switch gate
    lambda: |-
      return (float)esp_get_minimum_free_heap_size();

  - platform: template
    name: "Loop Time"
    id: loop_time_sensor
    accuracy_decimals: 0
    unit_of_measurement: "us"
    icon: "mdi:timer-outline"
    update_interval: 15s
    # v4.0.69: 同上
    lambda: |-
      return (float)id(loop_time_us);

  - platform: template
    name: "Loop Time Max"
    id: loop_time_max_sensor
    accuracy_decimals: 0
    unit_of_measurement: "us"
    icon: "mdi:timer-alert-outline"
    update_interval: 15s
    # v4.0.69: 同上。reset-after-read 語意保持不變
    lambda: |-
      float val = (float)id(loop_time_max_us);
      id(loop_time_max_us) = 0;  // reset max after read
      return val;

  - platform: template
    name: "CPU Freq"
    id: cpu_freq_sensor
    accuracy_decimals: 0
    unit_of_measurement: "MHz"
    icon: "mdi:chip"
    update_interval: 60s
    lambda: |-
      if (!id(web_server_switch).state) return {};
      // v4.0.00: esp-idf 無 ESP.getCpuFreqMHz()；ESP32-S3 runtime freq 固定 240 MHz
      return 240.0f;

  - platform: template
    name: "CPU Usage"
    id: cpu_usage_sensor
    accuracy_decimals: 1
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    update_interval: 15s
    # v4.0.69: 同上，STATUS 欄位不可 gate。但 cpu_usage_pct 的計算 loop
    #          （line ~1180 1s interval）仍保留 web gate — 因計算本身較重（iterate loop stats）
    lambda: |-
      return id(cpu_usage_pct);

  - platform: dht
    pin: GPIO46
    model: AUTO_DETECT
    temperature:
      id: temp
      name: "Temperature"
    humidity:
      id: humidity
      name: "Humidity"
    update_interval: 10s

  - platform: modbus_controller
    modbus_controller_id: modbus_device_presssion_2
    name: "Water Pressure"
    id: water_pressure
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    lambda: |-
      int v = (data[0] << 8) | data[1];
      char buf[20]; snprintf(buf, sizeof(buf), "%d mPa    ", v);
      // v4.0.87: 修 Y 同步 v4.0.85 重排（224 → 256，水壓行下推）
      id(hmi_show_param_value).execute(220 + 512, 256, std::string(buf));
      return v;

  - platform: modbus_controller
    modbus_controller_id: modbus_device_shui_liu
    id: total_flow_high
    name: "Total Flow High"
    address: 0x0004
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            id(total_high_value) = x;
            id(total_flow).update();

  - platform: modbus_controller
    modbus_controller_id: modbus_device_shui_liu
    id: total_flow_low
    name: "Total Flow Low"
    address: 0x0005
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            id(total_low_value) = x;
            id(total_flow).update();

  - platform: modbus_controller
    modbus_controller_id: modbus_device_shui_liu
    id: total_flow_decimal
    name: "Total Flow Decimal"
    address: 0x0006
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            id(total_decimal_value) = x;
            id(total_flow).update();

  - platform: template
    id: total_flow
    name: "Total Water Flow"
    lambda: |-
      float num = id(total_high_value) * 65536.0 + id(total_low_value) + (id(total_decimal_value) / 100.0);
      char buf[24]; snprintf(buf, sizeof(buf), "%.2f L     ", num);
      id(hmi_show_param_value).execute(220 + 512, 32, std::string(buf));
      return num;
    device_class: "volume"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: never

  - platform: modbus_controller
    modbus_controller_id: modbus_device_shui_liu
    name: "Water Flow In"
    id: water_flow_1
    register_type: holding
    address: 0x001b
    value_type: U_WORD
    lambda: |-
      int v = (data[0] << 8) | data[1];
      char buf[24]; snprintf(buf, sizeof(buf), "%.2f L/min     ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 64, std::string(buf));
      return v;

  - platform: modbus_controller
    modbus_controller_id: modbus_device_shui_liu
    name: "Water Flow Out"
    id: water_flow_2
    register_type: holding
    address: 0x0023
    value_type: U_WORD
    lambda: |-
      int v = (data[0] << 8) | data[1];
      char buf[24]; snprintf(buf, sizeof(buf), "%.2f L/min     ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 96, std::string(buf));
      return v;

  # v4.0.85: 電流 4 通道（Modbus 0x0008~0x000B 批次讀取，÷100 = A）
  #   addr 8 (0x0008) → 總電源 / id=current_total
  #   addr 9 (0x0009) → 洗車機 / id=current_washer  (前版 current_pump 改名)
  #   addr 10 (0x000A) → 加壓馬達 / id=current_pump  (前版 current_air 改名 + ID 重用)
  #   addr 11 (0x000B) → 外部設備 / id=current_allExt  (前版 current_led 改名 + 補 HMI 顯示)
  - platform: modbus_controller
    modbus_controller_id: modbus_device_dian_liu
    name: "Total Current"
    id: current_total
    register_type: holding
    address: 8
    value_type: S_WORD
    lambda: |-
      int v = (data[0] << 8) | data[1];
      char buf[24]; snprintf(buf, sizeof(buf), "%.1f A      ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 128, std::string(buf));
      return v;

  - platform: modbus_controller
    modbus_controller_id: modbus_device_dian_liu
    name: "Washer Current"
    id: current_washer
    register_type: holding
    address: 9
    value_type: S_WORD
    lambda: |-
      int v = (data[2] << 8) | data[3];
      char buf[24]; snprintf(buf, sizeof(buf), "%.1f A      ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 160, std::string(buf));
      return v;

  - platform: modbus_controller
    modbus_controller_id: modbus_device_dian_liu
    name: "Pump Current"
    id: current_pump
    register_type: holding
    address: 10
    value_type: S_WORD
    lambda: |-
      int v = (data[4] << 8) | data[5];
      char buf[24]; snprintf(buf, sizeof(buf), "%.1f A      ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 192, std::string(buf));
      return v;

  # 外部設備電流（Modbus 0x000B / 批次讀取 bytes 6-7，÷100 換算）
  - platform: modbus_controller
    modbus_controller_id: modbus_device_dian_liu
    name: "External Current"
    id: current_allExt
    register_type: holding
    address: 11
    value_type: S_WORD
    lambda: |-
      int v = (data[6] << 8) | data[7];
      char buf[24]; snprintf(buf, sizeof(buf), "%.1f A      ", v / 100.0);
      id(hmi_show_param_value).execute(220 + 512, 224, std::string(buf));
      return v;

  - platform: pulse_counter
    pin: GPIO36
    id: fan_tachometer
    unit_of_measurement: "RPM"
    name: "Fan Speed"
    internal_filter: 13us
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    update_interval: 10s
    filters:
      - multiply: 0.5
    on_value:
      - lambda: |-
          char buf[20];
          snprintf(buf, sizeof(buf),"%.1f RPM    ", x);
          std::string result(buf);
          // v4.0.87: 修 Y 同步 v4.0.85 重排（256 → 288，風扇行下推）
          id(hmi_show_param_value).execute(220 + 512, 288, result);

# ── PWM 輸出 ───────────────────────────────────────────────────────
output:
  # 風扇 PWM 輸出（LEDC 硬體 PWM，25kHz 頻率適合 4-pin PWM 風扇）
  - platform: ledc
    pin: GPIO37
    id: fan_pwm_output
    frequency: 25000Hz

# ── 風扇控制 ──────────────────────────────────────────────────────
# Web 控制：REST API /fan/cooling_fan/{toggle|turn_on|turn_off}
# WS CMD 控制：{"cmd":"cooling_fan","on":1}
# 閉環控制：由 climate 10s interval lambda 自動控制開關
# Dashboard：speed slider 0-100%，即時反映 PWM 占空比
fan:
  - platform: speed
    name: "Cooling Fan"
    id: cooling_fan
    output: fan_pwm_output
    speed_count: 100  # 100 級速度（對應 0~100%）

switch:
  # v3.16.59: climate_enable_sw 已移除 — 風扇改為全自動（見 fan_run_start interval）
  # v3.16.77: SSR 1-4（GPIO7/15/16/17）完全移除 — V1/V2 硬體層統一無 SSR 輸出

  # v4.0.59: Colorlight kill-switch — 關掉整個 cl.put()，驗證 crash 是否來自 LED HTTP
  #   預設 ON（正常運作）；OFF 時 put() 進入立即 return，完全不創 task/alloc
  - platform: template
    name: "Colorlight Enabled"
    id: colorlight_enabled_sw
    optimistic: true
    restore_mode: ALWAYS_ON
    icon: "mdi:led-strip-variant"
    turn_on_action:
      - lambda: |-
          esphome::colorlight::ColorlightClient::set_enabled(true);
          // v4.0.229: kill switch 切換時 fire cl_kill_switch_change EVENT 給 server
          const char *ev = "{\"type\":\"EVENT\",\"event\":\"cl_kill_switch_change\",\"enabled\":true}";
          id(ws).send_event_raw_public(ev, strlen(ev));
    turn_off_action:
      - lambda: |-
          esphome::colorlight::ColorlightClient::set_enabled(false);
          const char *ev = "{\"type\":\"EVENT\",\"event\":\"cl_kill_switch_change\",\"enabled\":false}";
          id(ws).send_event_raw_public(ev, strlen(ev));

  # v4.0.284 [BLE-KILL-SWITCH]: BLE Advertising kill-switch — 出事可遠端關 BLE adv
  #   預設 ON（OTA 後保持 BLE 廣播）；OFF 時 publish_cmd/publish_idle skip + ble_gap_adv_stop()
  #   控制方式：(A) REST /switch/ble_adv_enabled/turn_off (B) WS CMD {"cmd":"ble_kill","on":0}
  #   不持久化（reboot 後 ALWAYS_ON 復原）— 因為 OFF 是「應急救火」狀態不該存
  - platform: template

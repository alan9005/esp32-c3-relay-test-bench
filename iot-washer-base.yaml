    offline_skip_updates: 5
  - id: modbus_device_dian_liu
    address: 10
    modbus_id: modbus_1
    setup_priority: -5
    # v4.0.85: 120s → 5s（EMG 電流確認需要 cache 新鮮）
    update_interval: 5s
    command_throttle: 500ms
    offline_skip_updates: 5
  - id: modbus_device_relay
    address: 100
    modbus_id: modbus_1
    setup_priority: -5
    update_interval: 120s

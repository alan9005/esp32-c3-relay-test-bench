                //     0x2A: 切換洗車頁 → 切到 Page 1（登入/洗車頁）
                //     0x2B: Web 開關 → toggle web_server_switch
                //     0x2C: OTA 檢查 → cloud_ota.check_for_update()
                //   §3.5 監控頁 Y=458 左側功能 (v3.16.22 最終確認 — 用戶提供實際 byte):

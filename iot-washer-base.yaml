  # v3.16.76: 統一 Y=480 bb4 列產生/寫入，避免原三處（10s interval / IO sync / bb4 on_state）
  #          各自 snprintf 導致格式不一致 + 重複寫入造成「OFFLINEOFFLINE」雙字問題。
  #          內部 dedup：last_bb4 相同字串則略過 UART write，減輕 DWIN 負擔。
  - id: hmi_refresh_bb4_line
    mode: single
    then:
      - lambda: |-
          if (id(ws).hmi_current_page_ != 0) return;
          // v4.0.85: EMG alert 字串優先顯示（觸發後直到下次 wash 狀態變化才清）
          // v4.0.88: 字串緊湊化 — 移除多餘空格 (用戶要求"太長了把空格去掉")
          std::string content;
          if (id(ws).has_hmi_emg_alert()) {
            content = id(ws).get_hmi_emg_alert();
          } else {
            std::string step_lbl = id(ws).wash_step_hmi_label();
            char line[96];
            const char *net = id(ws).is_offline() ? "OFFLINE" : "ONLINE";
            if (step_lbl.empty()) {
              snprintf(line, sizeof(line), "%s", net);
            } else {
              snprintf(line, sizeof(line), "%s %s", step_lbl.c_str(), net);
            }
            content = line;
          }
          static std::string last_bb4;
          if (content == last_bb4) return;  // dedup
          last_bb4 = content;
          // v4.0.66: AA 55 藍底白字（DGUS 預定義文字區自動清底）
          id(hmi_show_param_value).execute(0, 480, content);

  - id: uart_proc_hex
    mode: single
    then:
      - lambda: |-
          // v3.16.77: SSR 1-4 已完全移除（V1/V2 硬體層統一），all_relays 陣列長度 20→16
          static switch_::Switch* all_relays[] = {
            id(relay_01), id(relay_02), id(relay_03), id(relay_04),
            id(relay_05), id(relay_06), id(relay_07), id(relay_08),
            id(relay_09), id(relay_10), id(relay_11), id(relay_12),
            id(relay_13), id(relay_14), id(relay_15), id(relay_16)
          };
          // v4.0.277 [HMI-DRAIN-FIFO]: 一次 drain 多 byte 進 ring buffer
          //   原本每個 main loop iteration 只讀 1 byte → 8-byte 按鍵要 8 iterations
          //   main loop 慢時（WS reconnect / SSE / Colorlight / TLS）硬體 FIFO (256B) 溢位丟 byte
          //   → lock 模式輸密碼「沒反應 / 很慢」（用戶 1140 實測）
          //   修法：一次讀 up to 64 byte 全 push 進 ring buffer，FIFO 不溢位不丟 byte
          //   frame 處理仍 1 frame/iteration（byte 安全進 ring buffer，main loop 健康時很快消化）
          unsigned char rxchunk[64];
          int iRecvCnt;
          unsigned char aucTempBuf[${MAX_UART_RECV_BUF_LEN}];
          int iLength = uart_read_bytes((uart_port_t)0, rxchunk, sizeof(rxchunk), 0);
          if (iLength > 0) {
            id(my_uart_recv_delay) = 0;
            for (int b = 0; b < iLength; b++) {
              if (((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN}) != id(my_uart_recv_read)) {
                id(my_uart_recv_buf)[id(my_uart_recv_write)] = rxchunk[b];
                id(my_uart_recv_write) = ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN});
              }
            }
            iRecvCnt = (id(my_uart_recv_write) >= id(my_uart_recv_read))
              ? id(my_uart_recv_write) - id(my_uart_recv_read)
              : id(my_uart_recv_write) + ${MAX_UART_RECV_BUF_LEN} - id(my_uart_recv_read);
            int iPos = id(my_uart_recv_read);
            memset(aucTempBuf, 0x00, sizeof(aucTempBuf));
            for (int i = 0; i < iRecvCnt; i++) {
              aucTempBuf[i] = id(my_uart_recv_buf)[iPos];
              iPos = ((iPos + 1) % ${MAX_UART_RECV_BUF_LEN});
            }
            if (iRecvCnt >= 6) {
              if (aucTempBuf[0] != 0xaa) {
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
              // v4.0.263: == → >= 修「兩 frame 堆疊 → 永久卡死」bug
              //   舊版用 == 嚴格相等，當使用者連按 < 200ms 兩下 HMI，第 2 frame
              //   在第 1 frame 還沒處理完時也進 buffer，iRecvCnt 一次跳到 16
              //   →  == 6 / == 8 兩個 branch 永遠不 match → read pointer 凍結
              //   →  之後 ring buffer 滿 → 新 byte silently drop → HMI 永久卡死
              //   新版用 >= 並依 aucTempBuf[1] (0x00 vs 0x78) 區分 frame 類型，
              //   消化首個 frame 後 read pointer 前進，下次 tick 處理下一個 frame
              } else if (iRecvCnt >= 6 && aucTempBuf[1]==0x00 && aucTempBuf[2]==0xcc && aucTempBuf[3]==0x33 && aucTempBuf[4]==0xc3 && aucTempBuf[5]==0x3c) {
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 6) % ${MAX_UART_RECV_BUF_LEN});
              } else if (iRecvCnt >= 8 && aucTempBuf[1]==0x78 && aucTempBuf[4]==0xcc && aucTempBuf[5]==0x33 && aucTempBuf[6]==0xc3 && aucTempBuf[7]==0x3c) {
                // v4.0.70: RTC breadcrumb — 寫 HMI byte 到 RTC，panic 時保留
                {
                  char crumb[28];
                  snprintf(crumb, sizeof(crumb), "HMI_RX:0x%02X", (unsigned)aucTempBuf[3]);
                  set_reboot_tag_c(crumb);
                }
                // v4.0.80: HMI 任一 byte 進來 → 歸零 idle counter（重新倒數 15s）
                id(hmi_idle_counter_s) = 0;

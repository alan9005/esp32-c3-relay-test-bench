                //   S1 (0x11) = LED 音量：0/3/6/9/12/15 循環切換 → CMD led_volume
                //   S2 (0x12) = LED 亮度：0/50/100/150/200/255 循環切換 → CMD led_brightness
                //   S3 (0x13) = 保留（尚未定義）
                //   S4 (0x14) = Wash Reset（等同 Dashboard Reset 按鈕 / wash_reset_public）
                //   v3.16.77 拔掉 SSR 後這 4 個 byte 成為 orphan，v4.0.20 重新啟用
                else if (aucTempBuf[3] >= 0x11 && aucTempBuf[3] <= 0x14) {

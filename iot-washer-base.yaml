    id: ws_lan_server_info

  # v3.16.42: 伺服器心跳狀態（template polling, 2s 更新） — Dashboard/Server 判斷用
  # online  = 最近 90 秒內收到 server 送的 {"cmd":"online"}
  # offline = 超過 90 秒沒收到 → 本地接管洗車流程（auto-continue / LED 自行觸發）
  - platform: template

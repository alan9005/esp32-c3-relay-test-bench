                    //   currently paused → 送 wash_start CMD（恢復）→ HMI Evt = "running"
                    //   currently running → 送 wash_stop CMD（暫停）→ HMI Evt = "paused"
                    bool paused_now = id(ws).is_wash_paused();
                    const char *json = paused_now ? "{\"cmd\":\"wash_start\"}" : "{\"cmd\":\"wash_stop\"}";
                    id(ws).execute_cmd(std::string(json), "HMI");

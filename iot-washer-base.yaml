                    }
                    static char wash5_buf[2048];  // v4.0.261: static 避免 http_server task 4KB stack 爆掉
                    snprintf(wash5_buf, sizeof(wash5_buf), R"JSON({"type":"CMD","cmd":"wash_init","Order":{"order_sn":"%s","order_cost":"168","order_product":"168洗車方案|軟水:10,擦乾10分:30","order_name":"卡最多","order_msg":"請掃碼啟動洗車機或於控制螢幕上輸入啟動碼!! 下一個可預約的時間在3:30 約20分鐘後"},"unlock_pwd":"1234","lock_led_eff":"T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4","welcome_led_eff":"T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5","emg_led_eff":"T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5,T5|T6","min1_led_eff":"TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5,T5|T6,T6|T7","total":6,"steps":[{"id":"501","bb":0,"R03":0,"auto_sec":90,"name":"Intro","led_name":"01","led_eff":"T1|T2,T2|T3,T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA"},{"id":"502","bb":0,"R03":0,"auto_sec":3,"name":"Pre-Wash","led_name":"03","led_eff":"T2|T3,T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB"},{"id":"503","bb":1,"R03":0,"auto_sec":3,"name":"Foam","led_name":"04","led_eff":"T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC"},{"id":"504","bb":0,"R03":0,"auto_sec":300,"name":"AIScanning","led_name":"05","led_eff":"T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1"},{"id":"505","bb":0,"R03":1,"auto_sec":3,"name":"Final_Rinse","led_name":"06","led_eff":"T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2"},{"id":"506","bb":0,"R03":0,"auto_sec":70,"name":"Complete","led_name":"09","led_eff":"T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3"}]})JSON", order_sn5);
                    id(ws).execute_cmd(std::string(wash5_buf), "HMI");
                  } else if (aucTempBuf[3] == 0x18) {
                    // v4.0.259: 動態 order_sn = yymmddhhiiss + "_T2"
                    char order_sn6[24];

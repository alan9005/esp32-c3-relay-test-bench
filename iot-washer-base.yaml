                    }
                    static char wash6_buf[2048];  // v4.0.261: static 避免 http_server task 4KB stack 爆掉
                    snprintf(wash6_buf, sizeof(wash6_buf), R"JSON({"type":"CMD","cmd":"wash_init","Order":{"order_sn":"%s","order_cost":"268","order_product":"268進階洗車|預洗:20,軟水:10,擦乾10分:30","order_name":"卡有錢","order_msg":"請掃碼啟動洗車機或於控制螢幕上輸入啟動碼!! 下一個可預約的時間在6:30 約30分鐘後"},"unlock_pwd":"8888","lock_led_eff":"a0,b0,c0,d0","welcome_led_eff":"a88,b88,c88,d88","emg_led_eff":"a99,b99,c99,d99","min1_led_eff":"a1m,b1m,c1m,d1m","total":9,"steps":[{"id":"601","bb":0,"R03":0,"auto_sec":99,"name":"Intro","led_name":"01","led_eff":"a1,b1,c1,"},{"id":"602","bb":2,"R03":0,"auto_sec":5,"name":"Pre-Soak","led_name":"02","led_eff":"a2,b2,,d2"},{"id":"603","bb":0,"R03":0,"auto_sec":3,"name":"Pre-Wash","led_name":"03","led_eff":"a3,,c3,d3"},{"id":"604","bb":1,"R03":0,"auto_sec":3,"name":"Foam","led_name":"04","led_eff":",b4,c4,d4"},{"id":"605","bb":0,"R03":0,"auto_sec":300,"name":"AIScanning","led_name":"05","led_eff":"a5,b5,c5,d5"},{"id":"606","bb":0,"R03":0,"auto_sec":3,"name":"Rinse","led_name":"06","led_eff":"a6,,c6,d6"},{"id":"607","bb":3,"R03":0,"auto_sec":3,"name":"Coating","led_name":"07","led_eff":"a7,b7,,d7"},{"id":"608","bb":0,"R03":1,"auto_sec":3,"name":"Final_Rinse","led_name":"08","led_eff":"a8,b8,c8,"},{"id":"609","bb":0,"R03":0,"auto_sec":10,"name":"Complete","led_name":"09","led_eff":"a9,b9,c9,d9"}]})JSON", order_sn6);
                    id(ws).execute_cmd(std::string(wash6_buf), "HMI");
                  }
                  // v4.0.78: 0x17/0x18 wash_init 載入後立即刷新 HMI 洗車流程狀態（Y=480 bb4 line）
                  //   原本要等 10s interval 才會更新，用戶要求按下 button 後立即看到新流程
                  if (aucTempBuf[3] == 0x17 || aucTempBuf[3] == 0x18) {
                    id(hmi_refresh_bb4_line).execute();
                  }
                  id(washer_send_cmd).execute(idx + 3, std::string("HMI"), std::string(names[idx]));
                  // v4.0.66: HMI 事件顯示欄
                  {
                    char evt[32];
                    snprintf(evt, sizeof(evt), "cmd=%s       ", names[idx]);
                    id(hmi_last_event_line) = std::string(evt);
                    id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                  }
                }
                // ── v3.16.0: HMI 數字鍵盤密碼輸入 0x1D~0x28 ──
                // 0x1D=0, 0x1E=1, 0x1F=2, 0x20=3, 0x21=4, 0x22=5, 0x23=6, 0x24=7, 0x25=8, 0x26=9
                // 0x27=退格, 0x28=確認/送出
                else if (aucTempBuf[3] >= 0x1d && aucTempBuf[3] <= 0x28) {
                  uint8_t key = aucTempBuf[3];
                  if (key >= 0x1d && key <= 0x26) {
                    // v4.0.36: DWIN 4 格獨立方框 → 改回 AA 98 大字型（無底色）+ shift-register
                    //   字型 0x00 / 大小 0x10 0x00 / 白色；清底色改黑（去掉原本的深藍 0x00FC）
                    //   位置 = (110 + i*115, 184)
                    if (id(hmi_pwd_len) < ${USER_CODE_LENGTH}) {
                      for (int i = 0; i < ${USER_CODE_LENGTH} - 1; i++) {
                        id(hmi_pwd_buf)[i] = id(hmi_pwd_buf)[i+1];
                      }
                      id(hmi_pwd_buf)[${USER_CODE_LENGTH}-1] = (char)(key - 0x1d + '0');
                      id(hmi_pwd_len)++;
                      id(hmi_clear_pass_code).execute();
                      for (int i = 0; i < ${USER_CODE_LENGTH}; i++) {
                        char ch = id(hmi_pwd_buf)[i];
                        if (ch < '0' || ch > '9') continue;
                        id(hmi_show_pass_code).execute(110 + i * 115, 184, (int)ch);
                      }
                    }
                  } else if (key == 0x27) {
                    // v4.0.32: 退格 = 全清（不是逐字刪）
                    id(hmi_pwd_len) = 0;
                    for (int i = 0; i < ${USER_CODE_LENGTH}; i++) id(hmi_pwd_buf)[i] = ' ';
                    id(hmi_clear_pass_code).execute();
                  } else if (key == 0x28) {
                    // 確認/送出：呼叫 ws_client 密碼提交
                    if (id(hmi_pwd_len) > 0) {
                      id(ws).on_hmi_password_submit(id(hmi_pwd_buf), id(hmi_pwd_len));
                    }
                    // v4.0.40: 只清 buffer，不呼叫 hmi_clear_pass_code
                    //   避免 AA 71 矩形畫在 page 切換前殘留到工程頁
                    //   下次進密碼頁時 hmi_show_page AA 52 會清 OSD 舊字
                    id(hmi_pwd_len) = 0;
                    for (int i = 0; i < ${USER_CODE_LENGTH}; i++) id(hmi_pwd_buf)[i] = ' ';
                  }
                }
                // ── v3.16.19: HMI 頁面/功能按鈕 0x29~0x31, 0x2D~0x2E ──
                // 每個按鈕 = 直接對應一個固定動作，不做任何判斷/鎖定
                //   §3.6 監控頁右上角:

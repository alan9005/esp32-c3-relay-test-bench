binary_sensor:
  - platform: gpio
    name: "AC Power"
    id: ac_power_lose
    pin: {number: GPIO4, mode: INPUT_PULLUP}
    on_state:
      then:
        - lambda: |-
            id(hmi_show_param_value).execute(220, 32, x ? " ON" : "OFF");
            // ac_power_lose=OFF → 停電（x=false → state=true）
            id(ws).send_event("ac_power_off", !x);

  - platform: gpio
    name: "Emergency Button"
    id: emgr_input
    pin: {number: GPIO38, mode: INPUT_PULLUP, inverted: true}
    # v4.0.22: 300 → 150ms（用戶回報觸發時間過長）。WS 重連 3s guard 仍保留於 C++ 端
    filters: [{delayed_on_off: 150ms}]
    on_state:
      then:
        - lambda: |-
            // NC 緊急按鈕 (inverted: true → 正常=ON, 按下=OFF)
            // HMI 顯示與 web 一致：state ON = "ON", state OFF = "OFF"
            id(hmi_show_param_value).execute(220, 160, x ? " ON" : "OFF");
    on_release:
      then:
        - lambda: |-
            // v3.16.0: NC 緊急按鈕按下 (state ON→OFF = on_release) → 委派給 ws_client
            // v4.0.85: 重寫流程 — sequential gate (active/lock/paused/LED color/current threshold)
            //   每個 gate 組 HMI alert 字串顯示判斷過程；GREEN 用電流確認 (>0.6A 才推進)
            //   gowasher loop 2000ms 間隔（前 1500ms），max 10 次（不變）
            // 觸發前 trigger modbus update — 讓 cache 盡可能新鮮（雖然 update_interval=5s 已夠）
            id(modbus_device_dian_liu).update();
            id(ws).on_emg_button_pressed();
            // 立即刷 HMI Y=480（顯示 EMG alert 字串）
            id(hmi_refresh_bb4_line).execute();

  - platform: gpio
    name: "Start Stop Button"
    id: start_stop_input
    pin: {number: GPIO39, mode: INPUT_PULLUP, inverted: true}
    # v4.0.22: 300 → 150ms（用戶回報觸發時間過長）
    filters: [{delayed_on_off: 150ms}]
    on_state:
      then:
        - lambda: |-
            // HMI 顯示啟停按鈕狀態
            id(hmi_show_param_value).execute(220, 192, x ? " ON" : "OFF");
    on_release:
      then:
        - lambda: |-
            // v3.15.26: NC 啟停按鈕按下 (state ON→OFF = on_release) → 委派給 ws_client
            // 邏輯：讀取 go_enable_arg_（"gowasher"/"lotto"），
            //       若 arg=="gowasher" 且 washer_led_blue=ON → 呼叫 gowasher UART2，
            //       然後送 EVENT {event:"go_enable","state":"off","go_enable_arg":"<arg>"}
            id(ws).on_go_button_pressed();

  - platform: gpio
    name: "Car Height Detection"
    id: car_height_input
    pin: {number: GPIO18, mode: INPUT_PULLUP, inverted: true}
    filters: [{delayed_on: 200ms}]
    on_state:
      then:
        - lambda: |-
            id(hmi_show_param_value).execute(220, 224, x ? " ON" : "OFF");
            // car_height_input=ON → 車子超高
            id(ws).send_event("car_over_height", x);

  - platform: gpio
    name: "Boot Button"
    id: boot_button
    pin: {number: GPIO0, mode: INPUT_PULLUP, inverted: true}
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      then:
        - lambda: |-
            id(boot_press_start) = millis();
            id(boot_held) = true;
            ESP_LOGI("BOOT", "Button pressed, hold 5s for OTA");
    on_release:
      then:
        - lambda: |-
            uint32_t held_ms = millis() - id(boot_press_start);
            id(boot_held) = false;
            if (held_ms >= 5000) {
              // Long press ≥5s → trigger OTA
              ESP_LOGW("BOOT", "Long press %ums → OTA check", held_ms);
              id(cloud_ota).check_for_update();
            } else if (held_ms < 1000) {
              // Short press <1s → toggle web_server
              bool new_state = !id(web_server_switch).state;
              if (new_state) {
                id(web_server_switch).turn_on();
                ESP_LOGI("BOOT", "Web server ON");
              } else {
                id(web_server_switch).turn_off();
                ESP_LOGI("BOOT", "Web server OFF");
              }
            } else {
              ESP_LOGI("BOOT", "Medium press %ums, ignored", held_ms);
            }

  # --- 洗車機 LED 指示燈 ---
  # v3.15.25: 合併三個 LED 為單一 washer_status event，只在 OFF→ON 邊緣觸發
  #           格式: {"type":"EVENT","event":"washer_status","state":true,"color":"blue|green|red"}
  #           1500ms 節流共用 "washer_status" key（所有 color 共用一個槽）
  # v3.16.37: 全部三色 LED 加 delayed_on_off: 300ms — 與 NC 按鈕同樣處理
  #           原因：WS1 重連時 SPI/TLS 高負載 → GPIO 噪訊 → 洗車 LED 引腳被瞬間
  #                 拉高再放回 → ESPHome 誤判 OFF→ON → 送假 washer_status EVENT。
  #           實測：19:20:35 / 19:21:02 兩次假事件正好對應 WS1 重連時刻。
  #           300ms 不會影響真實洗車 LED（最短 phase 也是秒級）。
  - platform: gpio
    id: washer_led_blue
    name: "Washer LED Blue"
    pin: {number: GPIO21, mode: INPUT_PULLUP, inverted: true}
    # v4.0.264: 300ms → 150ms 捕捉短 BLUE pulse（GO 觸發後 BLUE→GREEN 可能 < 300ms）
    # 偏移分析：洗車機 offline 閃爍 500ms 半週期，150ms filter 留 350ms margin 仍穩定偵測
    filters: [{delayed_on_off: 150ms}]
    on_state:
      then:
        - lambda: |-
            // v3.16.0: 改呼叫 on_washer_led_change（保留 washer_status EVENT + wash stage debounce）
            id(hmi_show_param_value).execute(220, 288, x ? " ON" : "OFF");
            id(ws).on_washer_led_change("blue", x);

  - platform: gpio
    id: washer_led_green
    name: "Washer LED Green"
    pin: {number: GPIO47, mode: INPUT_PULLUP, inverted: true}
    # v4.0.264: 300ms → 150ms（同 blue 原因，捕捉短 GREEN pulse）
    filters: [{delayed_on_off: 150ms}]
    on_state:
      then:
        - lambda: |-
            // v3.16.0: 改呼叫 on_washer_led_change（保留 washer_status EVENT + wash stage debounce）
            id(hmi_show_param_value).execute(220, 320, x ? " ON" : "OFF");
            id(ws).on_washer_led_change("green", x);

  - platform: gpio
    id: washer_led_red
    name: "Washer LED Red"
    pin: {number: GPIO35, mode: INPUT_PULLUP, inverted: true}
    # v4.0.264: 300ms → 150ms（同 blue 原因，RED 通常穩定，主要為一致性 + 將來短紅燈也能偵測）
    filters: [{delayed_on_off: 150ms}]
    on_state:
      then:

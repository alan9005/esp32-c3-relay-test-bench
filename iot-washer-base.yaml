    name: "WS Log"
    id: ws_log

  # v4.0.282 [DEVICE-CHANNEL-REMOVE]: device_event_bus / device_cmd_out text_sensor 移除


  - platform: template
    name: "Device Serial"
    id: read_only_numbers
    update_interval: 10s
    lambda: |-
      return id(my_global_id);

  - platform: template
    name: "Reset Reason"
    id: reset_reason

  - platform: template
    name: "Crash PC"
    id: crash_pc

  # v4.0.86: Colorlight LED 狀態 — 顯示 ON/OFF/CD Ns 在 HMI 右欄 Y=352 + Web Dashboard
  # v4.0.232: 1s → 5s（每 1s 推 SSE 9 條/10s 太浪費；倒數顯示精度 5s 對狀態查看夠用）
  - platform: template
    name: "Colorlight Status"
    id: cl_led_status
    update_interval: 5s
    lambda: |-
      using esphome::colorlight::ColorlightClient;
      if (!ColorlightClient::is_enabled()) {
        return std::string("OFF (kill)");
      }
      uint32_t remain_ms = ColorlightClient::cooldown_remain_ms();
      if (remain_ms > 0) {
        char buf[24];
        snprintf(buf, sizeof(buf), "CD %us", (unsigned)((remain_ms + 999) / 1000));
        return std::string(buf);
      }
      return std::string("ON");

  # v3.16.68: Breadcrumb — 前次開機讀 EEPROM 0x0200 填入，格式:
  #   "last-crash: up=Xs loop=Yus heap=ZB min=WB phase=P stage=S/T off=O page=G evt='...'"
  - platform: template
    name: "Last Crash Context"
    id: last_crash_context
    lambda: |-
      return id(crash_context_str);
    update_interval: 60s

  # v4.0.60: RTC breadcrumb — panic/crash 後保留的最後步驟 tag（不依賴 EEPROM I2C）
  #   由 ws_client setup() 在開機時從 RTC_NOINIT 讀出並 publish 一次；
  #   colorlight task_entry 每階段（CL_PARSE_URL/CL_DNS/CL_SOCKET/CL_CONNECT/CL_SEND）設 tag。
  - platform: template
    name: "Last RTC Crumb"
    id: last_rtc_crumb
    update_interval: never

  - platform: template
    name: "OTA Status"
    id: ota_status

  - platform: template
    name: "API Response Result"
    id: api_result

  - platform: template
    name: "UART2 Monitor"
    id: uart2_monitor

  - platform: template
    name: "EEPROM Result"
    id: eeprom_result
    icon: "mdi:memory"

  # v3.16.60: LED 螢幕控制橋接（restore led_update/brightness/volume CMDs）
  # 支援格式：
  #   "{ms}|switch|{source}|{name}"                             → led_switch
  #   "{ms}|update|{source}|{x}|{y}|{color}|{name}|{text}"      → led_update (text 為最後欄位，可含 |)
  #   "{ms}|brightness|{value}"                                 → led_brightness
  #   "{ms}|volume|{value}"                                     → led_volume
  - platform: template
    name: "LED CMD"
    id: led_cmd
    on_value:
      then:
        - lambda: |-
            std::string val = x;
            size_t p1 = val.find('|');
            if (p1 == std::string::npos) return;
            size_t p2 = val.find('|', p1 + 1);
            if (p2 == std::string::npos) return;
            std::string cmd = val.substr(p1 + 1, p2 - p1 - 1);
            std::string rest = val.substr(p2 + 1);
            if (cmd == "switch") {
              // rest = "{source}|{name}"
              size_t q1 = rest.find('|');
              if (q1 == std::string::npos) return;
              std::string src = rest.substr(0, q1);
              std::string nm = rest.substr(q1 + 1);
              id(led_switch).execute(nm, src);
            } else if (cmd == "update") {
              // rest = "{source}|{x}|{y}|{color}|{name}|{text}"
              size_t q1 = rest.find('|');
              if (q1 == std::string::npos) return;
              std::string src = rest.substr(0, q1);
              size_t q2 = rest.find('|', q1 + 1);
              if (q2 == std::string::npos) return;
              int xv = atoi(rest.substr(q1 + 1, q2 - q1 - 1).c_str());
              size_t q3 = rest.find('|', q2 + 1);
              if (q3 == std::string::npos) return;
              int yv = atoi(rest.substr(q2 + 1, q3 - q2 - 1).c_str());
              size_t q4 = rest.find('|', q3 + 1);
              if (q4 == std::string::npos) return;
              std::string color = rest.substr(q3 + 1, q4 - q3 - 1);
              size_t q5 = rest.find('|', q4 + 1);
              if (q5 == std::string::npos) return;
              std::string name = rest.substr(q4 + 1, q5 - q4 - 1);
              std::string text = rest.substr(q5 + 1);  // text 為最後一欄，允許內含 |
              id(led_update).execute(name, text, color, xv, yv, src);
            } else if (cmd == "brightness") {
              int v = atoi(rest.c_str());
              id(led_brightness).execute(v);
            } else if (cmd == "volume") {
              int v = atoi(rest.c_str());
              id(led_volume).execute(v);
            }

number:
  - platform: template
    name: "EEPROM Address"
    id: eeprom_addr
    min_value: 0
    max_value: 32767
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false

  - platform: template
    name: "EEPROM Read Length"
    id: eeprom_read_len
    min_value: 1
    max_value: 128
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: false

  # v3.16.58: 移除 led_count_1 / led_count_2 number entity
  # （原本用來控制「前 N 顆亮」，拔除動畫效果後功能與 brightness 重複）

text:
  - platform: template
    name: "EEPROM Write Data"
    id: eeprom_input
    mode: text
    optimistic: true
    min_length: 0
    max_length: 128
    on_value:
      then:
        - lambda: 'id(eeprom_write_data) = x;'


  - platform: template
    name: "WS API Key"
    id: ws_api_key_input
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 64
    initial_value: "${ws_api_key}"
    on_value:
      then:
        - lambda: 'if (!x.empty()) id(ws).update_api_key(x);'

  - platform: template
    name: "WS Send Text"
    id: ws_send_text
    mode: text
    optimistic: true
    min_length: 0
    max_length: 255

  - platform: template
    name: "WS CMD Input"
    id: ws_cmd_input
    mode: text
    optimistic: true
    min_length: 0
    max_length: 255

  # v4.0.282 [DEVICE-CHANNEL-REMOVE]: device_announce_in / device_event_in 移除

  - platform: template
    name: "Serial Input"
    id: serial_input
    mode: text
    optimistic: true
    min_length: 0
    max_length: 10

  - platform: template
    name: "Serial Password"
    id: serial_password
    mode: text
    optimistic: true
    min_length: 0
    max_length: 10

  # v4.0.262: 序列號寫入「單一 REST」入口 — 取代 3-step chained
  #   原問題：Dashboard 寫 SN 走 3 個連續 REST (set serial_input + set serial_password + press Write Serial)
  #          快速連打 web_server 沖爆，UI 卡 "Writing..."
  #   新做法：一個 text entity 帶 "sn|pwd" 格式，on_value 一次處理完
  #   格式：{"value":"1221|40261"}（pwd = 韌體版本去掉小數點，如 v4.0.262 → 40262）
  - platform: template
    name: "Serial Write Combo"
    id: serial_write_combo
    mode: text
    optimistic: true
    min_length: 0
    max_length: 30
    on_value:
      then:
        - lambda: |-
            std::string raw = x;
            if (raw.empty()) return;
            // 解析 "sn|pwd" 格式
            size_t pos = raw.find('|');
            if (pos == std::string::npos) {
              id(eeprom_result).publish_state("Serial FAILED: format must be sn|pwd");
              return;
            }
            std::string new_serial = raw.substr(0, pos);
            std::string pwd = raw.substr(pos + 1);
            // 驗密碼：當前韌體版本去點（v4.0.262 → 40262）
            std::string ver = "${DEV_FIRMWARE_VER}";
            std::string expected_pwd;
            for (char c : ver) { if (c != '.') expected_pwd += c; }
            if (pwd != expected_pwd) {
              id(eeprom_result).publish_state("Serial FAILED: wrong password");
              return;
            }
            // 驗 SN：4-10 純數字（對齊 DEV_ID_LENGTH=4）
            if (new_serial.length() < 4 || new_serial.length() > 10) {
              id(eeprom_result).publish_state("Serial FAILED: need 4-10 digits");
              return;
            }
            for (char c : new_serial) {
              if (c < '0' || c > '9') {
                id(eeprom_result).publish_state("Serial FAILED: digits only");
                return;
              }
            }
            // 寫 EEPROM 0x0001
            id(eeprom_writing) = true;
            bool ok = id(eeprom_1).set(0x0001, (const uint8_t*)new_serial.c_str(), new_serial.length());
            // 終止 byte 防舊資料殘留
            uint8_t term = 0xFF;
            id(eeprom_1).set(0x0001 + new_serial.length(), &term, 1);
            id(eeprom_writing) = false;
            if (ok) {
              id(my_global_id) = new_serial;
              id(ws).set_device_id(new_serial);
              id(cloud_ota).set_device_id(new_serial);
              id(read_only_numbers).publish_state(new_serial);
              char buf[128];
              snprintf(buf, sizeof(buf), "Serial OK: %s written, restart to apply", new_serial.c_str());
              id(eeprom_result).publish_state(buf);
              ESP_LOGI("SERIAL", "New serial: %s", new_serial.c_str());
            } else {
              id(eeprom_result).publish_state("Serial FAILED: EEPROM write error");
            }

button:

  - platform: template
    name: "WS Connect"
    icon: "mdi:connection"
    on_press:
      then:
        - lambda: 'id(ws).manual_connect();'

  - platform: template
    name: "WS Disconnect"
    icon: "mdi:close-network"
    on_press:
      then:
        - lambda: 'id(ws).manual_disconnect();'

  # v4.0.91: WS1 切換到 LAN 測試 server (192.168.1.99)
  #   只改 server，port/use_ssl/api_key 不變；重開機從 YAML 還原
  #   v4.0.91 重做：強制 disconnect+manual_connect，每階段詳細 log
  - platform: template
    name: "WS1 Switch LAN Test"
    icon: "mdi:lan-connect"
    on_press:
      then:
        - lambda: 'id(ws).switch_ws1_to_lan_test();'

  - platform: template
    name: "WS Send"
    icon: "mdi:send"
    on_press:
      then:
        - lambda: |-
            std::string text = id(ws_send_text).state;
            if (text.empty()) {
              ESP_LOGW("WS", "No text to send");
              return;
            }
            if (!id(ws).is_connected()) {
              ESP_LOGW("WS", "Not connected");
              return;
            }
            id(ws).send_data(text);
            ESP_LOGI("WS", "Sent: %s", text.c_str());

  - platform: template
    name: "WS CMD Exec"
    icon: "mdi:play-circle"
    on_press:
      then:
        - lambda: |-
            std::string cmd = id(ws_cmd_input).state;
            if (cmd.empty()) {
              ESP_LOGW("CMD", "No command");
              return;
            }
            std::string result = id(ws).execute_cmd(cmd);
            ESP_LOGI("CMD", "Result: %s", result.c_str());
            // Publish result to ws_log for Dashboard display
            for (auto *ts : App.get_text_sensors()) {
              if (ts->get_name() == "WS Log") {
                ts->publish_state("CMD: " + result);
                break;
              }
            }

  - platform: template
    name: "EEPROM Write"
    icon: "mdi:content-save"
    on_press:
      then:
        - lambda: |-
            id(eeprom_writing) = true;
            uint16_t addr = (uint16_t)id(eeprom_addr).state;
            std::string data = id(eeprom_write_data);
            if (data.empty()) { id(eeprom_writing) = false; id(eeprom_result).publish_state("ERROR: No data"); return; }
            bool ok = id(eeprom_1).set(addr, (const uint8_t*)data.c_str(), data.length());
            id(eeprom_writing) = false;
            if (ok) {
              char buf[128];
              snprintf(buf, sizeof(buf), "WRITE OK: %u bytes @ 0x%04X", (unsigned)data.length(), addr);
              id(eeprom_result).publish_state(buf);
            } else { id(eeprom_result).publish_state("WRITE FAILED"); }

  - platform: template
    name: "EEPROM Read"
    icon: "mdi:book-open-variant"
    on_press:
      then:
        - lambda: |-
            uint16_t addr = (uint16_t)id(eeprom_addr).state;
            uint16_t len = (uint16_t)id(eeprom_read_len).state;
            uint8_t buffer[128] = {0};
            if (len > 128) len = 128;
            bool ok = id(eeprom_1).get(addr, buffer, len);
            if (ok) {
              std::string hex_str, ascii_str;
              for (int i = 0; i < len; i++) {
                char h[4]; snprintf(h, sizeof(h), "%02X ", buffer[i]);
                hex_str += h;
                ascii_str += (buffer[i] >= 32 && buffer[i] < 127) ? (char)buffer[i] : '.';
              }
              id(eeprom_result).publish_state("HEX: " + hex_str + " | ASCII: " + ascii_str);
            } else { id(eeprom_result).publish_state("READ FAILED"); }

  - platform: template
    name: "EEPROM Verify"
    icon: "mdi:check-circle"
    on_press:
      then:
        - lambda: |-
            id(eeprom_writing) = true;
            uint16_t addr = (uint16_t)id(eeprom_addr).state;
            std::string data = id(eeprom_write_data);
            if (data.empty()) { id(eeprom_writing) = false; id(eeprom_result).publish_state("ERROR: No data"); return; }
            if (!id(eeprom_1).set(addr, (const uint8_t*)data.c_str(), data.length())) {
              id(eeprom_writing) = false; id(eeprom_result).publish_state("VERIFY FAILED: Write error"); return;
            }
            uint8_t buffer[128] = {0};
            uint16_t len = data.length(); if (len > 128) len = 128;
            if (!id(eeprom_1).get(addr, buffer, len)) {
              id(eeprom_writing) = false; id(eeprom_result).publish_state("VERIFY FAILED: Read error"); return;
            }
            id(eeprom_writing) = false;
            if (memcmp(buffer, data.c_str(), len) == 0) {
              char buf[128]; snprintf(buf, sizeof(buf), "VERIFY OK: %u bytes @ 0x%04X", len, addr);
              id(eeprom_result).publish_state(buf);
            } else {
              std::string detail = "VERIFY FAILED: ";
              for (int i = 0; i < len; i++) { char h[4]; snprintf(h, sizeof(h), "%02X", buffer[i]); detail += h; }
              id(eeprom_result).publish_state(detail);
            }

  - platform: template
    name: "Restart Device"
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            // Save current uptime before restart
            uint32_t up_s = millis() / 1000;
            uint8_t up_buf[4];
            up_buf[0] = up_s & 0xFF; up_buf[1] = (up_s>>8) & 0xFF;
            up_buf[2] = (up_s>>16) & 0xFF; up_buf[3] = (up_s>>24) & 0xFF;
            id(eeprom_1).set(0x0104, up_buf, 4);
            // v4.0.16: 標記兇手 + 同步寫 breadcrumb（delay 500ms 太短，3s interval 趕不上）
            set_reboot_tag_c("REBOOT_DASHBOARD");
            {
              uint8_t bc[64] = {0};
              bc[0]=0xEF; bc[1]=0xBE; bc[2]=0xAD; bc[3]=0xDE;  // magic
              bc[4]=up_s & 0xFF; bc[5]=(up_s>>8)&0xFF; bc[6]=(up_s>>16)&0xFF; bc[7]=(up_s>>24)&0xFF;
              uint32_t hp = esp_get_free_heap_size();
              bc[12]=hp & 0xFF; bc[13]=(hp>>8)&0xFF; bc[14]=(hp>>16)&0xFF; bc[15]=(hp>>24)&0xFF;
              memcpy(&bc[28], "REBOOT_DASHBOARD", 16);
              id(eeprom_1).set(0x0200, bc, 64);
            }
            ESP_LOGI("SYS", "Restarting device (REBOOT_DASHBOARD)...");
            delay(500);
            esp_restart();

  - platform: template
    name: "Check OTA"
    icon: "mdi:cloud-download"
    on_press:
      then:
        - lambda: 'id(cloud_ota).check_for_update();'

  # ──────────────────────────────────────────────────────────────────
  # v3.16.15: 遠程開發測試按鈕（Dashboard 洗車階段狀態卡片）
  # GO/EMG：模擬物理 NC 按鈕的 pull-high 100ms 脈衝（等效於 on_release）
  # GREEN/BLUE/RED：切換 LED 狀態並觸發 on_washer_led_change（wash state machine）
  #   注意：washer_led_X 是 GPIO INPUT_PULLUP pin，無法真正 output driven。
  #   publish_state() 會立即觸發 on_state lambda，自動呼叫 on_washer_led_change。
  #   若實體 IO 腳後續變化，GPIO 讀取會覆蓋並再次 publish，self-latching 自動完成。
  # ──────────────────────────────────────────────────────────────────
  - platform: template
    name: "Test GO"
    id: test_btn_go
    icon: "mdi:play-circle"
    on_press:
      then:
        - lambda: |-
            // v3.16.20: 改為 toggle 模式（和 Test GREEN/BLUE/RED 一致）
            // 每次點擊反轉 start_stop_input 狀態（NC: true=正常, false=按下）
            // state 變化會觸發對應 lambda (on_release=true→false 按下, on_press=false→true 釋放)
            bool new_state = !id(start_stop_input).state;
            ESP_LOGI("TEST", "Test GO toggle: %s → %s",
                     id(start_stop_input).state ? "ON" : "OFF",
                     new_state ? "ON" : "OFF");
            id(start_stop_input).publish_state(new_state);

  - platform: template
    name: "Test EMG"
    id: test_btn_emg
    icon: "mdi:alert-circle"
    on_press:
      then:
        - lambda: |-
            // v3.16.20: 改為 toggle 模式（和 Test GREEN/BLUE/RED 一致）
            // 每次點擊反轉 emgr_input 狀態（NC: true=正常, false=按下）
            bool new_state = !id(emgr_input).state;
            ESP_LOGI("TEST", "Test EMG toggle: %s → %s",
                     id(emgr_input).state ? "ON" : "OFF",
                     new_state ? "ON" : "OFF");
            id(emgr_input).publish_state(new_state);

  - platform: template
    name: "Test LED Green"
    id: test_btn_green
    icon: "mdi:led-on"
    on_press:
      then:
        - lambda: |-
            bool new_state = !id(washer_led_green).state;
            ESP_LOGI("TEST", "Test GREEN toggle: %s → %s",
                     id(washer_led_green).state ? "ON" : "OFF",
                     new_state ? "ON" : "OFF");
            id(washer_led_green).publish_state(new_state);
            // v4.0.252: 切到 OFF 時清 current_led_color_（避免本地模擬殘留干擾後續派送）
            if (!new_state) id(ws).clear_current_led_color();


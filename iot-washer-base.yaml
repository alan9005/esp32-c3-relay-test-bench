  # Web Server enable/disable switch
  # Production: RESTORE_DEFAULT_OFF (web server off by default, toggle via BOOT button)
  # on_boot turn_on() will start it at boot
  - platform: template
    name: "Web Server"
    id: web_server_switch
    icon: "mdi:web"
    entity_category: config
    # v4.0.253: RESTORE_DEFAULT_OFF → ON 修正
    #   web_server component 永遠在跑（重啟/OTA 後 dashboard 立即可開）
    #   但這個 switch 預設 OFF → LED 進 web-off slow blink (500ms 綠閃)
    #   每次 OTA 完都要手動開回 → 修正預設為 ON 以符合「web 在跑 = ON」直覺
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      # 200ms delay：如果剛剛才 turn_off（end()），給 AsyncWebServer 時間清 SSE client，
      # 避免 begin() 和殘留 SSE 連線 race 導致記憶體爆掉重啟。
      # 對應 OTA 流程 line 615-624 的 100ms pattern，拉長到 200ms 更保險。
      - delay: 200ms
      - lambda: |-
          auto *base = esphome::web_server_base::global_web_server_base;
          if (base && base->get_server()) {
            base->get_server()->begin();
            ESP_LOGI("WEB", "Web server started on port 80");
          }
    turn_off_action:
      - lambda: |-
          auto *base = esphome::web_server_base::global_web_server_base;
          if (base && base->get_server()) {
            base->get_server()->end();
            ESP_LOGI("WEB", "Web server stopped");
          }


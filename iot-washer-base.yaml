  # ──────────────────────────────────────────────────────────────────
  # v3.16.66: Dashboard 小測試/大測試按鈕 — 完全複製 HMI 0x17/0x18 行為
  #   小測試 = HMI startwasher5 (按鈕 0x17)：派送 wash_init 腳本（動態 order_sn=yymmddhhiiss_T1）+ UART2 cmd 5
  #   大測試 = HMI startwasher6 (按鈕 0x18)：派送 wash_init 腳本（動態 order_sn=yymmddhhiiss_T2）+ UART2 cmd 6
  #   src_tag 用 "HMI"，讓下游 EVENT 與實體 HMI 觸發完全一致
  # ──────────────────────────────────────────────────────────────────
  - platform: template
    name: "Test Wash5"
    id: test_btn_wash5
    icon: "mdi:car-wash"
    on_press:
      then:
        - lambda: |-
            // v4.0.259: 動態 order_sn = yymmddhhiiss + "_T1"（取代寫死的 "250428TEST1"）
            char order_sn[24];
            auto t5 = id(sntp_time).now();
            if (t5.is_valid()) {
              snprintf(order_sn, sizeof(order_sn), "%02u%02u%02u%02u%02u%02u_T1",
                       t5.year % 100, t5.month, t5.day_of_month,
                       t5.hour, t5.minute, t5.second);
            } else {
              snprintf(order_sn, sizeof(order_sn), "NTPFAIL_T1");
            }
            static char wash5_buf[2048];  // v4.0.261: static 避免 http_server task 4KB stack 爆掉
            snprintf(wash5_buf, sizeof(wash5_buf), R"JSON({"type":"CMD","cmd":"wash_init","Order":{"order_sn":"%s","order_cost":"168","order_product":"168洗車方案|軟水:10,擦乾10分:30","order_name":"卡最多","order_msg":"請掃碼啟動洗車機或於控制螢幕上輸入啟動碼!! 下一個可預約的時間在3:30 約20分鐘後"},"unlock_pwd":"1234","lock_led_eff":"T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4","welcome_led_eff":"T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5","emg_led_eff":"T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5,T5|T6","min1_led_eff":"TA|TB,TB|TC,TC|T1,T1|T2,T2|T3,T3|T4,T4|T5,T5|T6,T6|T7","total":6,"steps":[{"id":"501","bb":0,"R03":0,"auto_sec":90,"name":"Intro","led_name":"01","led_eff":"T1|T2,T2|T3,T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA"},{"id":"502","bb":0,"R03":0,"auto_sec":3,"name":"Pre-Wash","led_name":"03","led_eff":"T2|T3,T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB"},{"id":"503","bb":1,"R03":0,"auto_sec":3,"name":"Foam","led_name":"04","led_eff":"T3|T4,T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC"},{"id":"504","bb":0,"R03":0,"auto_sec":300,"name":"AIScanning","led_name":"05","led_eff":"T4|T5,T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1"},{"id":"505","bb":0,"R03":1,"auto_sec":3,"name":"Final_Rinse","led_name":"06","led_eff":"T5|T6,T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2"},{"id":"506","bb":0,"R03":0,"auto_sec":70,"name":"Complete","led_name":"09","led_eff":"T6|T7,T7|T8,T8|T9,T9|TA,TA|TB,TB|TC,TC|T1,T1|T2,T2|T3"}]})JSON", order_sn);
            // v3.16.68: Breadcrumb
            snprintf(id(breadcrumb_last_event), 32, "DASH_WASH5");
            // v3.16.75: 自動先 reset
            id(ws).wash_reset_public();
            id(ws).execute_cmd(std::string(wash5_buf), "HMI");
            // v4.0.79: wash_init 載入後立即刷新 HMI Y=480 流程狀態
            id(hmi_refresh_bb4_line).execute();
            id(washer_send_cmd).execute(5, std::string("HMI"), std::string("startwasher5"));

  - platform: template
    name: "Test Wash6"
    id: test_btn_wash6
    icon: "mdi:car-wash"
    on_press:
      then:
        - lambda: |-
            // v4.0.259: 動態 order_sn = yymmddhhiiss + "_T2"（取代寫死的 "250428TEST2"）
            char order_sn[24];
            auto t6 = id(sntp_time).now();
            if (t6.is_valid()) {
              snprintf(order_sn, sizeof(order_sn), "%02u%02u%02u%02u%02u%02u_T2",
                       t6.year % 100, t6.month, t6.day_of_month,
                       t6.hour, t6.minute, t6.second);
            } else {
              snprintf(order_sn, sizeof(order_sn), "NTPFAIL_T2");
            }
            static char wash6_buf[2048];  // v4.0.261: static 避免 http_server task 4KB stack 爆掉
            snprintf(wash6_buf, sizeof(wash6_buf), R"JSON({"type":"CMD","cmd":"wash_init","Order":{"order_sn":"%s","order_cost":"268","order_product":"268進階洗車|預洗:20,軟水:10,擦乾10分:30","order_name":"卡有錢","order_msg":"請掃碼啟動洗車機或於控制螢幕上輸入啟動碼!! 下一個可預約的時間在6:30 約30分鐘後"},"unlock_pwd":"8888","lock_led_eff":"a0,b0,c0,d0","welcome_led_eff":"a88,b88,c88,d88","emg_led_eff":"a99,b99,c99,d99","min1_led_eff":"a1m,b1m,c1m,d1m","total":9,"steps":[{"id":"601","bb":0,"R03":0,"auto_sec":99,"name":"Intro","led_name":"01","led_eff":"a1,b1,c1,"},{"id":"602","bb":2,"R03":0,"auto_sec":5,"name":"Pre-Soak","led_name":"02","led_eff":"a2,b2,,d2"},{"id":"603","bb":0,"R03":0,"auto_sec":3,"name":"Pre-Wash","led_name":"03","led_eff":"a3,,c3,d3"},{"id":"604","bb":1,"R03":0,"auto_sec":3,"name":"Foam","led_name":"04","led_eff":",b4,c4,d4"},{"id":"605","bb":0,"R03":0,"auto_sec":300,"name":"AIScanning","led_name":"05","led_eff":"a5,b5,c5,d5"},{"id":"606","bb":0,"R03":0,"auto_sec":3,"name":"Rinse","led_name":"06","led_eff":"a6,,c6,d6"},{"id":"607","bb":3,"R03":0,"auto_sec":3,"name":"Coating","led_name":"07","led_eff":"a7,b7,,d7"},{"id":"608","bb":0,"R03":1,"auto_sec":3,"name":"Final_Rinse","led_name":"08","led_eff":"a8,b8,c8,"},{"id":"609","bb":0,"R03":0,"auto_sec":10,"name":"Complete","led_name":"09","led_eff":"a9,b9,c9,d9"}]})JSON", order_sn);
            // v3.16.68: Breadcrumb
            snprintf(id(breadcrumb_last_event), 32, "DASH_WASH6");
            // v3.16.75: 自動先 reset
            id(ws).wash_reset_public();
            id(ws).execute_cmd(std::string(wash6_buf), "HMI");
            // v4.0.79: wash_init 載入後立即刷新 HMI Y=480 流程狀態
            id(hmi_refresh_bb4_line).execute();
            id(washer_send_cmd).execute(6, std::string("HMI"), std::string("startwasher6"));

  # v3.16.67: Reset 按鈕 — 清空洗車階段狀態（泡泡、步驟、LED debounce、R03 軟水）
  #   不影響 server heartbeat、不影響 go_enable/emg_enable
  - platform: template
    name: "Test Wash Reset"
    id: test_btn_wash_reset
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            // v3.16.68: Breadcrumb
            snprintf(id(breadcrumb_last_event), 32, "DASH_WASH_RESET");
            id(ws).wash_reset_public();
            // v4.0.79: wash_reset 後立即刷新 HMI Y=480 流程狀態
            id(hmi_refresh_bb4_line).execute();

  # v3.16.72: 遠端 LED 測試按鈕 — 完全對應 HMI 0x30 / 0x31 行為
  #   方便從 Dashboard 直接測試 LED 螢幕節目切換與文字更新，不用到現場按 HMI
  #   行為與 iot-washer-base.yaml 第 3148 行 HMI handler 一致
  - platform: template
    name: "Test LED Camera"
    id: test_btn_led_camera
    icon: "mdi:video"
    on_press:
      then:
        - lambda: |-
            // v4.0.108: 同步 HMI 0x30 改 RPi API (PUT + JSON body, 不等回應)
            //   原本走 led_switch 切 hmi_camtest vsn 節目，現改呼叫 RPi 後端 API
            //   重用 cl 非阻塞 worker (latest-wins / cooldown / log 全繼承)
            snprintf(id(breadcrumb_last_event), 32, "DASH_LED_CAMERA");
            static const char *URL = "http://192.168.1.10:8096/module_dualcam_LED/start";
            static const char *BODY = "{\"duration_seconds\":\"60\",\"fps\":\"12\",\"interval_ms\":\"80\",\"layout\":\"thirds\",\"top_text\":\"慧流測試\",\"bottom_text\":\"趕緊掃碼 加入AI洗車事業\",\"qr_url\":\"https://www.huiflow.com/\"}";
            id(cl).put(std::string(URL), std::string(""), std::string("application/json"), std::string(BODY));

  - platform: template
    name: "Test LED Text"
    id: test_btn_led_text
    icon: "mdi:text-box"
    on_press:
      then:
        - lambda: |-
            // HMI 0x31 LED TEXT 等效：led_update 帶 device_id 文字
            // v4.0.99: VSN 從 vsn_map 取（key="hmi_text"）；text 內容 + 顏色 + 位置寫死不變
            snprintf(id(breadcrumb_last_event), 32, "DASH_LED_TEXT");
            std::string vsn = id(ws).vsn_lookup("hmi_text");
            if (!vsn.empty()) {
              std::string text = "device:" + id(my_global_id) + " 我上線啦";
              id(led_update).execute(vsn, text, std::string("#0000FF"), 69, 0, std::string("internet"));
            } else {
              ESP_LOGW("DASH", "Test LED Text: vsn_map[hmi_text] empty, skip");
            }

  # v4.0.22: Dashboard 模擬 HMI S1~S4（工程頁 0x11~0x14）
  #   S1 → LED 音量循環 0/3/6/9/12/15（送 CMD led_volume）
  #   S2 → LED 亮度循環 0/50/100/150/200/255（送 CMD led_brightness）
  #   S3 → 保留（僅 log）
  #   S4 → wash_reset_public（但目前 HMI 上要按兩次，Dashboard 單次也呼叫同一 API；詳見下次修復）
  - platform: template
    name: "Test S1"
    id: test_btn_s1
    icon: "mdi:volume-high"
    on_press:
      then:
        - lambda: |-
            // v4.0.108: 同步 HMI S1 — 移除 0 / 15 → {3,6,9,12}
            static const int vol_table[] = {3, 6, 9, 12};
            static uint8_t vol_idx = 0;
            vol_idx = (uint8_t)((vol_idx + 1) % (sizeof(vol_table) / sizeof(vol_table[0])));
            int v = vol_table[vol_idx];
            char json[64];
            snprintf(json, sizeof(json), "{\"type\":\"CMD\",\"cmd\":\"led_volume\",\"value\":%d}", v);
            id(ws).execute_cmd(std::string(json), "DASH");

  - platform: template
    name: "Test S2"
    id: test_btn_s2
    icon: "mdi:brightness-6"
    on_press:
      then:
        - lambda: |-
            // v4.0.108: 同步 HMI S2 — 移除 0 → {50,100,150,200,255}
            static const int br_table[] = {50, 100, 150, 200, 255};
            static uint8_t br_idx = 0;
            br_idx = (uint8_t)((br_idx + 1) % (sizeof(br_table) / sizeof(br_table[0])));
            int v = br_table[br_idx];
            char json[72];
            snprintf(json, sizeof(json), "{\"type\":\"CMD\",\"cmd\":\"led_brightness\",\"value\":%d}", v);
            id(ws).execute_cmd(std::string(json), "DASH");

  - platform: template
    name: "Test S3"
    id: test_btn_s3
    icon: "mdi:help"
    on_press:
      then:
        - lambda: |-
            id(ws_log).publish_state(std::string("[DASH] S3 reserved"));

  - platform: template
    name: "Test S4"
    id: test_btn_s4
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            // 透過 wash_reset CMD 走統一 dispatch，方便 Server 看到 CMD_RESULT
            id(ws).execute_cmd(std::string("{\"type\":\"CMD\",\"cmd\":\"wash_reset\"}"), "DASH");

  - platform: template
    name: "Check OTA Update"
    icon: "mdi:cloud-download"
    on_press:
      then:
        - lambda: 'id(cloud_ota).check_for_update();'

  - platform: template
    name: "Write Serial"
    icon: "mdi:identifier"
    on_press:
      then:
        - lambda: |-
            std::string new_serial = id(serial_input).state;
            std::string pwd = id(serial_password).state;
            // Validate password: version without dots (e.g. 3.2.17 → 3217)
            std::string ver = "${DEV_FIRMWARE_VER}";
            std::string expected_pwd;
            for (char c : ver) { if (c != '.') expected_pwd += c; }
            if (pwd != expected_pwd) {
              id(eeprom_result).publish_state("Serial FAILED: wrong password");
              return;
            }
            // v4.0.31: Validate serial: 4-10 digits only（對齊 DEV_ID_LENGTH=4 開機驗證）
            if (new_serial.length() < 4 || new_serial.length() > 10) {
              id(eeprom_result).publish_state("Serial FAILED: need 4-10 digits");
              return;
            }
            for (char c : new_serial) {
              if (c < '0' || c > '9') {
                id(eeprom_result).publish_state("Serial FAILED: digits only");
                return;
              }
            }
            // Write to EEPROM 0x0001
            id(eeprom_writing) = true;
            bool ok = id(eeprom_1).set(0x0001, (const uint8_t*)new_serial.c_str(), new_serial.length());
            // Write a terminator byte after serial (to prevent old trailing digits)
            uint8_t term = 0xFF;
            id(eeprom_1).set(0x0001 + new_serial.length(), &term, 1);
            id(eeprom_writing) = false;
            if (ok) {
              id(my_global_id) = new_serial;
              id(ws).set_device_id(new_serial);
              id(cloud_ota).set_device_id(new_serial);
              id(read_only_numbers).publish_state(new_serial);
              char buf[128];
              snprintf(buf, sizeof(buf), "Serial OK: %s written, restart to apply", new_serial.c_str());
              id(eeprom_result).publish_state(buf);
              ESP_LOGI("SERIAL", "New serial: %s", new_serial.c_str());
            } else {
              id(eeprom_result).publish_state("Serial FAILED: EEPROM write error");
            }

script:

  # ──────────────────────────────────────────────────────────────────
  # Colorlight LED 螢幕 4 APIs (@192.168.1.14)
  # 實作參考：docs/colorlight-led-esphome.md
  # 注意坑：
  #   1. 中文節目名必須 URL encode（script 內已處理）
  #   2. ESPHome 2026.2.2+ 用 request_headers 不是 headers
  #   3. url/body lambda 必須用 static std::string 保活 + 在同一個 lambda 內產出
  #   4. led_update 只對「滾動文字 + 允許遠端更新」節目有效
  #   5. 音量欄位名是 musicvolume 不是 volume
  # ──────────────────────────────────────────────────────────────────

  # ── led_switch: 切換 LED 節目 ──
  # 參數: name (節目檔名，含 .vsn), source (lan / internet)
  # API: PUT /api/vsns/sources/{source}/vsns/{name}/activated
  # v3.16.57: 改用 colorlight client 非同步送（fire-and-forget，不卡主 loop）
  - id: led_switch
    parameters:
      name: string
      source: string
    mode: single
    then:
      - lambda: |-
          // URL-encode 節目名稱（中文必要）
          std::string encoded;
          for (unsigned char c : name) {
            if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') ||
                (c >= '0' && c <= '9') || c == '-' || c == '_' ||
                c == '.' || c == '~') {
              encoded += c;
            } else {
              char buf[4];
              snprintf(buf, sizeof(buf), "%%%02X", c);
              encoded += buf;
            }
          }
          std::string url = "http://192.168.1.14/api/vsns/sources/" + source +
                            "/vsns/" + encoded + "/activated";
          // v4.0.22: 追蹤 API EVENT（送 WS1/WS2），在呼叫 HTTP 之前送出
          {
            std::string params = std::string("\"name\":\"") + name +
                                 "\",\"source\":\"" + source + "\"";
            id(ws).send_api_event("led_switch", params);
          }
          id(cl).put(url, "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz", "", "");
          char logbuf[80];
          snprintf(logbuf, sizeof(logbuf), "LED switch '%s'@%s → async",
                   name.c_str(), source.c_str());
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── led_update: 切換節目 + 更新內文字（兩步驟）──
  # 參數: name (節目檔名), text (新文字內容), color (#RRGGBB), x, y, source (lan / internet)
  # 前提: 節目必須是「滾動文字 + 允許遠端更新」
  # 實作順序：
  #   Step 1: PUT /api/vsns/sources/{source}/vsns/{name}/activated  (切換到該節目)
  #   Step 2: PUT /api/program/{name}  (body: {"update":[{"who":{"x","y"},"text","textColor"}]})
  # 為什麼要先 switch 再 update：
  #   Colorlight 裝置必須先啟用節目才能修改其內容，若直接 update 會失敗
  # v3.16.60: 保留 CMD 用，不再被 wash_step 引用（只有手動 led_update CMD 會呼叫）
  - id: led_update
    parameters:
      name: string
      text: string
      color: string
      x: int
      y: int
      source: string
    mode: single
    then:
      # ── Step 1: Switch — 先切換到目標節目（非同步送出）──
      - lambda: |-
          std::string encoded;
          for (unsigned char c : name) {
            if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') ||
                (c >= '0' && c <= '9') || c == '-' || c == '_' ||
                c == '.' || c == '~') {
              encoded += c;
            } else {
              char buf[4];
              snprintf(buf, sizeof(buf), "%%%02X", c);
              encoded += buf;
            }
          }
          std::string src = source.empty() ? std::string("internet") : source;
          std::string url = "http://192.168.1.14/api/vsns/sources/" + src +
                            "/vsns/" + encoded + "/activated";
          // v4.0.22: 追蹤 API EVENT（Step 1/2 switch 階段）
          {
            std::string params = std::string("\"name\":\"") + name +
                                 "\",\"source\":\"" + src + "\",\"step\":\"switch\"";
            id(ws).send_api_event("led_update", params);
          }
          id(cl).put(url, "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz", "", "");
          char logbuf[80];
          snprintf(logbuf, sizeof(logbuf), "LED update[1/2] switch '%s'@%s → async",
                   name.c_str(), source.c_str());
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

      # ── 等裝置完成切換 ──
      - delay: 300ms

      # ── Step 2: Update — 更新節目內文字（非同步送出）──
      - lambda: |-
          std::string encoded;
          for (unsigned char c : name) {
            if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') ||
                (c >= '0' && c <= '9') || c == '-' || c == '_' ||
                c == '.' || c == '~') {
              encoded += c;
            } else {
              char buf[4];
              snprintf(buf, sizeof(buf), "%%%02X", c);
              encoded += buf;
            }
          }
          std::string url = "http://192.168.1.14/api/program/" + encoded;
          std::string escaped;
          for (unsigned char c : text) {
            if (c == '"') escaped += "\\\"";
            else if (c == '\\') escaped += "\\\\";
            else if (c < 0x20) {
              char buf[8];
              snprintf(buf, sizeof(buf), "\\u%04x", c);
              escaped += buf;
            } else escaped += c;
          }
          std::string col = color.empty() ? "#FFFFFF" : color;
          char b[400];
          snprintf(b, sizeof(b),
            "{\"update\":[{\"who\":{\"x\":%d,\"y\":%d},\"text\":\"%s\",\"textColor\":\"%s\"}]}",
            x, y, escaped.c_str(), col.c_str());
          // v4.0.22: 追蹤 API EVENT（Step 2/2 text 階段）
          {
            // 把原 text 直接放入 params（escape 過的版本）
            std::string params = std::string("\"name\":\"") + name +
                                 "\",\"text\":\"" + escaped +
                                 "\",\"color\":\"" + col +
                                 "\",\"step\":\"text\"";
            id(ws).send_api_event("led_update", params);
          }
          id(cl).put(url, "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz",
                     "application/json; charset=utf-8", std::string(b));
          // v4.0.108: logbuf 80→128 (vsn 名 ~50 byte + UTF-8 中文 text 容易 truncate 出 �)
          char logbuf[128];
          snprintf(logbuf, sizeof(logbuf), "LED update[2/2] text '%s' → async", name.c_str());
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── led_text: v4.0.116 純改文字（不切節目）— 1 個 PUT ──
  # 等同 led_update 的 Step 2，但**省略 Step 1 切節目**。
  # 用途：節目已經是當前播放中、要改不同位置的文字（例如 lock 上行/下行兩段文字）
  # 連送 led_update 會被 colorlight worker 1-slot queue 互蓋（v4.0.111 lock 流程踩過）→ 拆出此 script
  # API: PUT /api/program/{name}  (body: {"update":[{"who":{"x","y"},"text","textColor"}]})
  - id: led_text
    parameters:
      name: string
      text: string
      color: string
      x: int
      y: int
    mode: single
    then:
      - lambda: |-
          std::string encoded;
          for (unsigned char c : name) {
            if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') ||
                (c >= '0' && c <= '9') || c == '-' || c == '_' ||
                c == '.' || c == '~') {
              encoded += c;
            } else {
              char buf[4];
              snprintf(buf, sizeof(buf), "%%%02X", c);
              encoded += buf;
            }
          }
          std::string url = "http://192.168.1.14/api/program/" + encoded;
          std::string escaped;
          for (unsigned char c : text) {
            if (c == '"') escaped += "\\\"";
            else if (c == '\\') escaped += "\\\\";
            else if (c < 0x20) {
              char buf[8];
              snprintf(buf, sizeof(buf), "\\u%04x", c);
              escaped += buf;
            } else escaped += c;
          }
          std::string col = color.empty() ? std::string("#FFFFFF") : color;
          char b[400];
          snprintf(b, sizeof(b),
            "{\"update\":[{\"who\":{\"x\":%d,\"y\":%d},\"text\":\"%s\",\"textColor\":\"%s\"}]}",
            x, y, escaped.c_str(), col.c_str());
          {
            std::string params = std::string("\"name\":\"") + name +
                                 "\",\"text\":\"" + escaped +
                                 "\",\"color\":\"" + col + "\"";
            id(ws).send_api_event("led_text", params);
          }
          id(cl).put(url, "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz",
                     "application/json; charset=utf-8", std::string(b));
          char logbuf[128];
          snprintf(logbuf, sizeof(logbuf), "LED text '%s' (%d,%d) → async", name.c_str(), x, y);
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── led_brightness: 設定亮度 (0-255) ──
  # API: PUT /api/brightness (body: {"brightness":0-255})
  - id: led_brightness
    parameters:
      value: int
    mode: single
    then:
      - lambda: |-
          int v = value;
          if (v < 0) v = 0;
          if (v > 255) v = 255;
          char b[48];
          snprintf(b, sizeof(b), "{\"brightness\":%d}", v);
          // v4.0.22: 追蹤 API EVENT
          {
            char pbuf[32];
            snprintf(pbuf, sizeof(pbuf), "\"value\":%d", v);
            id(ws).send_api_event("led_brightness", std::string(pbuf));
          }
          id(cl).put("http://192.168.1.14/api/brightness",
                     "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz",
                     "application/json; charset=utf-8", std::string(b));
          char logbuf[64];
          snprintf(logbuf, sizeof(logbuf), "LED brightness=%d → async", v);
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── led_volume: 設定音量 (0-15) ──
  # ⚠️ 欄位名是 musicvolume 不是 volume（實測：volume 會被裝置 silently ignored）
  # API: PUT /api/volume (body: {"musicvolume":0-15})
  - id: led_volume
    parameters:
      value: int
    mode: single
    then:
      - lambda: |-
          int v = value;
          if (v < 0) v = 0;
          if (v > 15) v = 15;
          char b[48];
          snprintf(b, sizeof(b), "{\"musicvolume\":%d}", v);
          // v4.0.22: 追蹤 API EVENT
          {
            char pbuf[32];
            snprintf(pbuf, sizeof(pbuf), "\"value\":%d", v);
            id(ws).send_api_event("led_volume", std::string(pbuf));
          }
          id(cl).put("http://192.168.1.14/api/volume",
                     "Basic YWRtaW46SHVpZmxvd0BsZURAMTAzMzAz",
                     "application/json; charset=utf-8", std::string(b));
          char logbuf[64];
          snprintf(logbuf, sizeof(logbuf), "LED volume=%d → async", v);
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── led_dualcam: RPi 雙鏡頭 LED API (PUT + JSON body, 不等回應) ──
  # v4.0.111: 用戶設計
  #   curl 等效：
  #     curl -X PUT "http://192.168.1.10:8096/module_dualcam_LED/start" \
  #       -H "Content-Type: application/json" \
  #       -d '{"duration_seconds":"60","fps":"12","interval_ms":"80","layout":"thirds",
  #            "top_text":<order_name>,"bottom_text":<order_msg>,"qr_url":"https://odr.huiflow.com/<order_sn>"}'
  #   重用 cl 非阻塞 worker (latest-wins / cooldown / log 全繼承)
  #   wash_init lock 模式呼叫 + 對應 CMD led_dualcam 也可外部觸發
  - id: led_dualcam
    parameters:
      order_sn: string
      order_name: string
      order_msg: string
    mode: single
    then:
      - lambda: |-
          static const char *URL = "http://192.168.1.10:8096/module_dualcam_LED/start";
          // 組 JSON body — 中文 UTF-8 直接放，server 端解 JSON
          // 注意：order_sn / order_name / order_msg 不該含 " 或 \（caller 應確保）
          std::string body;
          body.reserve(384);
          body += "{\"duration_seconds\":\"60\",\"fps\":\"12\",\"interval_ms\":\"80\",\"layout\":\"thirds\"";
          body += ",\"top_text\":\"";    body += order_name; body += "\"";
          body += ",\"bottom_text\":\""; body += order_msg;  body += "\"";
          body += ",\"qr_url\":\"https://odr.huiflow.com/"; body += order_sn; body += "\"";
          body += "}";
          id(cl).put(std::string(URL), std::string(""), std::string("application/json"), body);
          char logbuf[128];
          snprintf(logbuf, sizeof(logbuf), "LED dualcam sn='%s' name='%s' → async",
                   order_sn.c_str(), order_name.c_str());
          ESP_LOGI("LED", "%s", logbuf);
          id(ws_log).publish_state(logbuf);

  # ── lock_led_sequence: v4.0.116 lock 模式完整 LED 序列（chain delay 避 race）──
  # 設計動機：v4.0.111 直接從 ws_client.cpp 連送 2 次 led_update + 1 次 led_dualcam，
  #   但 colorlight worker 是 1-slot latest-wins queue，每個 led_update = 2 PUT
  #   → 4 PUT 連送會互蓋（上行 program 被下行 switch 覆蓋）。
  # 解法：拆成 4 步 + delay：
  #   (1) led_switch     1 PUT — 純切節目
  #   (2) delay 400ms    — 等 Colorlight 切換完成
  #   (3) led_text 上行  1 PUT — order_name 藍字 (320, 0)
  #   (4) delay 250ms    — 等 worker 處理完
  #   (5) led_text 下行  1 PUT — order_msg  紅字 (320, 32)
  #   (6) delay 500ms    — 給 RPi 服務之前緩衝
  #   (7) led_dualcam    1 PUT — RPi 雙鏡頭 (192.168.1.10:8096，獨立服務不衝突)
  # 總時長 ~1.15s；mode: single → 1.15s 內重複觸發會被擋掉（避免重入 race）
  - id: lock_led_sequence
    parameters:
      vsn: string
      order_sn: string
      order_name: string
      order_msg: string
    mode: single
    then:
      # Step 1: 純切節目
      - script.execute:
          id: led_switch
          name: !lambda 'return vsn;'
          source: "internet"
      - delay: 400ms

      # Step 2: 上行 order_name 藍字 (320, 0)
      - script.execute:
          id: led_text
          name: !lambda 'return vsn;'
          text: !lambda 'return order_name;'
          color: "#0000FF"
          x: 320
          y: 0
      - delay: 250ms

      # Step 3: 下行 order_msg 紅字 (320, 32)
      - script.execute:
          id: led_text
          name: !lambda 'return vsn;'
          text: !lambda 'return order_msg;'
          color: "#FF0000"
          x: 320
          y: 32
      - delay: 500ms

      # Step 4: RPi 雙鏡頭（獨立服務 192.168.1.10:8096）
      - script.execute:
          id: led_dualcam
          order_sn: !lambda 'return order_sn;'
          order_name: !lambda 'return order_name;'
          order_msg: !lambda 'return order_msg;'

  # ── washer_send_cmd: 非阻塞發送 UART2 洗車機指令 ──
  # 由 C++ handle_cmd（WS CMD）和 HMI 觸控按鈕觸發
  # 參數: cmd_num(1~10), source(來源標記: WS/HMI/OFFLINE/GO/EMG/AUTO_OFFLINE/AUTO_ONLINE), cmd_name
  # 7-byte frame 格式: FD 03 C7 50 {CMD} {CHK} DF
  # 非阻塞：使用 ESPHome delay: action（不佔 loop），連送 5 次，間隔 100ms
  # v3.16.50: mode single → queued：auto-continue 與 EMG 循環同時期間可能 race，
  #           原 single 模式會讓後呼叫靜默失敗（延遲看起來很嚴重），queued 確保每次
  #           execute() 都依序執行（~400ms/次），下一次 gowasher 最多延遲一輪 UART2 時間
  - id: washer_send_cmd
    parameters:
      cmd_num: int
      source: std::string
      cmd_name: std::string
    mode: queued
    max_runs: 4
    then:
      - lambda: |-
          // 從 C++ 靜態表取得 frame 指標，避免重複定義
          const unsigned char *frame = id(ws).get_washer_frame(cmd_num);
          if (!frame) { ESP_LOGW("washer", "invalid cmd_num=%d", cmd_num); return; }
          // 第 1 次發送（立即）
          uart_write_bytes((uart_port_t)2, frame, 7);
          char buf[64];
          snprintf(buf, sizeof(buf), "TX> %02X %02X %02X %02X %02X %02X %02X [%s %s x1]",
                   frame[0], frame[1], frame[2], frame[3], frame[4], frame[5], frame[6],
                   source.c_str(), cmd_name.c_str());
          id(uart2_monitor).publish_state(std::string(buf));
      - delay: 100ms
      - lambda: |-
          const unsigned char *frame = id(ws).get_washer_frame(cmd_num);
          if (frame) { uart_write_bytes((uart_port_t)2, frame, 7); }
      - delay: 100ms
      - lambda: |-
          const unsigned char *frame = id(ws).get_washer_frame(cmd_num);
          if (frame) { uart_write_bytes((uart_port_t)2, frame, 7); }
      - delay: 100ms
      - lambda: |-
          const unsigned char *frame = id(ws).get_washer_frame(cmd_num);
          if (frame) { uart_write_bytes((uart_port_t)2, frame, 7); }
      - delay: 100ms
      - lambda: |-
          const unsigned char *frame = id(ws).get_washer_frame(cmd_num);
          if (frame) {
            uart_write_bytes((uart_port_t)2, frame, 7);
            char buf[64];
            snprintf(buf, sizeof(buf), "TX> %02X %02X %02X %02X %02X %02X %02X [%s %s x5 done]",
                     frame[0], frame[1], frame[2], frame[3], frame[4], frame[5], frame[6],
                     source.c_str(), cmd_name.c_str());
            id(uart2_monitor).publish_state(std::string(buf));
          }

  - id: hmi_show_relay_icon
    parameters:
      pos_x: int
      pos_y: int
      icon: int
    mode: single
    then:
      - lambda: |-
          // v3.16.1: Page 1（密碼頁）時不推送圖標，避免覆蓋密碼頁面
          if (id(ws).hmi_current_page_ != 0) return;
          unsigned char buf[14] = {0xaa, 0x97, 0,0, 0,0, 0x3a, 0x01, 0,0, 0xcc, 0x33, 0xc3, 0x3c};
          buf[2] = pos_x >> 8; buf[3] = pos_x & 0xff;
          buf[4] = pos_y >> 8; buf[5] = pos_y & 0xff;
          buf[8] = icon >> 8;  buf[9] = icon & 0xff;
          uart_write_bytes((uart_port_t)0, buf, 14);

  - id: hmi_show_page
    parameters:
      page: int
    mode: single
    then:
      - lambda: |-
          // v3.16.13: AA 52 (清除文字層) + AA 70 (切頁+載入底圖) + 長延遲 (等 DWIN 渲染完)
          //   AA 52 只清除 text/icon 繪製層，不會影響 Page 內建底圖
          //   AA 70 XX 載入 Page XX 底圖到底層
          //   DWIN DGUS 切頁需要時間渲染（約 200-300ms），延遲太短會讓後續繪製失敗
          // 1) 清除文字/圖示層（避免前一頁的文字殘留覆蓋新底圖）
          unsigned char clear_cmd[6] = {0xaa, 0x52, 0xcc, 0x33, 0xc3, 0x3c};
          uart_write_bytes((uart_port_t)0, clear_cmd, 6);
          delay(20);
          // 2) 切換頁面（DWIN 自動載入此 Page 的內建底圖）
          unsigned char buf[7] = {0xaa, 0x70, 0x00, 0xcc, 0x33, 0xc3, 0x3c};
          buf[2] = page & 0xff;
          uart_write_bytes((uart_port_t)0, buf, 7);
          id(ws).hmi_current_page_ = page;
          ESP_LOGI("HMI", "page switch → %d (AA 52 clear + AA 70 reload bg)", page);

          // 切到工程頁（Page 0）時，等底圖載入完再重繪動態元素
          if (page == 0) {
            delay(300);  // v3.16.13: 200→300ms，確保 DWIN 完整渲染 Page 0 底圖

            // === 1. 右上角 3 個功能圖標 ===
            // (960, 0)   返回鍵 0x3c
            // (960, 83)  Web 狀態 0x3d(off) / 0x3e(on)
            // (960, 169) OTA 0x3f
            id(hmi_show_relay_icon).execute(960, 0, 0x3c);
            id(hmi_show_relay_icon).execute(960, 83, id(web_server_switch).state ? 0x3e : 0x3d);
            id(hmi_show_relay_icon).execute(960, 169, 0x3f);

            // === 2. 16 個繼電器圖標 (Y=541, X=i*64) 讀取實際狀態 ===
            static switch_::Switch* relays16[16] = {
              id(relay_01), id(relay_02), id(relay_03), id(relay_04),
              id(relay_05), id(relay_06), id(relay_07), id(relay_08),
              id(relay_09), id(relay_10), id(relay_11), id(relay_12),
              id(relay_13), id(relay_14), id(relay_15), id(relay_16)
            };
            for (int i = 0; i < 16; i++) {
              uint8_t icon = relays16[i]->state ? (i + 0x11) : (i + 0x01);
              id(hmi_show_relay_icon).execute(i * 64, 541, icon);
            }

            // === 3. SSR 圖標區塊已於 v3.16.77 移除（SSR 1-4 硬體層拔掉）===

            // === 4. M1/M2 洗車機圖標 (Y=375, 位於 M3 左側) ===
            id(hmi_show_relay_icon).execute(512 - 2 * 0x40, 375, 0x40);  // M1
            id(hmi_show_relay_icon).execute(512 - 1 * 0x40, 375, 0x41);  // M2

            // === 5. M3~M10 洗車機快捷指令圖標 (Y=375, X=512+i*0x40) ===
            for (int i = 0; i < 8; i++) {
              id(hmi_show_relay_icon).execute(512 + i * 0x40, 375, 0x29 + i);
            }

            // === 6. 3 個功能按鈕圖標 (Y=458) ===
            id(hmi_show_relay_icon).execute(512 + 1 * 0x40, 458, 0x42);
            id(hmi_show_relay_icon).execute(512 + 2 * 0x40, 458, 0x43);
            id(hmi_show_relay_icon).execute(512 + 3 * 0x40, 458, 0x44);

            // === 7. 參數名（左側 14 個標籤）===
            delay(5);
            id(hmi_show_param_name).execute();

            // === 8. Header：序號 + 版本 + 可用記憶體 (220, 0) ===
            char boot_buf[96];
            const char *sid = id(my_global_id).c_str();
            if (sid[0] != '\0') {
              snprintf(boot_buf, sizeof(boot_buf), "%s ${VER_PREFIX}${DEV_FIRMWARE_VER}(--C --%% %uKB)",
                sid, esp_get_free_heap_size() / 1024);
            } else {
              snprintf(boot_buf, sizeof(boot_buf), "${VER_PREFIX}${DEV_FIRMWARE_VER}(--C --%% %uKB)",
                esp_get_free_heap_size() / 1024);
            }
            id(hmi_show_param_value).execute(220, 0, std::string(boot_buf));

            // === 9. 14 個 IO 狀態文字值（讀取當前感測器狀態）===
            id(hmi_show_param_value).execute(220, 32,  id(ac_power_lose).state         ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 64,  id(leak_det).state               ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 96,  id(water_level_1).state          ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 128, id(water_level_2).state          ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 160, id(emgr_input).state             ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 192, id(start_stop_input).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 224, id(car_height_input).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 256, id(check_door_input).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 288, id(washer_led_blue).state        ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 320, id(washer_led_green).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 352, id(washer_led_red).state         ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 384, id(check_bubble_input_1).state   ? " ON" : "OFF");
            // v3.16.77: bubble_2/3/4 存量輸入已移除
            // v3.16.76: bb4 列改走 hmi_refresh_bb4_line helper
            id(hmi_refresh_bb4_line).execute();

            // === 10. 右側 10 個數值欄位（X=732=220+512，Y=0~288）===
            //     v3.16.10: 補完右側數值區重繪，用各 sensor 的 .state 緩存值
            //     [Y=0 運行時間 / Y=32 用水量 / Y=64 入水 / Y=96 出水 /
            //      Y=128 總電流 / Y=160 水泵電流 / Y=192 氣泵電流 /
            //      Y=224 水壓 / Y=256 風扇速度 / Y=288 HMI事件(v4.0.66)]
            delay(5);
            char vbuf[24];

            // Y=0: 運行時間（複製自 2s interval 格式）
            {
              unsigned long secs = (unsigned long)id(system_uptime).state;
              unsigned long days = secs / 86400;
              unsigned long hours = (secs % 86400) / 3600;
              unsigned long minutes = (secs % 3600) / 60;
              unsigned long seconds = secs % 60;
              std::string result;
              if (days > 0) result = to_string(days) + "d " + to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
              else if (hours > 0) result = to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
              else if (minutes > 0) result = to_string(minutes) + "m" + to_string(seconds) + "s";
              else result = to_string(seconds) + "s";
              if (result.length() < 12) result.insert(0, 12 - result.length(), ' ');
              id(hmi_show_param_value).execute(732, 0, result);
            }

            // Y=32: 總用水量 (L)
            {
              float v = id(total_flow).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.2f L     ", v);
              id(hmi_show_param_value).execute(732, 32, std::string(vbuf));
            }
            // Y=64: 入水流量 (L/min) — sensor state 已是原始 centi (未轉換)
            {
              float v = id(water_flow_1).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.2f L/min     ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 64, std::string(vbuf));
            }
            // Y=96: 出水流量 (L/min)
            {
              float v = id(water_flow_2).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.2f L/min     ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 96, std::string(vbuf));
            }
            // v4.0.85: 電流 4 row + 水壓/風扇/HMI 事件下推 32px
            // Y=128: 總電源 (A) — id=current_total
            {
              float v = id(current_total).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.1f A      ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 128, std::string(vbuf));
            }
            // Y=160: 洗車機 (A) — id=current_washer (was current_pump)
            {
              float v = id(current_washer).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.1f A      ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 160, std::string(vbuf));
            }
            // Y=192: 加壓馬達 (A) — id=current_pump (was current_air，重用 ID)
            {
              float v = id(current_pump).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.1f A      ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 192, std::string(vbuf));
            }
            // Y=224: 外部設備 (A) — id=current_allExt (新增 HMI 顯示)
            {
              float v = id(current_allExt).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.1f A      ", v / 100.0f);
              id(hmi_show_param_value).execute(732, 224, std::string(vbuf));
            }
            // Y=256: 水壓 (mPa) (v4.0.85 從 Y=224 下推)
            {
              float v = id(water_pressure).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%d mPa    ", (int)v);
              id(hmi_show_param_value).execute(732, 256, std::string(vbuf));
            }
            // Y=288: 風扇速度 (RPM) (v4.0.85 從 Y=256 下推)
            {
              float v = id(fan_tachometer).state;
              if (isnan(v)) snprintf(vbuf, sizeof(vbuf), "      --    ");
              else snprintf(vbuf, sizeof(vbuf), "%.1f RPM    ", v);
              id(hmi_show_param_value).execute(732, 288, std::string(vbuf));
            }
            // Y=320: HMI 最新事件 / CMD 參數（latest-wins）(v4.0.85 從 Y=288 下推)
            {
              const std::string &s = id(hmi_last_event_line);
              if (s.empty()) id(hmi_show_param_value).execute(732, 320, "      --    ");
              else id(hmi_show_param_value).execute(732, 320, s);
            }
            // v4.0.86: Y=352 LED 狀態 (Colorlight enabled / cooldown remaining)
            {
              const std::string &s = id(cl_led_status).state;
              if (s.empty()) id(hmi_show_param_value).execute(732, 352, "    --    ");
              else id(hmi_show_param_value).execute(732, 352, s);
            }
          }

  - id: hmi_show_clear_all
    mode: single
    then:
      - lambda: |-
          unsigned char buf[6] = {0xaa, 0x52, 0xcc, 0x33, 0xc3, 0x3c};
          uart_write_bytes((uart_port_t)0, buf, 6);

  # v4.0.36: HMI 密碼輸入頁 — 畫單一數字（AA 98 frame，大字型 / 白色 / 無底色）
  #   pos_x / pos_y = 左上角座標；value = '0'~'9' 字元
  #   字型 0x00（DWIN 預設大字庫）/ 大小 0x10 0x00（64 dots）/ 白色 0xff 0xff
  - id: hmi_show_pass_code
    parameters:
      pos_x: int
      pos_y: int
      value: int
    mode: single
    then:
      - lambda: |-
          unsigned char buf[18] = {0xaa, 0x98, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03,
                                   0x07, 0xF8, 0x00, 0xff, 0xff, '0',
                                   0xcc, 0x33, 0xc3, 0x3c};
          buf[2] = pos_x >> 8; buf[3] = pos_x & 0xff;
          buf[4] = pos_y >> 8; buf[5] = pos_y & 0xff;
          if (value < '0' || value > '9') return;
          buf[13] = (unsigned char)value;
          uart_write_bytes((uart_port_t)0, buf, sizeof(buf));

  # v4.0.40: HMI 密碼輸入頁清除 — 恢復 AA 71 矩形填色（v4.0.39 用 AA 52 誤清整個 OSD 層）
  - id: hmi_clear_pass_code
    mode: single
    then:
      - lambda: |-
          unsigned char buf[19] = {0xAA, 0x71, 0x01, 0x00, 0x44, 0x00, 0xA9,
                                   0x02, 0x06, 0x00, 0xFC,
                                   0x00, 0x44, 0x00, 0xA9,
                                   0xCC, 0x33, 0xC3, 0x3C};
          uart_write_bytes((uart_port_t)0, buf, sizeof(buf));

  - id: hmi_show_param_value
    parameters:
      pos_x: int
      pos_y: int
      value: string
    mode: single
    then:
      - lambda: |-
          // v3.16.1: Page 1（密碼頁）時不推送監控數據，避免 DWIN 文字覆蓋密碼頁面
          if (id(ws).hmi_current_page_ != 0) return;
          unsigned char head[6] = {0xaa, 0x55, 0,0, 0,0};
          unsigned char tail[4] = {0xcc, 0x33, 0xc3, 0x3c};
          head[2] = pos_x >> 8; head[3] = pos_x & 0xff;
          head[4] = pos_y >> 8; head[5] = pos_y & 0xff;
          uart_write_bytes((uart_port_t)0, head, 6);
          uart_write_bytes((uart_port_t)0, value.c_str(), value.length());
          uart_write_bytes((uart_port_t)0, tail, 4);


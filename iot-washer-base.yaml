# HuiFlow 洗車機主板 - 完整固件
# ESP32-S3 + W5500 Ethernet + Modbus RTU + HMI + 16ch Relay + Web Dashboard
# 基於 iot-washer-aws-iot.yaml 恢復（ws_client 暫停：導致 boot loop）

external_components:
  - source: my_components
    components: [i2c_eeprom, ws_client, ota_update, colorlight, ble_adv]

substitutions:
  DEV_FIRMWARE_VER: "4.0.324"
  # 雙硬件分支標識：A 硬件為 ""，W 硬件(iot-washer-w-base.yaml)為 "W"
  #   VER_PREFIX：硬件版本前綴（A="V" → V4.0.x / W="W" → W4.0.x）
  #     顯示 + STATUS firmware 一律 ${VER_PREFIX}${DEV_FIRMWARE_VER} → 一眼分辨 V/W 硬件
  #   HW_TAG：保留給 factory bin 命名參考（A="" / W="W"）；set_firmware_version 改用 VER_PREFIX
  #   顯示/版本代碼兩份 YAML 字節級相同，差異只在此變數值 + 硬件配置層
  HW_TAG: ""
  VER_PREFIX: "V"
  MAX_UART_RECV_BUF_LEN: "254"
  MAX_UART_SEND_BUF_LEN: "254"
  # v4.0.287 [BLE-ADV-SIGNED]: BLE adv 自簽編號 HMAC key（per-store 寫死）
  #   子板 firmware 必須用同一字串當 HMAC key；#5 pairing 之後改自動派
  #   ⚠️ production 每店改成不同值（與 cloud PERI_PSK 不同 trust domain）
  ble_psk: "hf_ble_dev_psk_change_per_store"
  DEV_ID_LENGTH: "4"
  USER_CODE_LENGTH: "4"
  ws_api_key: "huiflow103303Ty"
  ws_lan_server: "192.168.1.10"   # v4.0.237: 預設 prod (RPi)；dev 用 CMD ws2_server 切 .99，重啟還原
  ws_lan_port: "8090"

esphome:
  name: iot-washer
  friendly_name: iot-washer
  # includes:
  #   - esphome_client.h
  # libraries:
  #   - "bblanchon/ArduinoJson@^6.21.3"
  # v4.0.00: 切換至 esp-idf framework（見下方 esp32: 區塊），
  #   Arduino 專屬 USB CDC build flags 不再需要（esp-idf 原生 USB_SERIAL_JTAG logger）。
  #   Main task stack 透過 sdkconfig_options 調大到 16384，解決 PC=0 crash。
  on_boot:
    priority: 200
    then:
      # v3.16.77: SSR 1-4 硬體層完全移除（V1/V2 統一），原開機 turn_on 4 路已拔掉
      - lambda: |-
          // 將 YAML 的 DEV_FIRMWARE_VER 注入 ws_client，供 STATUS.data.esp32.firmware 使用
          id(ws).set_firmware_version("${VER_PREFIX}${DEV_FIRMWARE_VER}");
          // 注入 washer_send_cmd script 指標，供 C++ handle_cmd 非阻塞發送 UART2 洗車機指令
          id(ws).set_washer_script(id(washer_send_cmd));
          // v3.16.13: 注入 hmi_show_page script 指標，供 C++ hmi_auth_result/on_hmi_password_submit 觸發完整重繪
          id(ws).set_hmi_show_page_script(id(hmi_show_page));
          // v3.16.59: 注入 led_switch script 指標，供 C++ offline_led_trigger 本地切換 LED 節目（無字幕更新）
          id(ws).set_led_switch_script(id(led_switch));
          // v4.0.85: 注入 current_total sensor，供 EMG 觸發時電流確認用
          id(ws).set_current_total_sensor(id(current_total));
          // v4.0.02: 注入其餘 3 個 LED script，dispatch_cmd_doc 直接派送 WS CMD，
          //   不再依賴 led_cmd text_sensor on_value 中間層（ESP-IDF 下該路徑有時序問題）
          id(ws).set_led_update_script(id(led_update));
          id(ws).set_led_brightness_script(id(led_brightness));
          id(ws).set_led_volume_script(id(led_volume));
          // v4.0.111: led_dualcam (RPi 雙鏡頭 LED API)
          id(ws).set_led_dualcam_script(id(led_dualcam));
          // v4.0.116: lock_led_sequence (chain delay 避 colorlight worker queue race)
          id(ws).set_lock_led_sequence_script(id(lock_led_sequence));
          // v4.0.25: 註冊 colorlight log callback → Dashboard ws_log，
          //   診斷 step 1→2 LED 切換失敗：能看到 connect fail / send fail / PUT OK + 耗時
          esphome::colorlight::ColorlightClient::set_log_callback([](const char *m){
            id(ws_log).publish_state(std::string("[CL] ") + m);
          });
          // v4.0.229: 註冊 colorlight EVENT callback → 邊緣觸發 cl_put_result fire 給 server
          //   colorlight worker task 在 do_put 失敗 / kill_switch off / cooldown 時推 queue
          //   main loop drain 後呼叫此 callback → send_event_raw_public 安全送出
          esphome::colorlight::ColorlightClient::set_event_callback([](const char *json, size_t len){
            id(ws).send_event_raw_public(json, len);
          });
          // v4.0.283 [BLE-ADV-HOOK]: 把主板 SN 塞進 BLE Manufacturer Specific Data
          //   開機時 my_global_id 可能尚未從 EEPROM 讀完，給空 SN 不影響運作
          //   後續 set_device_serial CMD 也會更新（v4.0.262）
          {
            const char *sid = id(my_global_id).c_str();
            id(ble_bcast).set_device_serial(sid[0] ? sid : "0000");
            // v4.0.287 [BLE-ADV-SIGNED]: 注入 per-store PSK（HMAC key）
            id(ble_bcast).set_psk("${ble_psk}");
          }
          // CPU usage: increment idle counter every loop iteration (see interval: 1s)
          // Uses simpler approach - idle hook requires esp_freertos_hooks.h which may not link
          ESP_LOGI("INIT", "HuiFlow Mainboard ${VER_PREFIX}${DEV_FIRMWARE_VER} booted");
          // v4.0.32: 初始化密碼緩衝區為全空白
          for (int i = 0; i < ${USER_CODE_LENGTH}; i++) {
            id(hmi_pwd_buf)[i] = ' ';
          }
          id(hmi_show_clear_all).execute();
          delay(5);
          // v3.16.0: 開機到登錄頁（Page 1），用戶需輸入密碼驗證後才切到工程頁（Page 0）
          id(hmi_show_page).execute(1);
          delay(5);
          // v3.16.76: 移除 20 個 relay 強制 turn_off
          //   理由：(1) NVS wash state 恢復 (v3.16.73) 會接管真正需要的初始狀態
          //         (2) 強制全關會觸發每個 relay 的 on_turn_off → HMI icon 刷新，開機時序不穩
          //         (3) 用戶要求保留斷電前狀態
          // v3.16.2: on_boot 開機到 Page 1（密碼頁），以下 Page 0 元素不需繪製
          // 切到 Page 0 時由 hmi_show_page script 重新繪製
          if (id(ws).hmi_current_page_ == 0) {
            for (int i = 0; i < 8; i++) {
              id(hmi_show_relay_icon).execute(512 + i * 0x40, 375, 0x29 + i);
            }
            id(hmi_show_param_name).execute();
            char boot_buf[80];
            const char *sid = id(my_global_id).c_str();
            if (sid[0] != '\0') {
              snprintf(boot_buf, sizeof(boot_buf), "%s ${VER_PREFIX}${DEV_FIRMWARE_VER}(--C --%% %uKB)",
                sid, esp_get_free_heap_size() / 1024);
            } else {
              snprintf(boot_buf, sizeof(boot_buf), "${VER_PREFIX}${DEV_FIRMWARE_VER}(--C --%% %uKB)",
                esp_get_free_heap_size() / 1024);
            }
            id(hmi_show_param_value).execute(220, 0, std::string(boot_buf));
            id(hmi_show_param_value).execute(220, 32, id(ac_power_lose).state ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 160, id(emgr_input).state ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 192, id(start_stop_input).state ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 224, " --");
          }
          // v3.16.59: 移除 status_light_1/2 狀態燈（調整亮度導致主板重啟）
          // Web server 預設關閉（RESTORE_DEFAULT_OFF）— 有需要時透過：
          //   (1) BOOT 按鈕短按 (<1s) 切換 on/off
          //   (2) WS CMD {"cmd":"web_server","on":1}
          // 不在 on_boot 自動啟動，避免 begin/end 循環導致 SSE race crash
          ESP_LOGI("INIT", "Web server OFF at boot (RESTORE_DEFAULT_OFF)");

          // Note: /api/cmd raw httpd handler removed — ESPHome wildcard POST handler
          // intercepts all POST requests. Dashboard uses text entity + button instead.
          // WS server path has no 255 limit (frame buffer 2048 bytes).


  on_loop:
    then:
      - lambda: |-
          uint32_t now_us = micros();
          if (id(loop_last_micros) > 0) {
            uint32_t delta = now_us - id(loop_last_micros);
            id(loop_time_us) = delta;
            if (delta > id(loop_time_max_us)) {
              id(loop_time_max_us) = delta;
            }
            // v3.16.69: Loop spike detector
            //   > 80ms 算異常 spike（正常 loop < 10ms，Modbus poll 偶爾 50-60ms 是合理）
            //   把 spike 大小 + 前一個 event 寫進 breadcrumb_last_event (RAM)
            //   下次 EEPROM 3s snapshot 會把它寫到 flash
            //   只在遇到**更大**的 spike 時才覆寫，避免一堆小 spike 把 peak 沖掉
            //   格式: "SPIKE:144807us@HMI_BTN:0x30" (32 bytes null-term)
            if (delta > 80000 && delta > id(spike_peak_us)) {
              id(spike_peak_us) = delta;
              char prev[17];
              memcpy(prev, id(breadcrumb_last_event), 16); prev[16] = '\0';
              if (strncmp(prev, "SPIKE:", 6) != 0) {
                // 前一 event 不是 SPIKE → 保留 context
                snprintf(id(breadcrumb_last_event), 32, "SPIKE:%uus@%s", delta, prev);
              } else {
                // 前一 event 已經是 SPIKE → 只更新 peak，丟掉 @之後
                snprintf(id(breadcrumb_last_event), 32, "SPIKE:%uus", delta);
              }
            }
          }
          id(loop_last_micros) = now_us;
          id(cpu_idle_cnt)++;  // loop iteration counter for CPU usage calc
      - script.execute: uart_proc_hex

esp32:
  board: esp32-s3-devkitc-1
  # v4.0.00: 改用 esp-idf framework
  #   - 可透過 sdkconfig_options 調整 FreeRTOS 參數（Arduino 在 sdkconfig 預定義無法 override）
  #   - 解決 PC=0 crash 主因：main task stack 8KB 在 mbedtls ssl_write + cJSON 深呼叫時爆堆疊
  #   - LED 驅動改用 esp32_rmt_led_strip（neopixelbus 依賴 Arduino framework）
  framework:
    type: esp-idf
    sdkconfig_options:
      # 主 task stack 從 3584（esp-idf 預設）加大到 16384，消化 TLS + JSON 深呼叫
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      # v4.0.283 [BLE-ADV-HOOK]: enable BT + NimBLE host stack for ble_adv component
      #   adv-only mode（不開 GATT server）→ Tier 2 子板用 BLE scan callback 被動接 cmd
      #   不影響既有 W5500 ethernet（BT 與 ethernet 走獨立 radio / SPI）
      CONFIG_BT_ENABLED: y
      CONFIG_BT_NIMBLE_ENABLED: y
      CONFIG_BT_NIMBLE_ROLE_BROADCASTER: y      # adv-only role
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL: n
      CONFIG_BT_NIMBLE_ROLE_CENTRAL: n
      CONFIG_BT_NIMBLE_ROLE_OBSERVER: n
      CONFIG_BT_NIMBLE_EXT_ADV: y                # v4.0.287 啟用 BLE 5.0 Extended Adv（大 payload + 自簽編號）

preferences:
  flash_write_interval: 60s

# flash_size: 16MB removed — it caused ESPHome to detect variant as ESP32-S3R8
# (Octal PSRAM) which locks GPIO35-37. Without it, GPIO35 is usable.
# PSRAM disabled - PSRAM ID read error: 0x00ffffff causes abort() boot loop

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 16MHz
  manual_ip:
    static_ip: 192.168.1.18
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 1.1.1.1

ota:
  - platform: esphome
    password: ""

safe_mode:
  disabled: true

web_server:
  port: 80
  version: 2
  log: false  # v4.0.232: 關 SSE log streaming (35 條/秒 → 0)，保留 ws_log + serial debug
  js_include: "web/custom_dashboard.js"
  css_include: "web/custom_dashboard.css"

# Colorlight 客戶端（v3.16.57 取代 http_request 同步阻塞呼叫）
# 每次 put() 呼叫開獨立 FreeRTOS task，主 loop 不受影響
# 不讀 response（fire-and-forget），最多同時 2 個 task
colorlight:
  id: cl

# v4.0.283 [BLE-ADV-HOOK]: 主板 → Tier 2 子板的 BLE 廣播通道
#   ws_client.cpp send_event_raw() 內 hook 自動推 wash_stage / emg / wash_init / wash_complete
#   純 NimBLE adv-only mode（不開 GATT），publish_cmd() 純 syscall < 100µs 不卡 main loop
#   Manufacturer Specific Data company_id=0xFF01，主板 SN 4B + cmd_id + args
#   子板用 BLE scan callback 解析 manufacturer data → 校驗 paired_sn → 動作（無 ACK）
ble_adv:
  id: ble_bcast

# Cloud OTA Update (checks GitHub on boot for new firmware)
ota_update:
  id: cloud_ota
  # v3.16.51: 回滾到 raw.githubusercontent.com — jsDelivr CDN 在 ESP32 mbedTLS 環境下
  #           TLS 握手不穩定，導致 v3.16.49/50 線上 OTA 完全無法運作
  manifest_url: "https://raw.githubusercontent.com/frankiehex/H_OTA/main/manifest.json"
  current_version: "${DEV_FIRMWARE_VER}"
  check_on_boot: false

# HuiFlow Cloud WebSocket (manual connect mode — use Dashboard button)
ws_client:
  id: ws
  server: "wss.huiflow.com"
  api_key: "${ws_api_key}"
  device_id: "iot-washer"
  use_ssl: true
  port: 443
  # Internal LAN WebSocket (RPi, auto-connect, no SSL)
  server2: "${ws_lan_server}"
  port2: "${ws_lan_port}"
  use_ssl2: false


time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Taipei"
    servers:
      - "time.google.com"
      - "time.cloudflare.com"
      - "pool.ntp.org"

i2c:
  id: iic_bus
  sda: GPIO41
  scl: GPIO42
  frequency: 200kHz
  scan: true

xl9535:
  - id: xl9535_hub
    address: 0x20

uart:
  - id: uart_debug
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
  - id: uart_1
    tx_pin: GPIO20
    rx_pin: GPIO19
    baud_rate: 9600
  - id: uart_2
    tx_pin: GPIO1
    rx_pin: GPIO2
    baud_rate: 9600

i2c_eeprom:
  - id: eeprom_1
    address: 0x50
    size: 32KB
    i2c_id: iic_bus
    on_setup:
      then:
        - lambda: |-
            uint8_t prev_state[11];
            int i;
            memset(prev_state, 0x00, sizeof(prev_state));
            if (!eeprom_1->get(0x0001, prev_state, 10)) {
              ESP_LOGE("eeprom", "Reading prev failed");
              return;
            }
            ESP_LOGD("eeprom", "Prev 0x%02X, 0x%02X", prev_state[0], prev_state[1]);
            for (i = 0; i < $DEV_ID_LENGTH; i++) {
              if ((prev_state[i] < '0') || (prev_state[i] > '9'))
                break;
            }
            if (i == $DEV_ID_LENGTH) {
              id(my_global_id).clear();
              // Only append valid digit characters (trim any trailing garbage)
              for (int j = 0; j < 10; j++) {
                if (prev_state[j] >= '0' && prev_state[j] <= '9')
                  id(my_global_id) += (char)prev_state[j];
                else
                  break;
              }
            }
            ESP_LOGI("main", "board id %s", id(my_global_id).c_str());
            // Update ws_client device_id to serial number
            if (!id(my_global_id).empty()) {
              id(ws).set_device_id(id(my_global_id));
              id(cloud_ota).set_device_id(id(my_global_id));
              ESP_LOGI("main", "device_id set to %s (ws + ota)", id(my_global_id).c_str());
            }

            // --- Reboot counter (EEPROM 0x0100, uint32_t LE) ---
            uint8_t cnt_buf[4] = {0};
            eeprom_1->get(0x0100, cnt_buf, 4);
            uint32_t reboot_cnt = cnt_buf[0] | (cnt_buf[1]<<8) | (cnt_buf[2]<<16) | (cnt_buf[3]<<24);
            // Sanity check: if 0xFFFFFFFF (blank EEPROM), treat as 0
            if (reboot_cnt == 0xFFFFFFFF) reboot_cnt = 0;
            reboot_cnt++;
            cnt_buf[0] = reboot_cnt & 0xFF;
            cnt_buf[1] = (reboot_cnt >> 8) & 0xFF;
            cnt_buf[2] = (reboot_cnt >> 16) & 0xFF;
            cnt_buf[3] = (reboot_cnt >> 24) & 0xFF;
            eeprom_1->set(0x0100, cnt_buf, 4);
            id(reboot_count_val) = (int32_t)reboot_cnt;
            ESP_LOGI("main", "Reboot count: %u", reboot_cnt);
            // v4.0.287 [BLE-ADV-SIGNED]: boot_id = reboot_count & 0xFFFF（跨重啟單調，子板擋重放）
            id(ble_bcast).set_boot_id((uint16_t)(reboot_cnt & 0xFFFF));

            // --- Reset reason ---
            const char *reason_str = "Unknown";
            switch (esp_reset_reason()) {
              case ESP_RST_POWERON:  reason_str = "Power-on"; break;
              case ESP_RST_SW:       reason_str = "Software"; break;
              case ESP_RST_PANIC:    reason_str = "Panic (crash)"; break;
              case ESP_RST_INT_WDT:  reason_str = "Interrupt WDT"; break;
              case ESP_RST_TASK_WDT: reason_str = "Task WDT"; break;
              case ESP_RST_WDT:      reason_str = "Other WDT"; break;
              case ESP_RST_DEEPSLEEP: reason_str = "Deep sleep"; break;
              case ESP_RST_BROWNOUT: reason_str = "Brownout"; break;
              case ESP_RST_SDIO:     reason_str = "SDIO"; break;
              default: break;
            }
            ESP_LOGI("main", "Reset reason: %s", reason_str);
            for (auto *ts : App.get_text_sensors()) {
              if (ts->get_name() == "Reset Reason") {
                ts->publish_state(reason_str);
                break;
              }
            }

            // --- Crash PC (read from RTC register, valid after panic/WDT reset) ---
            {
              // RTC_CNTL_STORE6_REG = 0x60008000 + 0x0130 on ESP32-S3
              volatile uint32_t *rtc_store6 = (volatile uint32_t *)0x60008130;
              uint32_t saved_pc = *rtc_store6;
              char pc_buf[64];
              esp_reset_reason_t rst = esp_reset_reason();
              if (rst == ESP_RST_PANIC || rst == ESP_RST_INT_WDT ||
                  rst == ESP_RST_TASK_WDT || rst == ESP_RST_WDT) {
                snprintf(pc_buf, sizeof(pc_buf), "0x%08X (%s)", saved_pc, reason_str);
              } else {
                snprintf(pc_buf, sizeof(pc_buf), "N/A (%s)", reason_str);
              }
              ESP_LOGI("main", "Saved PC: %s", pc_buf);
              for (auto *ts : App.get_text_sensors()) {
                if (ts->get_name() == "Crash PC") {
                  ts->publish_state(pc_buf);
                  break;
                }
              }
            }

            // --- Last boot uptime (EEPROM 0x0104, uint32_t LE, seconds) ---
            uint8_t up_buf[4] = {0};
            eeprom_1->get(0x0104, up_buf, 4);
            uint32_t last_up = up_buf[0] | (up_buf[1]<<8) | (up_buf[2]<<16) | (up_buf[3]<<24);
            if (last_up == 0xFFFFFFFF) last_up = 0;
            id(last_uptime_val) = (int32_t)last_up;
            ESP_LOGI("main", "Last boot uptime: %u s", last_up);

            // --- v3.16.68 Breadcrumb: read last crash context (EEPROM 0x0200, 64 bytes) ---
            // 布局: magic(4) up_s(4) loop_us(4) heap(4) min_heap(4) phase(1) stage(1)
            //       total(1) offline(1) hmi_page(1) rsv(3) event[32] rsv(4)
            // v4.0.16: 加入 EEPROM 讀取錯誤檢查（先前 I2C 失敗會靜默變 "no prior snapshot"）
            {
              uint8_t bc_buf[64] = {0};
              bool bc_ok = eeprom_1->get(0x0200, bc_buf, 64);
              if (!bc_ok) {
                ESP_LOGE("BREADCRUMB", "EEPROM read failed at 0x0200 (I2C error)");
                id(crash_context_str) = std::string("EEPROM read error");
              } else {
                uint32_t magic = bc_buf[0] | (bc_buf[1]<<8) | (bc_buf[2]<<16) | (bc_buf[3]<<24);
                if (magic == 0xDEADBEEF) {
                  uint32_t bc_up   = bc_buf[4]  | (bc_buf[5]<<8)  | (bc_buf[6]<<16)  | (bc_buf[7]<<24);
                  uint32_t bc_loop = bc_buf[8]  | (bc_buf[9]<<8)  | (bc_buf[10]<<16) | (bc_buf[11]<<24);
                  uint32_t bc_heap = bc_buf[12] | (bc_buf[13]<<8) | (bc_buf[14]<<16) | (bc_buf[15]<<24);
                  uint32_t bc_mheap= bc_buf[16] | (bc_buf[17]<<8) | (bc_buf[18]<<16) | (bc_buf[19]<<24);
                  uint8_t bc_phase = bc_buf[20];
                  uint8_t bc_stage = bc_buf[21];
                  uint8_t bc_total = bc_buf[22];
                  uint8_t bc_off   = bc_buf[23];
                  uint8_t bc_page  = bc_buf[24];
                  // v3.16.69: spike peak (offset 60-63)
                  uint32_t bc_spike= bc_buf[60] | (bc_buf[61]<<8) | (bc_buf[62]<<16) | (bc_buf[63]<<24);
                  // event 字串（null-term，最多 32 bytes）
                  char event[33] = {0};
                  memcpy(event, &bc_buf[28], 32);
                  event[32] = '\0';
                  char line[220];
                  snprintf(line, sizeof(line),
                    "last-crash: up=%us loop=%uus spike=%uus heap=%uB min=%uB phase=%u stage=%u/%u off=%u page=%u evt='%s'",
                    bc_up, bc_loop, bc_spike, bc_heap, bc_mheap,
                    bc_phase, bc_stage, bc_total, bc_off, bc_page, event);
                  ESP_LOGW("BREADCRUMB", "%s", line);
                  id(crash_context_str) = std::string(line);
                } else {
                  // v4.0.16: 區分「首次開機」vs「I2C 讀到全 0xFF」— 用 magic==0xFFFFFFFF 判斷
                  if (magic == 0xFFFFFFFF) {
                    ESP_LOGI("BREADCRUMB", "EEPROM blank (first boot after flash)");
                    id(crash_context_str) = std::string("first boot (EEPROM blank)");
                  } else {
                    ESP_LOGI("BREADCRUMB", "no valid snapshot (magic=0x%08X)", magic);
                    id(crash_context_str) = std::string("no prior snapshot");
                  }
                }
              }
              // 清空 RAM 的 last event 字串與全域 reboot tag（下次重啟重新填）
              memset(id(breadcrumb_last_event), 0, 32);
              memset(g_reboot_tag, 0, 32);
            }

modbus:
  - uart_id: uart_1
    id: modbus_1

modbus_controller:
  - id: modbus_device_shui_liu
    address: 1
    modbus_id: modbus_1
    setup_priority: -105
    update_interval: 120s

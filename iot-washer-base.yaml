          id(ws).send_event_raw_public(ev, strlen(ev));
    turn_off_action:
      - lambda: |-
          esphome::ble_adv::BleAdv::set_enabled(false);
          const char *ev = "{\"type\":\"EVENT\",\"event\":\"ble_adv_kill_change\",\"enabled\":false}";
          id(ws).send_event_raw_public(ev, strlen(ev));


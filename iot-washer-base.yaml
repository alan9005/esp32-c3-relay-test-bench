                    static const int br_table[] = {50, 100, 150, 200, 255};
                    static uint8_t br_idx = 0;
                    br_idx = (uint8_t)((br_idx + 1) % (sizeof(br_table) / sizeof(br_table[0])));
                    int v = br_table[br_idx];
                    char json[72];
                    snprintf(json, sizeof(json), "{\"type\":\"CMD\",\"cmd\":\"led_brightness\",\"value\":%d}", v);
                    id(ws).execute_cmd(std::string(json), "HMI");

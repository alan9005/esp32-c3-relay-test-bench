                  snprintf(id(breadcrumb_last_event), 32, "HMI_WASH:M%d", btn - 0x2C);
                  if (btn == 0x2D) {
                    id(washer_send_cmd).execute(1, std::string("HMI"), std::string("startwasher1"));
                    // v4.0.77: 用戶要求 0x2D / 0x2E 兩個 button 都顯示 "startwasher1"

                    id(hmi_last_btn) = _btn;
                    id(hmi_last_btn_at) = _now;
                  }
                }
                // v4.0.66: 預設 HMI 事件顯示欄（具體分支會 override 成更詳細字串）
                {
                  char line[32];
                  snprintf(line, sizeof(line), "HMI:0x%02X       ", (unsigned)aucTempBuf[3]);
                  id(hmi_last_event_line) = std::string(line);
                  id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                }
                if (aucTempBuf[3] > 0 && aucTempBuf[3] <= 16) {  // v3.16.77: SSR (0x11~0x14) 移除，上限 20→16
                  int idx = aucTempBuf[3] - 1;
                  // v3.16.68: Breadcrumb — 記錄 relay/SSR toggle
                  snprintf(id(breadcrumb_last_event), 32, "HMI_RELAY:%d", (int)aucTempBuf[3]);
                  if (all_relays[idx]->state) all_relays[idx]->turn_off();
                  else all_relays[idx]->turn_on();

                    id(hmi_last_event_line) = std::string("startwasher1    ");
                  }
                  id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                }
                else if (aucTempBuf[3] >= 0x29 && aucTempBuf[3] <= 0x31) {
                  uint8_t btn = aucTempBuf[3];
                  // v3.16.21: 推到 ws_log 方便 Dashboard 即時驗證實際收到的 byte
                  char dbg[48];
                  snprintf(dbg, sizeof(dbg), "[HMI] btn=0x%02X pressed", btn);
                  id(ws_log).publish_state(std::string(dbg));
                  // v3.16.68: Breadcrumb — 記錄最後 HMI 按鈕
                  snprintf(id(breadcrumb_last_event), 32, "HMI_BTN:0x%02X", btn);
                  ESP_LOGI("HMI", "function button 0x%02X pressed", btn);
                  if (btn == 0x29) {
                    // 預留：尚未實現具體功能，僅 log 不做動作
                    ESP_LOGI("HMI", "0x29 reserved button (no action)");
                  } else if (btn == 0x2A) {
                    // 切換洗車頁 → Page 1（登入/洗車頁）
                    id(ws).hmi_show_page_public(1);
                  } else if (btn == 0x2B) {
                    // v4.0.80: Web toggle 透過 execute_cmd 統一派送 + HMI event 顯示
                    bool new_state = !id(web_server_switch).state;
                    char json[64];
                    snprintf(json, sizeof(json), "{\"cmd\":\"web_server\",\"on\":%d}", new_state ? 1 : 0);
                    id(ws).execute_cmd(std::string(json), "HMI");
                    char evt[32];
                    snprintf(evt, sizeof(evt), "web_server=%d   ", new_state ? 1 : 0);
                    id(hmi_last_event_line) = std::string(evt);
                    id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                  } else if (btn == 0x2C) {
                    // v4.0.80: OTA check 透過 execute_cmd 統一派送 + HMI event 顯示
                    id(ws).execute_cmd(std::string("{\"cmd\":\"check_ota\"}"), "HMI");
                    id(hmi_last_event_line) = std::string("check_ota       ");
                    id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                  } else if (btn == 0x2F) {
                    // v3.16.22: 重新開機（500ms 延遲後 App.safe_reboot()）
                    // v4.0.16: 標記兇手 — 因 reboot CMD handler 會以 source-aware 寫 RTC tag (REBOOT_HMI)
                    // v4.0.80: 改走 execute_cmd CMD reboot 路徑，並先寫 HMI event 顯示
                    // v4.0.273 [HMI-2F-DEBOUNCE]: 3 秒 debounce 防用戶連按 / DWIN duplicate 觸發大量無謂 reboot
                    //   實測 SN=1223 一段時間累積 73 次 REBOOT_HMI（用戶按 0x2F 救卡死的 DNS-block）
                    //   3s 內第 2 次按下忽略，HMI 顯示 "reboot dbnc(Xs)" 提示用戶
                    static uint32_t last_2f_press_ms = 0;
                    uint32_t now_2f = millis();
                    if (last_2f_press_ms != 0 && (now_2f - last_2f_press_ms) < 3000) {
                      char buf2f[32];
                      uint32_t remain = (3000 - (now_2f - last_2f_press_ms)) / 1000 + 1;
                      snprintf(buf2f, sizeof(buf2f), "reboot dbnc(%us)   ", (unsigned)remain);
                      id(hmi_last_event_line) = std::string(buf2f);
                      id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                      ESP_LOGW("HMI", "[HMI-2F-DEBOUNCE] reboot 0x2F ignored (last press %ums ago, need 3000ms gap)",
                               (unsigned)(now_2f - last_2f_press_ms));
                    } else {
                      last_2f_press_ms = now_2f;
                      id(hmi_last_event_line) = std::string("reboot          ");
                      id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                      id(ws).execute_cmd(std::string("{\"cmd\":\"reboot\"}"), "HMI");
                    }
                  } else if (btn == 0x30) {
                    // v4.0.106: LED+攝影機 → RPi API (PUT + JSON body, 不等回應)
                    //   curl 等效：
                    //     curl -X PUT "http://192.168.1.10:8096/module_dualcam_LED/start" \
                    //       -H "Content-Type: application/json" \
                    //       -d '{"duration_seconds":"60",...}'
                    //   重用 cl 非阻塞 worker (latest-wins / cooldown / log 全繼承)
                    //   中文 UTF-8 直接放 JSON body，server 端解 JSON 處理
                    static const char *URL = "http://192.168.1.10:8096/module_dualcam_LED/start";
                    static const char *BODY = "{\"duration_seconds\":\"60\",\"fps\":\"12\",\"interval_ms\":\"80\",\"layout\":\"thirds\",\"top_text\":\"慧流測試\",\"bottom_text\":\"趕緊掃碼 加入AI洗車事業\",\"qr_url\":\"https://www.huiflow.com/\"}";
                    id(cl).put(std::string(URL), std::string(""), std::string("application/json"), std::string(BODY));
                    // v4.0.66: HMI 事件顯示欄
                    id(hmi_last_event_line) = std::string("LED+CAM API JSON    ");
                    id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                  } else if (btn == 0x31) {
                    // v3.16.22 原始設計 (v3.16.71 恢復): LED TEXT → led_update，
                    //   text = "device:<sn> 我上線啦"，color #0000FF (藍)，位置 (69, 0)
                    //   v3.16.59 誤把兩個統一成 led_switch，丟了 device_id 注入文字功能
                    // v4.0.99: VSN 從 vsn_map 取（key="hmi_text"）；text/color/位置寫死不變
                    {
                      std::string vsn = id(ws).vsn_lookup("hmi_text");
                      if (!vsn.empty()) {
                        std::string text = "device:" + id(my_global_id) + " 我上線啦";
                        id(led_update).execute(vsn, text, std::string("#0000FF"), 69, 0, std::string("internet"));
                      } else {
                        ESP_LOGW("HMI", "0x31: vsn_map[hmi_text] empty, skip");
                      }
                    }
                    // v4.0.66: HMI 事件顯示欄
                    id(hmi_last_event_line) = std::string("led_update TEXT     ");
                    id(hmi_show_param_value).execute(732, 320, id(hmi_last_event_line));
                  }
                }
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 8) % ${MAX_UART_RECV_BUF_LEN});
              } else if (iRecvCnt > 32) {
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
              }
            }
          } else if (id(my_uart_recv_delay) > 1 && id(my_uart_recv_write) != id(my_uart_recv_read)) {
            id(my_uart_recv_write) = id(my_uart_recv_read);
          }

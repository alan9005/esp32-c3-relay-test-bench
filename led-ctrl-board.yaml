esphome:
  name: led-ctrl-board
  friendly_name: led-ctrl-board

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "2OzStohPffbYubP+atzF1lNB2oXbqHjYezH23Gj3fl4="

ota:
  - platform: esphome
    password: "a09bbc0f14db3caa96e26a73c47679d8"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Led-Ctrl-Board Fallback Hotspot"
    password: "12345678"
  on_connect:
    - lambda: |-
        char buffer[64];
        memset(buffer, 0x00, sizeof(buffer));
        snprintf(buffer, sizeof(buffer), "wifi connected, IP Address: %s\r\n", id(wifi_ip).state.c_str());
        uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));

captive_portal:

web_server:
  local: true

interval:
  - interval: 12s
    then:
      - lambda: |-
          ESP_LOGI("mac", "Wi-Fi MAC Address: %s", id(wifi_mac).state.c_str());
          {
            char buffer[64];
            memset(buffer, 0x00, sizeof(buffer));
            snprintf(buffer, sizeof(buffer), "MAC: %s\r\n", id(wifi_mac).state.c_str());
            uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
          }
          {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              snprintf(buffer, sizeof(buffer), "IP Address: %s\r\n", id(wifi_ip).state.c_str());
              uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
           }
          //id(open_lock).execute(1);
          //ESP_LOGE("","moto-1 auto on");
          //id(moto_ctrl_1).turn_on();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
    mac_address:
      name: "WiFi MAC Address"
      id: wifi_mac

uart:
  - id: uart_debug
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
  - id: uart_1
    tx_pin: GPIO20
    rx_pin: GPIO19
    baud_rate: 9600

switch:
  - platform: gpio
    pin: {number: GPIO45, inverted: false}
    id: moto_ctrl_1
    name: "Moto ctrl 1"
    icon: "mdi:gate"
    on_turn_on:
    - delay: 8s
    - switch.turn_off: moto_ctrl_1

substitutions:
  MAX_MOTO_ADC_VALUE_CNT: "20"
  MAX_UART_RECV_BUF_LEN: "254"
  LED_EFFECT_WAIT_CONNECT: "wait connect"
  LED_EFFECT_SETUP_MODE_ALARM: "setup mode alarm"
  LED_EFFECT_RAINBOW: "ranbow"
  LED_EFFECT_TWINKLE: "twinkle"
  LED_EFFECT_FAST_2S_PULSE: "Fast 2s Pulse"

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: 5
    id: light_rgb
    num_leds: 40
#    rmt_channel: 0
    rmt_symbols: 96
    chipset: SM16703
    name: "My Light 1"
    effects:
      - pulse:
          name: "${LED_EFFECT_FAST_2S_PULSE}"
          transition_length: 0.5s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: "${LED_EFFECT_WAIT_CONNECT}"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 0.2s
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 2s
      - strobe:
          name: "${LED_EFFECT_SETUP_MODE_ALARM}"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
      - addressable_rainbow:
          name: "${LED_EFFECT_RAINBOW}"
          speed: 10
          width: 50
      - addressable_twinkle:
          name: "${LED_EFFECT_TWINKLE}"
          twinkle_probability: 5%
          progress_interval: 4ms

  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: 6
    id: light_rgb_2
    num_leds: 40
#    rmt_channel: 0
    rmt_symbols: 96
    chipset: SM16703
    name: "My Light 2"
    effects:
      - pulse:
          name: "${LED_EFFECT_FAST_2S_PULSE}"
          transition_length: 0.5s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: "${LED_EFFECT_WAIT_CONNECT}"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 0.2s
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 2s
      - strobe:
          name: "${LED_EFFECT_SETUP_MODE_ALARM}"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
      - addressable_rainbow:
          name: "${LED_EFFECT_RAINBOW}"
          speed: 10
          width: 50
      - addressable_twinkle:
          name: "${LED_EFFECT_TWINKLE}"
          twinkle_probability: 5%
          progress_interval: 4ms

binary_sensor:
  - platform: gpio
    id: moto_pos_1
    name: "01-电机位置感应1"
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true    
    on_press: 
      then:
        - logger.log: moto 1 pos detected
        - lambda: |-
              ESP_LOGE("","moto-1 pos 1");
              id(moto_ctrl_1).turn_off();

  - platform: gpio
    id: car_high_pnp
    name: "02-车辆超高PNP"
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true    
    on_press: 
      then:
        - lambda: |-
              ESP_LOGE("","car high PNP");

  - platform: gpio
    id: car_high_npn
    name: "02-车辆超高NPN"
    pin:
      number: GPIO8
      mode:
        input: true
        pullup: true    
    on_press: 
      then:
        - lambda: |-
              ESP_LOGE("","car high NPN");



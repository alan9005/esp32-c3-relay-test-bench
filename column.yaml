  - platform: ledc
    pin: 6
    id: rtttl_out

binary_sensor:
  - platform: template
    name: "Movement Detected"
    lambda: |-
      float accel_x = id(acceleration_x).state;
      float accel_y = id(acceleration_y).state;
      float accel_z = id(acceleration_z).state;
      
      static float last_magnitude = 9.81;
      float magnitude = sqrt(accel_x * accel_x + accel_y * accel_y + accel_z * accel_z);
      float change = abs(magnitude - last_magnitude);
      last_magnitude = magnitude;
      
      // 检测突然的加速度变化
      bool motion = change > 1.6;
      
      // 可选：添加时间限制，避免持续触发
      //static uint32_t last_detection = 0;
      if (motion) {
        id(my_global_move_check_lost_cnt) = 0;
        //last_detection = millis();
        return true;
      }
      return false;
      // 保持检测状态 2 秒
      //return (millis() - last_detection) < 100;

    filters:
      - delayed_on: 20ms  # 延迟100ms触发，避免误报
      - delayed_off: 20ms # 延迟100ms关闭，避免误报
    on_press:
      - lambda: 'id(my_global_move_flag) = 1;'
      - logger.log:
          format: "Device is moving!"
          level: INFO
    on_release:
      - logger.log:
          format: "Device is stationary."
          level: INFO

  - platform: gpio
    id: my_setup_sw
    pin:
#      number: 12
      number: 1
      mode:
        input: true
        pullup: true
      inverted: true
    name: "setup mode"
    device_class: safety

  - platform: gpio
    pin:
      number: 7
      mode:
        input: true
        pullup: true
      inverted: true
    id: water_leak_check
    name: "water leak sensor"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

sensor:
  - platform: hx711
    id: weight_value
    name: "HX711 Value"
    dout_pin: 41
    clk_pin: 42
    gain: 32
    update_interval: 2s
    filters:
      - calibrate_linear:
#正方形传感器
#          - 0 -> 0
#          - 50000 -> 1
#长方形传感器
          - 68500 -> 0
          - 78500 -> 1
    unit_of_measurement: kg
    on_value: 
      then:
      - lambda: |-
          ESP_LOGI("main", "711[%f]", x);

  - platform: bmi160
    address: 0x68
    update_interval: 0.03s
    acceleration_x:
      id: acceleration_x
      name: "BMI160 Accel X"
    acceleration_y:
      id: acceleration_y
      name: "BMI160 Accel Y"
    acceleration_z:
      id: acceleration_z
      name: "BMI160 Accel z"

  - platform: dht
    pin: 13
    temperature:
      id: dht_temperature
      name: "A0温度"
    humidity:
      id: dht_humidity
      name: "A1湿度"
    update_interval: 6s

  - platform: ntc
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: NTC Temperature

  # Example source sensors:
  - platform: resistance
    id: resistance_sensor
    sensor: source_sensor
    configuration: DOWNSTREAM
    resistor: 5.6kOhm
    name: Resistance Sensor

  - platform: adc
    id: source_sensor
    pin: 2
    attenuation: auto
    update_interval: 6s
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("main", "ADC voltage: %.3f V", x);

i2c:
  sda: 21
  scl: 47
# 14, 48 用来测试
#  sda: 14
#  scl: 48
  scan: true
  id: bus_a

rtttl:
  id: rtl
  output: rtttl_out

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: 38
    id: light_rgb
    num_leds: 10
#    rmt_channel: 0
    chipset: ws2812
    name: "My Light"
    effects:
      - pulse:
          name: "${LED_EFFECT_FAST_2S_PULSE}"
          transition_length: 0.5s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: "${LED_EFFECT_WAIT_CONNECT}"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 0.2s
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 0.1s
            - state: false
              duration: 2s
      - strobe:
          name: "${LED_EFFECT_SETUP_MODE_ALARM}"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
      - addressable_rainbow:
          name: "${LED_EFFECT_RAINBOW}"
          speed: 10
          width: 50
      - addressable_twinkle:
          name: "${LED_EFFECT_TWINKLE}"
          twinkle_probability: 5%
          progress_interval: 4ms

      - !include effects/bluez.yaml
      - !include effects/candy_cane.yaml
      - !include effects/christmas.yaml
      - !include effects/fire.yaml
      - !include effects/flames.yaml
      - !include effects/lightning.yaml
      - !include effects/policeall.yaml
      - !include effects/vesuvius.yaml
      - !include effects/wheel_of_color.yaml
      - !include effects/wipe_in.yaml
      - !include effects/wipe_out.yaml

uart:
  - id: debug
    tx_pin: 43
    rx_pin: 44
    baud_rate: 115200
    rx_buffer_size: 256
  - id: cmd_connect
    tx_pin: 18
    rx_pin: 17
    baud_rate: 9600
    rx_buffer_size: 256
  - id: uart_1
    tx_pin: 20
    rx_pin: 19
    baud_rate: 9600

#################################################################################
script:
  - id: set_led_effect
    mode: single
    parameters:
      led_effect: std::string
    then:
      - light.turn_on:
          id: light_rgb
          effect: !lambda "return led_effect;"

  - id: ctrl_wifi_open
    mode: single
    then:
      - wifi.enable:
  - id: ctrl_wifi_close
    mode: single
    then:
      - wifi.disable:

  - id: hallway_light_script
    mode: restart     # Light will be kept on during 1 minute since
                      # the latest time the script is executed
    then:
      - while:
          condition:
            or:
              - rtttl.is_playing
              - light.is_on: light_rgb
          then:
            - output.turn_on: gpio_run_led
            - delay: 0.02s
            - output.turn_off: gpio_run_led
            - delay: 0.05s
  - id: move_up
    parameters:
      period_on: int
      period_off: int
      period_timeout: int
    mode: single
    then:
      - if:
          condition: 
            - script.is_running: move_down
          then:
            - script.stop: move_down
      - lambda: 'id(my_global_action_time) = period_timeout/10;'
      - lambda: 'id(my_global_move_check_lost_cnt) = 0;'
      - lambda: 'id(my_global_lost_cnt) = 50 / (period_on);'
      - while:
          condition:
            lambda: 'return (id(my_global_action_time) > 0);'
          then:
            - output.turn_on: gpio_ctrl_up
            - output.turn_on: gpio_run_led
            - delay: !lambda "return period_on;"
            - output.turn_off: gpio_ctrl_up
            - output.turn_off: gpio_run_led
            - delay: !lambda "return period_off;"
            - lambda: |-
                if ( id(my_global_lost_cnt) == 0 )
                {
                  id(my_global_lost_cnt) = 1;
                }
                if ( id(my_global_move_flag) != 0 )
                {
                  id(my_global_move_flag) = 0;
                  id(my_global_move_check_lost_cnt) = 0;
                }
                else
                {
                  id(my_global_move_check_lost_cnt)++;
                  if ( id(my_global_move_check_lost_cnt) > id(my_global_lost_cnt) )
                  {
                    ESP_LOGI("main", "my_global_move_check_lost_cnt %d", id(my_global_move_check_lost_cnt));            
                    id(my_global_move_check_lost_cnt) = 0;
                    id(move_up).stop();
                  }
                }

  - id: play_music
    mode: single
    parameters:
      song_str: std::string
    then:
      - rtttl.play:
          rtttl: !lambda 'return song_str;'

  - id: move_down
    parameters:
      period_on: int
      period_off: int
      period_timeout: int
    mode: single
    then:
      - if:
          condition: 
            - script.is_running: move_up
          then:
            - script.stop: move_up
      - lambda: 'id(my_global_action_time) = period_timeout/10;'
      - lambda: 'id(my_global_move_check_lost_cnt) = 0;'
      - lambda: 'id(my_global_lost_cnt) = 50 / (period_on);'
      - while:
          condition:
            lambda: 'return (id(my_global_action_time) > 0);'
          then:
            - output.turn_on: gpio_ctrl_down
            - output.turn_on: gpio_run_led
            - delay: !lambda "return period_on;"
            - output.turn_off: gpio_ctrl_down
            - output.turn_off: gpio_run_led
            - delay: !lambda "return period_off;"
            - lambda: |-
                if ( id(my_global_lost_cnt) == 0 )
                {
                  id(my_global_lost_cnt) = 1;
                }
                if ( id(my_global_move_flag) != 0 )
                {
                  id(my_global_move_flag) = 0;
                  id(my_global_move_check_lost_cnt) = 0;
                }
                else
                {
                  id(my_global_move_check_lost_cnt)++;
                  if ( id(my_global_move_check_lost_cnt) > id(my_global_lost_cnt) )
                  {
                    ESP_LOGI("main", "my_global_move_check_lost_cnt %d", id(my_global_move_check_lost_cnt));            
                    id(my_global_move_check_lost_cnt) = 0;
                    id(move_down).stop();
                  }
                }

  - id: uart_proc_hex
    mode: single
    then:
      - lambda: |-
          unsigned char aucData[2];
          int iRecvCnt;
          unsigned char aucTempBuf[${MAX_UART_RECV_BUF_LEN}];
          int iLength = uart_read_bytes((uart_port_t) 1, aucData, 1, 0);
          if ( iLength > 0 )
          {
            ESP_LOGI("main", "[0x%02x]", aucData[0]);
            if ( ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN}) != id(my_uart_recv_read) )
            {
              id(my_uart_recv_buf)[id(my_uart_recv_write)] = aucData[0];
              id(my_uart_recv_write) = ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN});
            }

            if ( id(my_uart_recv_write) >= id(my_uart_recv_read) )
            {
              iRecvCnt = id(my_uart_recv_write) - id(my_uart_recv_read);
            }
            else
            {
              iRecvCnt = id(my_uart_recv_write) + ${MAX_UART_RECV_BUF_LEN} - id(my_uart_recv_read);
            }
            
            int iPos = id(my_uart_recv_read);
            for ( int iLoop=0; iLoop<iRecvCnt; iLoop++ )
            {
              aucTempBuf[iLoop] = id(my_uart_recv_buf)[iPos];
              iPos = ((iPos + 1) % ${MAX_UART_RECV_BUF_LEN});
            }
            if ( iRecvCnt >= 7 )
            {
              if ( (aucTempBuf[0] != 0x7e) || (aucTempBuf[1] >= 255) || (aucTempBuf[1] < 7) )
              {
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
              }
              else
              {
                unsigned char ucLength = aucTempBuf[1];
                unsigned char ucCmd = aucTempBuf[5];
                unsigned char ucCrcSum = aucTempBuf[ucLength - 1];
                unsigned char crc = 0;
                unsigned char poly = 0x07;
                for ( int iLoop=0; iLoop<(ucLength - 1); iLoop++ )
                {
                  crc ^= aucTempBuf[iLoop];
                  for (uint8_t j = 0; j < 8; j++) 
                  {
                      if (crc & 0x80)
                      {
                          crc = (crc << 1) ^ poly;
                      } 
                      else 
                      {
                          crc <<= 1;
                      }
                  }
                }
                if ( iRecvCnt >= ucLength )
                {
                  ESP_LOGI("main", "mac[0x%02x][0x%02x][0x%02x]", id(my_local_mac)[3],id(my_local_mac)[4],id(my_local_mac)[5]);
                  if ( crc != ucCrcSum )
                  {
                    ESP_LOGI("main", "crc not match [0x%02x] [0x%02x] len[%d]", crc, ucCrcSum, ucLength);
                    id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
                  }
                  else
                  {
                    if ( ((aucTempBuf[2] == 0x00) && (aucTempBuf[3] == 0x00) && (aucTempBuf[4] == 0x00))
                    || ((aucTempBuf[2] == id(my_local_mac)[3]) && (aucTempBuf[3] == id(my_local_mac)[4]) && (aucTempBuf[4] == id(my_local_mac)[5])) )
                    {
                      int param1,param2,param3;
                      switch ( ucCmd )
                      {
                        case 0xa1:
                          id(my_report_mac_delay) = ((esp_random() % 150) + 2) * 10;
                          ESP_LOGI("main", "uart report mac delay [%d]", id(my_report_mac_delay));
                          break;
                        case 0xa3:
                          param1 = aucTempBuf[6];
                          aucTempBuf[ucLength - 1] = 0x00;
                          switch ( param1 )
                          {
                            case 1:
                              id(my_global_song1).clear();
                              id(my_global_song1) += (char *)&aucTempBuf[7];
                              ESP_LOGI("main", "updata song [1] %s", id(my_global_song1).c_str());
                              break;
                            case 2:
                              id(my_global_song2).clear();
                              id(my_global_song2) += (char *)&aucTempBuf[7];
                              ESP_LOGI("main", "updata song [2] %s", id(my_global_song2).c_str());
                              break;
                            case 3:
                              id(my_global_song3).clear();
                              id(my_global_song3) += (char *)&aucTempBuf[7];
                              ESP_LOGI("main", "updata song [3] %s", id(my_global_song3).c_str());
                              break;
                            case 4:
                              id(my_global_song4).clear();
                              id(my_global_song4) += (char *)&aucTempBuf[7];
                              ESP_LOGI("main", "updata song [4] %s", id(my_global_song4).c_str());
                              break;
                            case 5:
                              id(my_global_song5).clear();
                              id(my_global_song5) += (char *)&aucTempBuf[7];
                              ESP_LOGI("main", "updata song [5] %s", id(my_global_song5).c_str());
                              break;
                            default:
                              break;
                          }
                          break;
                        case 0xa4:
                          param1 = aucTempBuf[6];
                          if ( param1 == 0 )
                          {
                            id(ctrl_wifi_close)->execute();
                            ESP_LOGI("main", "off");
                          }
                          else if ( param1 == 1 )
                          {
                            id(ctrl_wifi_open)->execute();
                            ESP_LOGI("main", "on");
                          }
                          ESP_LOGI("main", "uart cmd [%d]", ucCmd);
                          break;

                        case 0x01:
                          param1 = aucTempBuf[6];
                          param1 <<= 8;
                          param1 += aucTempBuf[7];
                          param2 = aucTempBuf[8];
                          param2 <<= 8;
                          param2 += aucTempBuf[9];
                          param3 = aucTempBuf[10];
                          param3 <<= 8;
                          param3 += aucTempBuf[11];
                          ESP_LOGI("main", "up[%d][%d][%d]", param1, param2, param3);            
                          id(move_up)->execute(param1, param2, param3);
                          break;
                        case 0x02:
                          param1 = aucTempBuf[6];
                          param1 <<= 8;
                          param1 += aucTempBuf[7];
                          param2 = aucTempBuf[8];
                          param2 <<= 8;
                          param2 += aucTempBuf[9];
                          param3 = aucTempBuf[10];
                          param3 <<= 8;
                          param3 += aucTempBuf[11];
                          ESP_LOGI("main", "down[%d][%d][%d]", param1, param2, param3);            
                          id(move_down)->execute(param1, param2, param3);
                          break;
                        case 0x03:
                          param1 = aucTempBuf[6];
                          ESP_LOGI("main", "play rtttl[%d]", param1);            
                          switch ( param1 )
                          {
                            case 0:
                              if ( ((aucTempBuf[2] == id(my_local_mac)[3]) && (aucTempBuf[3] == id(my_local_mac)[4]) && (aucTempBuf[4] == id(my_local_mac)[5])) )
                              {
                                if ( id(my_global_report_mac_flag) == 0 )
                                {
                                  id(my_global_report_mac_flag) = 1;
                                  id(my_report_mac_delay) = 0;
                                  ESP_LOGI("main", "auto report mac complete");
                                  auto call = id(light_rgb).turn_off();
                                  call.set_transition_length(300); // in ms
                                  call.perform();
                                }
                              }
                              id(play_music).execute(id(my_global_song1));
                              break;
                            case 1:
                              id(play_music).execute(id(my_global_song2));
                              break;
                            case 2:
                              id(play_music).execute(id(my_global_song3));
                              break;
                            case 3:
                              id(play_music).execute(id(my_global_song4));
                              break;
                            case 4:
                              id(play_music).execute(id(my_global_song5));
                              break;
                            case 5:
                              id(play_music).execute(id(my_global_song6));
                              break;
                            case 6:
                              id(play_music).execute(id(my_global_song7));
                              break;
                            case 7:
                              id(play_music).execute(id(my_global_song8));
                              break;
                            case 8:
                              id(play_music).execute(id(my_global_song9));
                              break;
                            case 9:
                              id(play_music).execute(id(my_global_song10));
                              break;
                            default:
                              ESP_LOGI("main", "Invalid index of song[%d]", param1);
                              break;
                          }
                          break;
                        case 0x04:
                          param1 = aucTempBuf[6];
                          //if ( param1 == 0 )
                          {
                            auto call = id(light_rgb).turn_off();
                            // set parameters (optional)
                            call.set_transition_length(300); // in ms
                            // perform action:
                            call.perform();
                            //ESP_LOGI("main", "off");
                          }
                          if ( param1 == 1 )
                          {
                            auto call = id(light_rgb).turn_on();
                            // set parameters (optional)
                            call.set_transition_length(30); // in ms
                            // perform action:
                            call.perform();
                            ESP_LOGI("main", "on");
                          }
                          else if ( param1 == 2 )
                          {
                            id(set_led_effect)->execute("${LED_EFFECT_FAST_2S_PULSE}");
                          }
                          else if ( param1 == 3 )
                          {
                            id(set_led_effect)->execute("${LED_EFFECT_RAINBOW}");
                          }
                          else if ( param1 == 4 )
                          {
                            id(set_led_effect)->execute("${LED_EFFECT_TWINKLE}");
                          }
                          else if ( param1 == 5 )
                          {
                            id(set_led_effect)->execute("Bluez");
                          }
                          else if ( param1 == 6 )
                          {
                            id(set_led_effect)->execute("Candy Cane");
                          }
                          else if ( param1 == 7 )
                          {
                            id(set_led_effect)->execute("Christmas RedGreen");
                          }
                          else if ( param1 == 8 )
                          {
                            id(set_led_effect)->execute("Fire");
                          }
                          else if ( param1 == 9 )
                          {
                            id(set_led_effect)->execute("Fireplace");
                          }
                          else if ( param1 == 10 )
                          {
                            id(set_led_effect)->execute("Flames Vertical");
                          }
                          else if ( param1 == 11 )
                          {
                            id(set_led_effect)->execute("Lightning");
                          }
                          else if ( param1 == 12 )
                          {
                            id(set_led_effect)->execute("Wheel of Color");
                          }
                          else if ( param1 == 13 )
                          {
                            id(set_led_effect)->execute("Vesuvius");
                          }
                          else if ( param1 == 14 )
                          {
                            id(set_led_effect)->execute("Police All");
                          }
                          else if ( param1 == 15 )
                          {
                            id(set_led_effect)->execute("Wipe In");
                          }
                          else if ( param1 == 16 )
                          {
                            id(set_led_effect)->execute("Wipe Out");
                          }
                          break;
                        case 0x05:
                          unsigned char aucTempBuf[20];
                          float fValue;
                          short sValue;
                          unsigned char crc;
                          unsigned char poly;
                          aucTempBuf[0] = 0x7e;
                          aucTempBuf[1] = 15;
                          aucTempBuf[2] = id(my_local_mac)[3];
                          aucTempBuf[3] = id(my_local_mac)[4];
                          aucTempBuf[4] = id(my_local_mac)[5];
                          aucTempBuf[5] = 0x06;
                          fValue = id(dht_temperature).state;
                          fValue *= 10;
                          sValue = (short)round(fValue);
                          aucTempBuf[6] = sValue>>8;
                          aucTempBuf[7] = sValue & 0xff;
                          fValue = id(dht_humidity).state;
                          fValue *= 10;
                          sValue = (short)round(fValue);
                          aucTempBuf[8] = sValue>>8;
                          aucTempBuf[9] = sValue & 0xff;
                          fValue = id(weight_value).state;
                          fValue *= 10;
                          sValue = (short)round(fValue);
                          aucTempBuf[10] = sValue>>8;
                          aucTempBuf[11] = sValue & 0xff;
                          aucTempBuf[12] = 0x00;
                          if (id(water_leak_check).state)
                          {
                            aucTempBuf[13] = 1;
                          }
                          else
                          {
                            aucTempBuf[13] = 0;
                          }
                          crc = 0;
                          poly = 0x07;
                          for ( int iLoop=0; iLoop<14; iLoop++ )
                          {
                            crc ^= aucTempBuf[iLoop];
                            for (uint8_t j = 0; j < 8; j++) 
                            {
                                if (crc & 0x80)
                                {
                                    crc = (crc << 1) ^ poly;
                                } 
                                else 
                                {
                                    crc <<= 1;
                                }
                            }
                          }
                          aucTempBuf[14] = crc;
                          uart_write_bytes((uart_port_t) 1, aucTempBuf, 15);
                          ESP_LOGI("main", "report state");
                          break;

                        default:
                          ESP_LOGI("main", "unknown cmd [%d]", ucCmd);
                          break;
                      }
                    }
                    id(my_uart_recv_read) = iPos;
                  }
                }
              }
            }
          }

captive_portal:
    
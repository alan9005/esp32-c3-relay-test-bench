      - lambda: |- 
          id(move_down)->execute(id(gidOnDuration), id(gidOffDuration), id(gidTimeout));

  - platform: template
    name: "show state"
    on_press:
      - lambda: |- 
          ESP_LOGI("main", id(my_global_song1).c_str()); 
          ESP_LOGI("main", id(my_global_song2).c_str()); 
          ESP_LOGI("main", id(my_global_song3).c_str()); 
          ESP_LOGI("main", id(my_global_song4).c_str()); 
          ESP_LOGI("main", id(my_global_song5).c_str()); 
          ESP_LOGI("main", id(my_global_song6).c_str()); 
          ESP_LOGI("main", id(my_global_song7).c_str()); 
          ESP_LOGI("main", id(my_global_song8).c_str()); 
          ESP_LOGI("main", id(my_global_song9).c_str()); 
          ESP_LOGI("main", id(my_global_song10).c_str()); 
          ESP_LOGI("mac", "Wi-Fi MAC Address: %02X:%02X:%02X:%02X:%02X:%02X, [0x%02x:0x%02x:0x%02x]", id(my_local_mac)[0], id(my_local_mac)[1], id(my_local_mac)[2], id(my_local_mac)[3], id(my_local_mac)[4], id(my_local_mac)[5], id(my_local_mac)[3], id(my_local_mac)[4], id(my_local_mac)[5]);

interval:
  - interval: 800ms  # 500ms触发一次
    then:
      - if:
          condition:
            lambda: 'return id(led_state);'
          then:
            - output.turn_on: gpio_run_led2
          else:
            - output.turn_off: gpio_run_led2
      - lambda: 'id(led_state) = !id(led_state);'
  - interval: 10ms
    then:
#      - uart.write: "Hello \r\n"
      - lambda: |-
           if ( id(my_global_power_on_ticks) < 0xf0000000 )
           {
            id(my_global_power_on_ticks)++;
           }
           if ( id(my_global_setup_mode) == 1 )
           {
            if ( (id(my_global_power_on_ticks) % (3 * 100) == 0) )
            {
              id(play_music).execute(id(my_global_song2));
              ESP_LOGI("mac", "play alert music");
            }
            if ( id(my_global_power_on_ticks) == 20 * 100 )
            {
              id(move_up)->execute(20, 200, 28000);
              ESP_LOGI("mac", "auto raise up");
            }
           }
           if ( (id(my_global_power_on_ticks) % (20 * 100)) == 0 )
           {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              {
                char ip_buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
                for (auto &ip : esphome::wifi::global_wifi_component->get_ip_addresses()) {
                  if (ip.is_ip4()) {
                    ip.str_to(ip_buf);
                    snprintf(buffer, sizeof(buffer), "IP Address: %s\r\n", ip_buf);
                    uart_write_bytes((uart_port_t) 0, buffer, strlen(buffer));
                    break;
                  }
                }
              }
           }
           if ( id(my_global_action_time) > 0 )
           {
            id(my_global_action_time)--;
           }
           if ( id(my_report_mac_delay) > 0 )
           {
            id(my_report_mac_delay)--;
            if ( id(my_report_mac_delay) == 0 )
            {
              unsigned char crc = 0;
              unsigned char poly = 0x07;
              unsigned char aucTempBuf[10];
              aucTempBuf[0] = 0x7e;
              aucTempBuf[1] = 0x08;
              aucTempBuf[2] = id(my_local_mac)[3];
              aucTempBuf[3] = id(my_local_mac)[4];
              aucTempBuf[4] = id(my_local_mac)[5];
              aucTempBuf[5] = 0xa2;
              aucTempBuf[6] = 0x00;
              for ( int iLoop=0; iLoop<7; iLoop++ )
              {
                crc ^= aucTempBuf[iLoop];
                for (uint8_t j = 0; j < 8; j++) 
                {
                    if (crc & 0x80)
                    {
                        crc = (crc << 1) ^ poly;
                    } 
                    else
                    {
                        crc <<= 1;
                    }
                }
              }
              aucTempBuf[7] = crc;
              if ( id(my_global_setup_mode) == 0 )
              {
                uart_write_bytes((uart_port_t) 1, aucTempBuf, 7 + 1);
              }
              else
              {
                ESP_LOGI("main", "uart report not send, because it is setup mode now");
              }

              if ( id(my_global_report_mac_flag) == 0 )
              {
                id(my_report_mac_delay) = ((esp_random() % 200) + 2) * 10;
                ESP_LOGI("main", "uart report mac delay [%d]", id(my_report_mac_delay));
              }
            }
           }


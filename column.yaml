
esphome:
  name: column
  friendly_name: "升降柱"
  on_boot:
   priority: 200
    # ...
   then:
      - uart.write: 
          id: debug
          data: "column v1.0.0.1\r\n"
      - lambda: |-
          memset(id(my_uart_recv_buf), 0x00, sizeof(id(my_uart_recv_buf)));
          id(my_uart_recv_read) = 0;
          id(my_uart_recv_write) = 0;
          id(my_report_mac_delay) = 0;
          id(my_global_report_mac_flag) = 0;
          id(my_report_mac_delay) = ((esp_random() % 200) + 2) * 10;
          ESP_LOGI("main", "uart report mac delay [%d]", id(my_report_mac_delay));
          get_mac_address_raw(id(my_local_mac));
          ESP_LOGI("mac", "Wi-Fi MAC Address: %02X:%02X:%02X:%02X:%02X:%02X", id(my_local_mac)[0], id(my_local_mac)[1], id(my_local_mac)[2], id(my_local_mac)[3], id(my_local_mac)[4], id(my_local_mac)[5]);
          {
            char buffer[64];
            memset(buffer, 0x00, sizeof(buffer));
            snprintf(buffer, sizeof(buffer), "MAC: %02X:%02X:%02X:%02X:%02X:%02X\r\n", id(my_local_mac)[0], id(my_local_mac)[1], id(my_local_mac)[2], id(my_local_mac)[3], id(my_local_mac)[4], id(my_local_mac)[5]);
            uart_write_bytes((uart_port_t) 0, buffer, strlen(buffer));
          }

          auto call = id(num_raise_on).make_call();
          call.set_value(id(giOnDuration));
          call.perform();
          auto call2 = id(num_raise_off).make_call();
          call2.set_value(id(giOffDuration));
          call2.perform();
          auto call3 = id(num_raise_timeout).make_call();
          call3.set_value(id(giTimeout));
          call3.perform();

          auto call4 = id(num_down_on).make_call();
          call4.set_value(id(gidOnDuration));
          call4.perform();
          auto call5 = id(num_down_off).make_call();
          call5.set_value(id(gidOffDuration));
          call5.perform();
          auto call6 = id(num_down_timeout).make_call();
          call6.set_value(id(gidTimeout));
          call6.perform();

      - output.turn_on: gpio_ES1642_RST

      - if:
          condition:
            # Same syntax for is_off
            binary_sensor.is_on: my_setup_sw
          then:
            - lambda: id(my_global_setup_mode) = 0;
            - light.addressable_set:
                  id: light_rgb
                  range_from: 6
                  range_to: 6
                  red: 0%
                  green: 100%
                  blue: 0%
         #   - delay: 5s
            - lambda: |-
                id(set_led_effect)->execute("${LED_EFFECT_WAIT_CONNECT}");
          else:
            - lambda: |-
                id(my_global_setup_mode) = 1;
                id(set_led_effect)->execute("${LED_EFFECT_SETUP_MODE_ALARM}");

  on_loop:
    then:
      - script.execute: uart_proc_hex


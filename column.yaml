number:
  - platform: template
    name: "UP on duration(unit: 1ms)"
    id: num_raise_on
    optimistic: true
    min_value: 6
    max_value: 5000
    step: 1
    set_action: 
      lambda: |- 
        id(giOnDuration) = x;
  - platform: template
    name: "UP off duration(unit: 1ms)"
    id: num_raise_off
    optimistic: true
    min_value: 6
    max_value: 5000
    step: 1
    set_action: 
      lambda: |- 
        id(giOffDuration) = x;
  - platform: template
    name: "UP timeout duration(unit: 1ms)"
    id: num_raise_timeout
    optimistic: true
    min_value: 50
    max_value: 30000
    step: 1
    set_action: 
      lambda: |- 
        id(giTimeout) = x;

  - platform: template
    name: "DOWN on duration(unit: 1ms)"
    id: num_down_on
    optimistic: true
    min_value: 6
    max_value: 5000
    step: 1
    set_action: 
      lambda: |- 
        id(gidOnDuration) = x;
  - platform: template
    name: "DOWN off duration(unit: 1ms)"
    id: num_down_off
    optimistic: true
    min_value: 6
    max_value: 5000
    step: 1
    set_action: 
      lambda: |- 
        id(gidOffDuration) = x;
  - platform: template
    name: "DOWN timeout duration(unit: 1ms)"
    id: num_down_timeout
    optimistic: true
    min_value: 50
    max_value: 30000
    step: 1
    set_action: 
      lambda: |- 
        id(gidTimeout) = x;

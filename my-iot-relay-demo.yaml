# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml
#
# 16 路继电器控制板（Modbus RTU 主站）
#   - RS485 总线: TXD=GPIO1, RXD=GPIO2, 9600 8N1, 从站地址 100
#   - WiFi 连接后每 5 秒从调试串口 UART0 (GPIO43/GPIO44) 输出本机 IP / MAC
#   - GPIO48 WS2812 网络状态灯:
#       绿色常亮 = WiFi 已连接 / 黄色呼吸 = 连接中 / 蓝色快闪 = AP 配网模式

esphome:
  name: my-iot-relay-demo
  friendly_name: my-iot-relay-demo
  on_boot:
    priority: 200
    then:
      - lambda: |-
          id(test_status_text).publish_state("已停止");
          id(test_cycle_sensor).publish_state(0.0f);
          id(test_elapsed_sensor).publish_state(0.0f);

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "VNJCxLT2rfTBnHjufCBBiBs7H3nd09bGJb8Lmgjsa4U="

ota:
  - platform: esphome
  # 让 web_server 页面显示 OTA 上传按钮（见 repo 升级笔记）
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: relay-demo Fallback Hotspot
    password: "So6sCTVk4OAs"
  on_connect:
    - lambda: |-
        {
          char buffer[64];
          memset(buffer, 0x00, sizeof(buffer));
          snprintf(buffer, sizeof(buffer), "WiFi connected\r\n");
          uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
        }
        id(net_status_led).turn_on().set_rgb(0.0f, 1.0f, 0.0f).set_effect("None").set_brightness(0.4f).perform();
  on_disconnect:
    - lambda: |-
        ESP_LOGW("network", "WiFi disconnected");
        id(net_status_led).turn_on().set_rgb(1.0f, 0.8f, 0.0f).set_effect("connecting_pulse").perform();

captive_portal:

web_server:
  port: 80
  version: 2
  log: false  # 关闭 SSE 日志流，避免页面/状态更新变慢
  js_include: "web/relay_dashboard.js"
  css_include: "web/relay_dashboard.css"

uart:
  # UART0: 调试串口 (TX=GPIO43, RX=GPIO44, 115200)
  - id: uart_debug
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    rx_buffer_size: 256
  # UART1: RS485 Modbus 总线 (TX=GPIO1, RX=GPIO2, 9600 8N1)
  - id: uart_1
    tx_pin: GPIO1
    rx_pin: GPIO2
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 256
    # Modbus 收发原始帧打印到调试串口 UART0
    debug:
      direction: BOTH
      after:
        timeout: 20ms
      sequence:
        - lambda: |-
            {
              char buf[300];
              int len = 0;
              int remain = (int) sizeof(buf);
              len += snprintf(buf, remain, "[MODBUS %s %dB]",
                              direction == esphome::uart::UART_DIRECTION_TX ? "TX" : "RX",
                              (int) bytes.size());
              remain -= len;
              if (remain < 0) remain = 0;
              for (auto b : bytes) {
                if (remain > 5) {
                  int n = snprintf(buf + len, remain, " %02X", b);
                  len += n;
                  remain -= n;
                }
              }
              if (remain > 3) {
                len += snprintf(buf + len, remain, "\r\n");
              }
              uart_write_bytes((uart_port_t)0, buf, len);
            }

modbus:
  - uart_id: uart_1
    id: modbus_1

modbus_controller:
  - id: modbus_relay
    address: 100
    modbus_id: modbus_1
    setup_priority: -5
    update_interval: 5s
    command_throttle: 50ms
    offline_skip_updates: 1

interval:
  # WiFi 连接后，每 5 秒从调试串口 UART0 输出本机 IP / MAC
  - interval: 5s
    then:
      - lambda: |-
          if (esphome::wifi::global_wifi_component->is_connected()) {
            {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              snprintf(buffer, sizeof(buffer), "IP Address: %s\r\n", id(wifi_ip).state.c_str());
              uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
            }
            {
              char buffer[64];
              memset(buffer, 0x00, sizeof(buffer));
              snprintf(buffer, sizeof(buffer), "MAC Address: %s\r\n", id(wifi_mac).state.c_str());
              uart_write_bytes((uart_port_t)0, buffer, strlen(buffer));
            }
          }
  # 网络状态灯状态机（1s 轮询，状态变化才刷新）
  - interval: 1s
    then:
      - lambda: |-
          int s;
          if (esphome::wifi::global_wifi_component->is_connected()) {
            s = 2;  // 绿色常亮
          } else if (esphome::wifi::global_wifi_component->is_ap_active()) {
            s = 3;  // 蓝色快闪
          } else {
            s = 1;  // 黄色呼吸
          }
          if (s != id(net_led_state)) {
            id(net_led_state) = s;
            if (s == 2) {
              id(net_status_led).turn_on().set_rgb(0.0f, 1.0f, 0.0f).set_effect("None").set_brightness(0.4f).perform();
            } else if (s == 3) {
              id(net_status_led).turn_on().set_effect("ap_blink").perform();
            } else {
              id(net_status_led).turn_on().set_rgb(1.0f, 0.8f, 0.0f).set_effect("connecting_pulse").perform();
            }
          }

  # 性能测试状态机（100ms 轮询）
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(test_running)) return;
          uint32_t now = millis();

          // 持续时间到 → 停止
          if ((int) id(test_duration_s).state > 0 &&
              (now - id(test_start_ms)) >= (uint32_t) ((int) id(test_duration_s).state) * 1000UL) {
            id(test_stop_reason) = 2;
            id(relay_test_stop)->execute();
            return;
          }
          // 测试次数到 → 停止
          if ((int) id(test_count_target).state > 0 &&
              id(test_cycle_count) >= (int) id(test_count_target).state) {
            id(test_stop_reason) = 1;
            id(relay_test_stop)->execute();
            return;
          }

          // 等 Modbus 队列排空 + 相位时间到，再翻转
          if (id(modbus_relay)->get_command_queue_length() > 0) return;
          if ((now - id(test_phase_start_ms)) < (uint32_t) ((int) id(test_interval_ms).state)) return;

          id(test_phase) = id(test_phase) ? 0 : 1;
          id(test_phase_start_ms) = now;
          for (int i = 0; i < 16; i++) {
            if (id(test_relay_mask) & (1u << i)) {
              auto cmd = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                  id(modbus_relay), (uint16_t) i, id(test_phase) ? 1 : 0);
              id(modbus_relay)->queue_command(cmd);
            }
          }
          if (id(test_phase)) {
            id(test_cycle_count)++;
          }

          id(test_status_text).publish_state("运行中");
          id(test_cycle_sensor).publish_state((float) id(test_cycle_count));
          id(test_elapsed_sensor).publish_state((float) ((now - id(test_start_ms)) / 1000UL));

globals:
  - id: net_led_state
    type: int
    restore_value: no
    initial_value: '-1'

  # ── 继电器性能测试状态 ──
  - id: test_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: test_relay_mask
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: test_cycle_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: test_phase
    type: int
    restore_value: no
    initial_value: '0'
  - id: test_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: test_phase_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # 停止原因: 1=次数完成 2=时间到 3=手动停止
  - id: test_stop_reason
    type: int
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: template
    name: "test_status_text"
    id: test_status_text
    update_interval: 60s
  - platform: wifi_info
    ip_address:
      name: "wifi_ip"
      id: wifi_ip
    mac_address:
      name: "wifi_mac"
      id: wifi_mac

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO48
    id: net_status_led
    num_leds: 1
    chipset: ws2812
    name: "网络状态灯"
    internal: true
    effects:
      - pulse:
          name: "connecting_pulse"
          transition_length: 0.6s
          update_interval: 0.6s
          min_brightness: 8%
          max_brightness: 100%
      - strobe:
          name: "ap_blink"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 120ms
            - state: false
              duration: 120ms

switch:
  # ── 16 路继电器（保持寄存器 0~15，写 0=关 / 1=开） ──
  # restore_mode: DISABLED 避免开机时向板卡写入默认状态（上电状态由板卡寄存器 204 决定）
  - platform: modbus_controller
    modbus_controller_id: modbus_relay
    name: "relay_01"
    id: relay_01
    register_type: holding
    address: 0
    bitmask: 1
    restore_mode: DISABLED
    icon: "mdi:toggle-switch"
  - platform: modbus_controller
    modbus_controller_id: modbus_relay
    name: "relay_02"
    id: relay_02
    register_type: holding
    address: 1
    bitmask: 1
    restore_mode: DISABLED
    icon: "mdi:toggle-switch"
  - platform: modbus_controller
    modbus_controller_id: modbus_relay
    name: "relay_03"
    id: relay_03
    register_type: holding
    address: 2
    bitmask: 1
    restore_mode: DISABLED
    icon: "mdi:toggle-switch"
  - platform: modbus_controller
    modbus_controller_id: modbus_relay
    name: "relay_04"
    id: relay_04
    register_type: holding
    address: 3
    bitmask: 1
    restore_mode: DISABLED
    icon: "mdi:toggle-switch"
  - platform: modbus_controller

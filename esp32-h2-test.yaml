# Board: Generic ESP32-H2 Board (Generic)
# Definition: definitions/boards/generic-esp32h2/manifest.yaml

esphome:
  name: esp32-h2-test
  friendly_name: ESP32-H2-test
  on_boot:
    # 上电时按 GPIO9 初始电平初始化"武装"状态：
    #   高（冷启动，正常模式）-> 已武装，下次拉低即进入省电
    #   低（刚被拉低唤醒）     -> 未武装，先等释放(高)再武装
    - if:
        condition:
          binary_sensor.is_on: mode_pin
        then:
          - globals.set:
              id: gpio9_armed
              value: 'true'
        else:
          - globals.set:
              id: gpio9_armed
              value: 'false'

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

# 状态变量：
#   gpio9_armed         - GPIO9 释放(高)后置 true
#   gpio9_sleep_pending - 正常模式下已检测到拉低，等待释放后真正入睡
globals:
  - id: gpio9_armed
    type: bool
    initial_value: 'false'
  - id: gpio9_sleep_pending
    type: bool
    initial_value: 'false'

# 模式切换引脚 GPIO9（内部上拉，建议外接上拉到 3.3V）：
#   正常模式：拉低请求进入省电，释放(高)后真正进入深度睡眠
#   省电模式：拉低即唤醒，进入正常模式
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
    id: mode_pin
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_release:  # GPIO9 被拉低（按下）
      - if:
          condition:
            lambda: 'return id(gpio9_armed);'
          then:
            - globals.set:
                id: gpio9_sleep_pending
                value: 'true'
    on_press:    # GPIO9 释放回高电平
      - if:
          condition:
            lambda: 'return id(gpio9_sleep_pending);'
          then:
            # 释放时引脚已为高，进入睡眠不会被立即唤醒
            - deep_sleep.enter: deep_sleep_1
          else:
            - globals.set:
                id: gpio9_armed
                value: 'true'

# 省电模式（深度睡眠）：
#   GPIO9 拉低时通过 EXT1(ANY_LOW) 唤醒；
#   正常模式下由 GPIO9 按键（释放后）调用 deep_sleep.enter 进入睡眠。
deep_sleep:
  id: deep_sleep_1
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - GPIO9

# 测试 WS2812 LED，数据线接在 GPIO8
light:
  - platform: esp32_rmt_led_strip
    id: test_led
    name: "Test LED"
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB

# 正常模式下的逻辑
interval:
  # LED 每 3 秒点亮一次（亮 0.2 秒）
  - interval: 3s
    then:
      - light.turn_on:
          id: test_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: 100%
      - delay: 200ms
      - light.turn_off: test_led

logger:

# This board has no native Wi-Fi. ESPHome's ``api:`` and
# ``ota:`` components both require a ``network``
# component — configure ``openthread:`` / ``ethernet:`` /
# ``esp32_hosted:`` to suit your setup, then add ``api:``
# and ``ota:`` blocks once the network is ready.

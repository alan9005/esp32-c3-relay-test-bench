# Board: Generic ESP32-H2 Board (Generic)
# Definition: definitions/boards/generic-esp32h2/manifest.yaml

esphome:
  name: esp32-h2-test
  friendly_name: ESP32-H2-test

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

# 模式检测引脚 GPIO9（内部上拉）：
#   拉低    -> 正常模式（LED 每 3 秒亮一次）
#   悬空/高 -> 进入省电模式（深度睡眠）
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
    id: mode_pin
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# 省电模式（深度睡眠）：
#   GPIO9 拉低时通过 EXT1(ANY_LOW) 唤醒；由 interval 检测到
#   GPIO9 高电平时调用 deep_sleep.enter 进入睡眠。
deep_sleep:
  id: deep_sleep_1
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - GPIO9

# 测试 WS2812 LED，数据线接在 GPIO8
light:
  - platform: esp32_rmt_led_strip
    id: test_led
    name: "Test LED"
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB

# 正常模式下的逻辑
interval:
  # LED 每 3 秒点亮一次（亮 0.2 秒）
  - interval: 3s
    then:
      - light.turn_on:
          id: test_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: 100%
      - delay: 200ms
      - light.turn_off: test_led

  # 轮询 GPIO9：高电平时进入省电模式
  - interval: 100ms
    then:
      - if:
          condition:
            binary_sensor.is_on: mode_pin
          then:
            - deep_sleep.enter: deep_sleep_1

logger:

# This board has no native Wi-Fi. ESPHome's ``api:`` and
# ``ota:`` components both require a ``network``
# component — configure ``openthread:`` / ``ethernet:`` /
# ``esp32_hosted:`` to suit your setup, then add ``api:``
# and ``ota:`` blocks once the network is ready.

# Board: Generic ESP32-H2 Board (Generic)
# Definition: definitions/boards/generic-esp32h2/manifest.yaml

esphome:
  name: esp32-h2-test
  friendly_name: ESP32-H2-test
  on_boot:
    # 唤醒后点亮 WS2812 LED 0.2 秒，随后自动进入省电(深度睡眠)模式
    then:
      - light.turn_on:
          id: test_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: 100%
      - delay: 0.2s
      - light.turn_off: test_led

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

# 省电模式：深度睡眠 3 秒后唤醒一次。
# 未设置 run_duration，设备在启动(完成 on_boot)后立即重新进入深度睡眠。
deep_sleep:
  sleep_duration: 3s

# 测试 WS2812 LED，数据线接在 GPIO8
light:
  - platform: esp32_rmt_led_strip
    id: test_led
    name: "Test LED"
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB

logger:

# This board has no native Wi-Fi. ESPHome's ``api:`` and
# ``ota:`` components both require a ``network``
# component — configure ``openthread:`` / ``ethernet:`` /
# ``esp32_hosted:`` to suit your setup, then add ``api:``
# and ``ota:`` blocks once the network is ready.

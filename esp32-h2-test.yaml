# Board: Generic ESP32-H2 Board (Generic)
# Definition: definitions/boards/generic-esp32h2/manifest.yaml

esphome:
  name: esp32-h2-test
  friendly_name: ESP32-H2-test

esp32:
  variant: esp32h2
  framework:
    type: esp-idf

# 进入省电按钮 GPIO9（内部上拉）：
#   正常模式下 GPIO9 拉低 -> 立即进入省电模式（深度睡眠）
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
    id: sleep_button
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_release:  # GPIO9 拉低
      - deep_sleep.enter: deep_sleep_1

# 省电模式（深度睡眠）：
#   - GPIO10 拉低时通过 EXT1(ANY_LOW) 唤醒，进入正常模式；
#   - 每 10 秒定时唤醒一次作为兜底。
deep_sleep:
  id: deep_sleep_1
  sleep_duration: 10s
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - GPIO10

        
# 测试 WS2812 LED，数据线接在 GPIO8
light:
  - platform: esp32_rmt_led_strip
    id: test_led
    name: "Test LED"
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB

# 正常模式下的逻辑
interval:
  # LED 每 3 秒点亮一次（亮 0.8 秒）
  - interval: 3s
    then:
      - light.turn_on:
          id: test_led
          red: 100%
          green: 100%
          blue: 100%
          brightness: 100%
      - delay: 800ms
      - light.turn_off: test_led

logger:

# This board has no native Wi-Fi. ESPHome's ``api:`` and
# ``ota:`` components both require a ``network``
# component — configure ``openthread:`` / ``ethernet:`` /
# ``esp32_hosted:`` to suit your setup, then add ``api:``
# and ``ota:`` blocks once the network is ready.

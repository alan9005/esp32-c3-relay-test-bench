interval:
  - interval: 1s
    then:
      - lambda: |-
          if ( id(my_uart_recv_delay) < 60000 )
          {
            id(my_uart_recv_delay)++;
          }

          if ( id(my_wash_running_flag) == 1 )
          {
            id(my_wash_timer)++;
          }

          if ( id(my_page_init_flag) == 1 )
          {
            id(my_page_init_flag) = 255;
            id(my_hmi_page_index) = 1;
            id(hmi_show_clear_all).execute();
            delay(2);
            id(hmi_show_page).execute(id(my_hmi_page_index));
            delay(2);
          }
          else if ( id(my_page_init_flag) == 0 )
          {
            id(my_page_init_flag) = 255;
            id(my_hmi_page_index) = 0;
            id(hmi_show_clear_all).execute();
            delay(2);
            id(hmi_show_page).execute(id(my_hmi_page_index));
            delay(2);
            id(hmi_show_relay_icon).execute(960, 0, 0x3c);  //返回图标
            id(hmi_show_relay_icon).execute(960, 83, 0x3d);
            id(hmi_show_relay_icon).execute(960, 169, 0x3f);  //OTA更新图标
            static switch_::Switch* all_relays[] = {
              id(relay_01), id(relay_02), id(relay_03), id(relay_04), id(relay_05), id(relay_06), id(relay_07), id(relay_08),
              id(relay_09), id(relay_10), id(relay_11), id(relay_12), id(relay_13), id(relay_14), id(relay_15), id(relay_16)
            };
            for ( int iIndex=0; iIndex<16; iIndex++ )
            {
              if ( all_relays[iIndex]->state )
              {
                id(hmi_show_relay_icon).execute(iIndex * 64, 541, iIndex + 0x11);
              }
              else
              {
                id(hmi_show_relay_icon).execute(iIndex * 64, 541, iIndex + 0x01);
              }
            }
            for ( int iIndex=0; iIndex<8; iIndex++ )
            {
              id(hmi_show_relay_icon).execute(512 + iIndex * 0x40, 375, 0x29 + iIndex);
            }
            id(hmi_show_relay_icon).execute(512 - 2 * 0x40, 375, 0x40);
            id(hmi_show_relay_icon).execute(512 - 1 * 0x40, 375, 0x41);
            id(hmi_show_relay_icon).execute(512 + 1 * 0x40, 458, 0x42);
            id(hmi_show_relay_icon).execute(512 + 2 * 0x40, 458, 0x43);
            id(hmi_show_relay_icon).execute(512 + 3 * 0x40, 458, 0x44);
            id(hmi_show_param_name).execute();
            char boot_buf[80];
            const char *sid = id(my_global_id).c_str();
            if (sid[0] != '\0') {
              snprintf(boot_buf, sizeof(boot_buf), "%s v${DEV_FIRMWARE_VER}(%uKB)",
                sid, esp_get_free_heap_size() / 1024);
            } else {
              snprintf(boot_buf, sizeof(boot_buf), "v${DEV_FIRMWARE_VER}(%uKB)",
                esp_get_free_heap_size() / 1024);
            }
            id(hmi_show_param_value).execute(220, 0, std::string(boot_buf));
            id(hmi_show_param_value).execute(220, 32,  id(ac_power_lose).state      ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 64,  id(leak_det).state            ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 96,  id(water_level_1).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 128, id(water_level_2).state       ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 160, id(emgr_input).state          ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 192, id(start_stop_input).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 224, id(car_high_input).state      ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 256, id(check_door_input).state    ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 288, id(washer_led_b).state        ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 320, id(washer_led_g).state        ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 352, id(washer_led_r).state        ? " ON" : "OFF");
            id(hmi_show_param_value).execute(220, 384, id(check_babble_input_1).state ? " ON" : "OFF");
          }

  - interval: 2s
    then:
      - lambda: |-
          unsigned long secs = id(system_uptime).state;
          unsigned long days = secs / 86400;
          unsigned long hours = (secs % 86400) / 3600;
          unsigned long minutes = (secs % 3600) / 60;
          unsigned long seconds = secs % 60;
          std::string result;
          if (id(my_hmi_page_index) == 0) {
            if (days > 0) {
              result = to_string(days) + "d " + to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
            } else if (hours > 0) {
              result = to_string(hours) + "h" + to_string(minutes) + "m" + to_string(seconds) + "s";
            } else if (minutes > 0) {
              result = to_string(minutes) + "m" + to_string(seconds) + "s";
            } else {
              result = to_string(seconds) + "s";
            }
            result.insert(0, 12 - result.length(), ' ');
            id(hmi_show_param_value).execute(220 + 512, 0, result);
          }
          else if (id(my_hmi_page_index) == 1) {
            if (id(my_wash_running_flag) == 1) {
              std::string msg;
              msg += (char)0xD5; msg += (char)0xFD;
              msg += (char)0xD4; msg += (char)0xDA;
              msg += (char)0xCF; msg += (char)0xB4;
              msg += (char)0xB3; msg += (char)0xB5;
              msg += ": ";
              msg += to_string(id(my_wash_timer));
              id(hmi_1_show_param_value).execute(600, 200, msg);
            }
          }

  - interval: 6s
    then:
      - uart.write:
          id: uart_2
          data: 'hello\r\n'

web_server:
  local: true 

text_sensor:
  - platform: template
    name: "00-serial"
    id: read_only_numbers
    lambda: |-
      int i;
      for (i=0; i<$DEV_ID_LENGTH; i++)
      {
        if ( (id(my_global_id).c_str()[i] < '0') || (id(my_global_id).c_str()[i] > '9') )
          break;
      }
      if ( i == $DEV_ID_LENGTH )
      {
        auto call = id(light_rgb_id).turn_on();
        // set parameters (optional)
        call.set_brightness(0.5); // 1.0 is full brightness
        call.set_rgb(0, 1, 0);
        // perform action:
        call.perform();
      }
      else
      {
        auto call = id(light_rgb_id).turn_on();
        // set parameters (optional)
        call.set_brightness(0.5); // 1.0 is full brightness
        call.set_rgb(1, 0, 0);
        // perform action:
        call.perform();
      }
      return id(my_global_id);

globals:
    - id: my_global_id
      type: std::string
      restore_value: no
      max_restore_data_length: 10
    - id: my_uart_recv_buf
      type: unsigned char[${MAX_UART_RECV_BUF_LEN}]
      restore_value: no
    - id: my_uart_recv_read
      type: int
      restore_value: no
    - id: my_uart_recv_write
      type: int
      restore_value: no
    - id: my_uart_recv_delay
      type: int
      restore_value: no
    - id: my_mqtt_conn_flag
      type: int
      restore_value: no
      initial_value: '0'
    - id: my_hmi_page_index
      type: int
      restore_value: no
      initial_value: '1'
    - id: my_user_code_buf
      type: unsigned char[${USER_CODE_LENGTH}]
      restore_value: no
    - id: my_user_code_cnt
      type: int
      restore_value: no
      initial_value: '0'
    - id: my_page_init_flag
      type: int
      restore_value: no
      initial_value: '0'
    - id: my_wash_timer
      type: int
      restore_value: no
      initial_value: '0'
    - id: my_wash_running_flag
      type: int
      restore_value: no
      initial_value: '0'

i2c_eeprom:
  - id: eeprom_1
    size: 32KB
    i2c_id: iic_bus
    address: 0x50
    on_setup:
      then:
        - lambda: |-
            uint8_t prev_state[9];
            int i;
            memset(prev_state, 0x00, sizeof(prev_state));
            if(!eeprom_1->get(0x0001, prev_state, sizeof(prev_state)-1)){
              ESP_LOGE("eeprom","Reading prev");
              return;
            }
            ESP_LOGD("eeprom","Prev 0x%02X, 0x%02X", prev_state[0], prev_state[1]);
            for (i=0; i<$DEV_ID_LENGTH; i++)
            {
              if ( (prev_state[i] < '0') || (prev_state[i] > '9') )
                break;
            }
            if ( i == $DEV_ID_LENGTH )
            {
              id(my_global_id).clear();
              id(my_global_id) += (char *)&prev_state[0];
            }
            ESP_LOGI("main", "board id %s", id(my_global_id).c_str());

i2c:
  sda: GPIO41
  scl: GPIO42
  id: iic_bus
  frequency: 200kHz


  - id: hmi_show_relay_icon
    parameters:
      pos_x: int
      pos_y: int
      icon: int
    mode: single
    then:
      - lambda: |-
          if (id(my_hmi_page_index) != 0) {
            return;
          }
          unsigned char aucTempBuf[14];
          aucTempBuf[0] = 0xaa;
          aucTempBuf[1] = 0x97;
          aucTempBuf[2] = pos_x >> 8;
          aucTempBuf[3] = pos_x & 0xff;
          aucTempBuf[4] = pos_y >> 8;
          aucTempBuf[5] = pos_y & 0xff;
          aucTempBuf[6] = 0x3a;
          aucTempBuf[7] = 0x01;
          aucTempBuf[8] = icon >> 8;
          aucTempBuf[9] = icon & 0xff;
          aucTempBuf[10] = 0xcc;
          aucTempBuf[11] = 0x33;
          aucTempBuf[12] = 0xc3;
          aucTempBuf[13] = 0x3c;
          uart_write_bytes((uart_port_t) 0, aucTempBuf, 14);


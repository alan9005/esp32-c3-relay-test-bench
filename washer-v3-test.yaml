  - id: uart_proc_hex
    mode: single
    then:
      - lambda: |-
          static switch_::Switch* all_relays[] = {
            id(relay_01), id(relay_02), id(relay_03), id(relay_04), id(relay_05), id(relay_06), id(relay_07), id(relay_08),
            id(relay_09), id(relay_10), id(relay_11), id(relay_12), id(relay_13), id(relay_14), id(relay_15), id(relay_16)
          };
          unsigned char aucData[2];
          int iRecvCnt;
          unsigned char aucTempBuf[${MAX_UART_RECV_BUF_LEN}];
          int iLength = uart_read_bytes((uart_port_t) 0, aucData, 1, 0);
          if ( iLength > 0 )
          {
            id(my_uart_recv_delay) = 0;
            if ( ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN}) != id(my_uart_recv_read) )
            {
              id(my_uart_recv_buf)[id(my_uart_recv_write)] = aucData[0];
              id(my_uart_recv_write) = ((id(my_uart_recv_write) + 1) % ${MAX_UART_RECV_BUF_LEN});
            }
            else
            {
              ESP_LOGD("main", "HMI屏幕数据溢出!");               
            }

            if ( id(my_uart_recv_write) >= id(my_uart_recv_read) )
            {
              iRecvCnt = id(my_uart_recv_write) - id(my_uart_recv_read);
            }
            else
            {
              iRecvCnt = id(my_uart_recv_write) + ${MAX_UART_RECV_BUF_LEN} - id(my_uart_recv_read);
            }
            
            int iPos = id(my_uart_recv_read);
            memset(aucTempBuf, 0x00, sizeof(aucTempBuf));
            for ( int iLoop=0; iLoop<iRecvCnt; iLoop++ )
            {
              aucTempBuf[iLoop] = id(my_uart_recv_buf)[iPos];
              iPos = ((iPos + 1) % ${MAX_UART_RECV_BUF_LEN});
            }
            if ( iRecvCnt >= 6 )
            {
              if ( (aucTempBuf[0] != 0xaa) )
              {
                id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
              }
              else
              {
                if ( iRecvCnt == 6 )
                {
                  if ( (aucTempBuf[1] == 0x00) && (aucTempBuf[2] == 0xcc) && (aucTempBuf[3] == 0x33) && (aucTempBuf[4] == 0xc3) && (aucTempBuf[5] == 0x3c) )
                  {
                    id(my_uart_recv_read) = ((id(my_uart_recv_read) + 6) % ${MAX_UART_RECV_BUF_LEN});
                    ESP_LOGD("main", "get HMI response 00"); 
                    /*int param1,param2,param3;
                    int iLoop, iIndex;
                    std::string tmp_str;
                    int iCnt = 0;
                    for (const auto& byte : aucTempBuf) 
                    {
                        char buffer[3];
                        snprintf(buffer, sizeof(buffer), "%02x", byte);
                        tmp_str += buffer;
                        tmp_str += " ";
                        iCnt++;
                        if ( iCnt >= iRecvCnt )
                        {
                          break;
                        }
                    }
                    id(global_hmi_recv).publish_state(tmp_str.c_str());*/
                  }
                }
                else if ( iRecvCnt == 8 )
                {
                  if ( (aucTempBuf[1] == 0x78) && (aucTempBuf[4] == 0xcc) && (aucTempBuf[5] == 0x33) && (aucTempBuf[6] == 0xc3) && (aucTempBuf[7] == 0x3c) )
                  {
                    if ( (aucTempBuf[3] > 0) && (aucTempBuf[3] <= 16) )
                    {
                      int iIndex;
                      iIndex = aucTempBuf[3] - 1;
                      if ( all_relays[iIndex]->state )
                      {
                        all_relays[iIndex]->turn_off();
                        ESP_LOGI("HMI", "turn off relay %d", iIndex + 1); 
                      }
                      else
                      {
                        all_relays[iIndex]->turn_on();
                        ESP_LOGI("HMI", "turn on relay %d", iIndex + 1); 
                      }
                    }
                    else if( (aucTempBuf[3] >= 0x2d) && (aucTempBuf[3] <= 0x2e) )
                    {
                      int iIndex;
                      iIndex = aucTempBuf[3] - 0x2d + 1;
                      id(washer_send_cmd).execute(iIndex, "HMI", "");
                    }
                    else if( (aucTempBuf[3] >= 0x15) && (aucTempBuf[3] <= 0x1c) )
                    {
                      int iIndex;
                      iIndex = aucTempBuf[3] - 0x15 + 1 + 2;
                      id(washer_send_cmd).execute(iIndex, "HMI", "");
                    }
                    else if( (aucTempBuf[3] >= 0x1d) && (aucTempBuf[3] <= 0x26) )
                    {
                      if ( id(my_user_code_cnt) < ${USER_CODE_LENGTH} )
                      {
                        for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++ )
                        {
                          id(my_user_code_buf)[iLoop] = id(my_user_code_buf)[iLoop+1];
                        }
                        id(my_user_code_buf)[${USER_CODE_LENGTH}-1] = aucTempBuf[3] - 0x1d + '0';
                        id(my_user_code_cnt)++;
                        id(hmi_clear_user_code).execute();
                        for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++ )
                        {
                          id(hmi_show_user_code).execute(224 + iLoop * 82, 176, id(my_user_code_buf)[iLoop]);
                        }
                        if ( id(my_wash_running_flag) == 0 ) {
                          id(hmi_clear_pass_err).execute();
                        }
                      }
                    }
                    else if( aucTempBuf[3] == 0x27 )
                    {
                      id(my_user_code_cnt) = 0;
                      for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++ )
                      {
                        id(my_user_code_buf)[iLoop] = ' ';
                      }
                      id(hmi_clear_user_code).execute();
                      if ( id(my_wash_running_flag) == 0 ) {
                        id(hmi_clear_pass_err).execute();
                      }
                    }
                    else if( aucTempBuf[3] == 0x28 )
                    {
                      if ( id(my_wash_running_flag) == 1 )
                      {
                        id(my_wash_running_flag) = 0;
                        id(hmi_show_page).execute(id(my_hmi_page_index));
                      }
                      else
                      {
                        if ( (id(my_user_code_buf)[0]=='1') && (id(my_user_code_buf)[1]=='2') && (id(my_user_code_buf)[2]=='3') && (id(my_user_code_buf)[3]=='4') )
                        {
                          for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++ )
                          {
                            id(my_user_code_buf)[iLoop] = ' ';
                          }
                          id(hmi_clear_user_code).execute();
                          id(my_user_code_cnt) = 0;
                          id(my_wash_running_flag) = 1;
                          id(my_wash_timer) = 0;
                          id(hmi_show_page1_icon).execute(584, 383, 0x3b);
                        }
                        else if ( (id(my_user_code_buf)[0]=='9') && (id(my_user_code_buf)[1]=='9') && (id(my_user_code_buf)[2]=='8') && (id(my_user_code_buf)[3]=='8') )
                        {
                          id(my_user_code_cnt) = 0;
                          for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++ )
                          {
                            id(my_user_code_buf)[iLoop] = ' ';
                          }
                          id(my_page_init_flag) = 0;
                        }
                        else
                        {
                          ESP_LOGE("HMI", "invalid password"); 
                          id(hmi_clear_user_code).execute();
                          id(hmi_show_page1_icon).execute(600, 200, 0x39);
                        }
                      }
                    }
                    else if( aucTempBuf[3] == 0x2a )
                    {
                      id(my_page_init_flag) = 1;
                    }
                    id(my_uart_recv_read) = ((id(my_uart_recv_read) + 8) % ${MAX_UART_RECV_BUF_LEN});
                    ESP_LOGD("main", "get HMI key %d", aucTempBuf[3]);
                  }
                }
                else if ( iRecvCnt > 32 )
                {
                  id(my_uart_recv_read) = ((id(my_uart_recv_read) + 1) % ${MAX_UART_RECV_BUF_LEN});
                }
              }
            }
          }
          else if ( id(my_uart_recv_delay) > 1 )
          {
            if ( id(my_uart_recv_write) != id(my_uart_recv_read) )
            {
              ESP_LOGD("main", "HMI recv wrong date, recv_write[%d], recv_read[%d], now reset them", id(my_uart_recv_write), id(my_uart_recv_read)); 
              id(my_uart_recv_write) = id(my_uart_recv_read);
            }
          }

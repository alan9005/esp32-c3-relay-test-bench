#适配电箱控制板硬件 2026-8-3 V03
external_components:
  - source: my_components
    components: [i2c_eeprom]

substitutions:
  DEV_FIRMWARE_VER: "v3-1.0.3-2026.4.11"
  MAX_UART_RECV_BUF_LEN: "254"
  MAX_UART_SEND_BUF_LEN: "254"
  MAX_SLAVE_NUM: "100"
  DEV_ID_LENGTH: "5"
  USER_CODE_LENGTH: "4"

esphome:
  name: washer-v3-test
  friendly_name: washer-v3-test
  on_boot:
   priority: 200

   then:
      - lambda: |-
          ESP_LOGI("INIT", "首次上电初始化");
          id(my_hmi_page_index) = 1;
          id(hmi_show_clear_all).execute();
          delay(2);
          id(hmi_show_page).execute(id(my_hmi_page_index));
          delay(2);
          static switch_::Switch* all_relays[] = {
            id(relay_01), id(relay_02), id(relay_03), id(relay_04), id(relay_05), id(relay_06), id(relay_07), id(relay_08),
            id(relay_09), id(relay_10), id(relay_11), id(relay_12), id(relay_13), id(relay_14), id(relay_15), id(relay_16)
          };
          for ( int iIndex=0; iIndex<16; iIndex++ )
          {
            all_relays[iIndex]->turn_off();
            delay(1);
          }
          for ( int iLoop=0; iLoop<${USER_CODE_LENGTH}; iLoop++)
          {
            id(my_user_code_buf)[iLoop] = ' ';
          }
          ESP_LOGI("INIT", "关闭所有继电器");

  on_loop:
    then:
      - script.execute: uart_proc_hex

